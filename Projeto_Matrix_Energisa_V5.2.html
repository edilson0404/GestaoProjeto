/* ---------------- Análise e status (somente dados cadastrados) ---------------- */
function analise(){
  const t=todayISO(),k=kpis();const pos=[],att=[],rsk=[],act=[];
  frentesSorted().forEach(f=>{const p=frentePct(f);if(p==null)return;const pl=frentePct(f,a=>plannedAt(a,t))||0;
    if(p>=100)pos.push(`${f.nome} concluída em 100%.`);
    else if(p-pl>=10)pos.push(`${f.nome} está ${r0(p-pl)} p.p. acima do planejado (${r0(p)}% × ${r0(pl)}%).`);
    else if(pl-p>15)att.push(`${f.nome} está ${r0(pl-p)} p.p. abaixo do avanço planejado (${r0(p)}% realizado × ${r0(pl)}% planejado).`)});
  const rec=S.atividades.filter(a=>a.concluidaEm&&dayDiff(a.concluidaEm,t)<=7&&dayDiff(a.concluidaEm,t)>=0);
  if(rec.length)pos.push(`${rec.length} atividade(s) concluída(s) nos últimos 7 dias.`);
  const dp=docPct();if(S.documentos.length&&dp>=80)pos.push(`Documentação ${r0(dp)}% completa.`);else if(S.documentos.length&&dp<50)att.push(`Documentação apenas ${r0(dp)}% completa (${S.documentos.filter(d=>d.status!=='Completo').length} documento(s) não concluídos).`);
  if(day1Info().liberado)pos.push('Checklist do Day 1 com todos os itens obrigatórios concluídos.');
  if(k.plan-k.pct>8)att.push(`Projeto ${r0(k.plan-k.pct)} p.p. abaixo do planejado para hoje (${r0(k.pct)}% × ${r0(k.plan)}%).`);
  S.atividades.filter(a=>a.status==='Bloqueado'&&+a.pct<100).forEach(a=>att.push(`"${a.nome}" está bloqueada${respNomes(a)?' ('+respNomes(a)+')':''}.`));
  S.atividades.filter(a=>+a.pct>0&&+a.pct<100&&depsPendentes(a).length).slice(0,3).forEach(a=>att.push(`"${a.nome}" avança com dependência pendente: ${depsPendentes(a).map(d=>'"'+d.nome+'"').join(', ')}.`));
  S.licencas.filter(l=>licFalta(l)>0).forEach(l=>{att.push(`Licenças insuficientes: ${l.produto} (faltam ${licFalta(l)}).`);act.push(`Providenciar ${licFalta(l)} licença(s) de ${l.produto}${pessoaNome(l.responsavelId)?' — '+pessoaNome(l.responsavelId):''}.`)});
  const pAtr=S.pendencias.filter(p=>p.status!=='Resolvida'&&p.prazo&&p.prazo<t);
  if(pAtr.length)att.push(`${pAtr.length} pendência(s) com prazo vencido.`);
  RISCOS().filter(r=>r.status!=='Encerrado'&&r.status!=='Mitigado'&&['Crítico','Alto'].includes(riscoNivel(r))).sort((a,b)=>riscoScore(b)-riscoScore(a)).forEach(r=>{
    rsk.push(`${r.risco} — criticidade ${riscoNivel(r).toLowerCase()} (${r.probabilidade}×${r.impacto})${r.prazo?', prazo '+fmtD(r.prazo):''}.`);
    if(r.plano)act.push(`${r.plano}${pessoaNome(r.responsavelId)?' — '+pessoaNome(r.responsavelId):''}`)});
  const atr=S.atividades.filter(a=>situacao(a,t)==='atrasada').sort((a,b)=>PRIORIDADES.indexOf(b.prioridade)-PRIORIDADES.indexOf(a.prioridade)||(a.fim||'').localeCompare(b.fim||''));
  atr.filter(a=>['Alta','Crítica'].includes(a.prioridade)).forEach(a=>rsk.push(`"${a.nome}" atrasada desde ${fmtD(a.fim)} com ${a.pct}% (prioridade ${a.prioridade.toLowerCase()}).`));
  atr.slice(0,4).forEach(a=>act.push(`Concluir ou replanejar "${a.nome}"${respNomes(a)?' — '+respNomes(a):''} (prazo vencido em ${fmtD(a.fim)}).`));
  S.atividades.filter(a=>situacao(a,t)!=='concluida'&&situacao(a,t)!=='atrasada'&&a.fim&&dayDiff(t,a.fim)>=0&&dayDiff(t,a.fim)<=3&&+a.pct<50&&['Alta','Crítica'].includes(a.prioridade))
    .forEach(a=>rsk.push(`"${a.nome}" vence em ${dayDiff(t,a.fim)} dia(s) com ${a.pct}%.`));
  const bloq=new Set();S.atividades.filter(a=>+a.pct<100&&a.inicio&&dayDiff(t,a.inicio)<=7).forEach(a=>depsPendentes(a).forEach(d=>{if(!bloq.has(d.id)&&situacao(d,t)!=='concluida'){bloq.add(d.id);act.push(`Destravar "${d.nome}" para liberar "${a.nome}" (início ${fmtDs(a.inicio)}).`)}}));
  S.pendencias.filter(p=>p.prioridade==='Crítica'&&p.status!=='Resolvida').forEach(p=>act.push(`Resolver pendência crítica "${p.pendencia}"${pessoaNome(p.responsavelId)?' — '+pessoaNome(p.responsavelId):''}${p.prazo?' (prazo '+fmtD(p.prazo)+')':''}.`));
  extraAnalise(pos,att,rsk,act);
  const lim=a=>a.slice(0,9);return {pos:lim(pos),att:lim(att),rsk:lim(rsk),act:lim([...new Set(act)])};
}

let dlP=null;
async function saveFile(filename,data){
  try{
    if(window.claude&&typeof window.claude.use==='function'){if(!dlP)dlP=window.claude.use('downloads');const dl=await dlP;
      if(dl){await dl.save({filename,data});toast('Arquivo salvo: '+filename);return}}
  }catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited'){toast('Já existe um download aguardando confirmação.','err');return}
    if(c&&!['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)){toast('Não foi possível gerar o arquivo ('+c+').','err');return}}
  const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function svgToCanvas(svg,w,h){return new Promise((res,rej)=>{const sc=Math.min(2,14000/w,14000/h);const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res({canvas:c})};
  img.onerror=()=>{toast('Não foi possível converter a imagem.','err');rej()};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}

/* ---------------- Importação ---------------- */
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res(i.files[0]||null);i.remove()};i.click()})}
const nk=k=>String(k).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9%]/g,'');
const COLMAP={frente:'frente',frentedetrabalho:'frente',workstream:'frente',macroatividade:'macro',macro:'macro',atividade:'nome',nome:'nome',tarefa:'nome',responsavel:'resp',responsaveis:'resp',
  inicio:'inicio',datainicial:'inicio',datadeinicio:'inicio',fim:'fim',datafinal:'fim',prazo:'fim',termino:'fim',status:'status','%':'pct',percentual:'pct',pct:'pct',conclusao:'pct','%conclusao':'pct',
  prioridade:'prioridade',peso:'peso',fase:'fase',usina:'usina',usinas:'usina',observacao:'obs',obs:'obs',observacoes:'obs'};
function anyToISO(v){if(v==null||v==='')return '';if(v instanceof Date&&!isNaN(v))return isoOf(v);
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(m[2])+'-'+pad(m[1])}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:''}
function anyToPct(v){if(v==null||v==='')return 0;if(typeof v==='number')return clamp(v>0&&v<=1&&!Number.isInteger(v)?v*100:v===1&&false?100:v);const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:clamp(n)}
async function importExcel(){
  if(readOnly)return toast('Modo somente leitura.','err');if(!needLib('Excel',window.XLSX))return;
  const f=await pickFile('.xlsx,.xls,.csv');if(!f)return;
  let rows;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''})}catch(e){return toast('Não foi possível ler o arquivo. Use .xlsx ou .csv.','err')}
  const recs=rows.map(r=>{const o={};Object.keys(r).forEach(k=>{const m=COLMAP[nk(k)];if(m&&o[m]==null)o[m]=r[k]});return o}).filter(o=>String(o.nome||'').trim());
  if(!recs.length)return toast('Nenhuma linha com a coluna "Atividade" foi encontrada.','err');
  const novasF=new Set(recs.map(r=>String(r.frente||'Importadas').trim()).filter(n=>!S.frentes.some(f=>nk(f.nome)===nk(n))));
  openModal({title:'Importar atividades',body:`<div style="padding:16px 20px"><p><b>${recs.length}</b> atividade(s) encontradas em "${esc(f.name)}".</p>${novasF.size?`<p class="small muted">Frentes novas que serão criadas: ${esc([...novasF].join(', '))}.</p>`:''}<p class="small muted">Pessoas, macroatividades, fases e usinas são associadas pelo nome; nomes desconhecidos de pessoas e macroatividades são cadastrados automaticamente.</p></div>`,
    footer:`<button class="btn" data-n>Cancelar</button><button class="btn primary" data-y>Importar ${recs.length} atividade(s)</button>`,onMount:(bg,close)=>{$('[data-n]',bg).onclick=close;$('[data-y]',bg).onclick=()=>{doImport(recs);close()}}});
}
function doImport(recs){
  let n=0;
  recs.forEach(r=>{
    const fn=String(r.frente||'Importadas').trim();let fr=S.frentes.find(f=>nk(f.nome)===nk(fn));if(!fr){fr={id:uid('fre'),nome:fn,responsavelId:'',prioridade:'Média',peso:1,prazo:'',ordem:S.frentes.length,obs:''};S.frentes.push(fr)}
    const mn=String(r.macro||'Geral').trim();let m=S.macros.find(x=>x.frenteId===fr.id&&nk(x.nome)===nk(mn));
    const fz=String(r.fase||'').trim();const fase=fz?S.fases.find(x=>nk(x.nome).includes(nk(fz))||nk(fz).includes(nk(x.nome))):null;
    if(!m){m={id:uid('mac'),frenteId:fr.id,nome:mn,faseId:fase?fase.id:'',peso:1,ordem:S.macros.filter(x=>x.frenteId===fr.id).length};S.macros.push(m)}
    const resp=String(r.resp||'').split(/[,;\/]/).map(x=>x.trim()).filter(Boolean).map(nm=>{let p=S.pessoas.find(x=>nk(x.nome)===nk(nm));if(!p){p={id:uid('pes'),nome:nm,empresa:'',cargo:'',funcao:'',frenteIds:[fr.id],email:'',telefone:'',whatsapp:'',local:'',obs:'Cadastrada pela importação'};S.pessoas.push(p)}return p.id});
    const us=String(r.usina||'').split(/[,;\/]/).map(x=>x.trim()).filter(Boolean).map(nm=>(S.usinas.find(u=>nk(u.nome)===nk(nm))||{}).id).filter(Boolean);
    const st=STATUS.find(s=>nk(s)===nk(r.status||''))||'Não iniciado';const pr=PRIORIDADES.find(s=>nk(s)===nk(r.prioridade||''))||'Média';
    const a={id:uid('ati'),macroId:m.id,faseId:fase?fase.id:(m.faseId||''),nome:String(r.nome).trim(),responsavelIds:resp,usinaIds:us,inicio:anyToISO(r.inicio),fim:anyToISO(r.fim),status:st,pct:anyToPct(r.pct),
      prioridade:pr,peso:r.peso===''||r.peso==null?1:Number(r.peso)||1,dependeDe:[],obs:String(r.obs||''),evidencia:'',concluidaEm:'',subs:[],ordem:S.atividades.filter(x=>x.macroId===m.id).length};
    syncActivity(a,null);S.atividades.push(a);bumpPessoasFrentes(a);n++;
  });
  logChange('Importação','Excel/CSV','Atividades importadas','',String(n));commit();toast(n+' atividade(s) importada(s).');
}
async function importBackup(){
  if(readOnly)return toast('Modo somente leitura.','err');const f=await pickFile('.json,application/json');if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.atividades))throw 0;
    if(!await askConfirm('Substituir todos os dados atuais pelo backup "'+f.name+'"?','Substituir'))return;S=normalize(d);logChange('Projeto',S.meta.nome,'Backup restaurado','',f.name);commit();toast('Backup restaurado.')}
  catch(e){toast('Arquivo de backup inválido.','err')}
}

/* ---------------- Eventos globais e inicialização ---------------- */
function bindGlobal(){
  $('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)});
  $('#btnStatus').onclick=openStatusModal;
  $('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
  $('#syncBar').addEventListener('click',e=>{if(e.target.closest('[data-gocfg]')){e.preventDefault();go('config')}if(e.target.closest('[data-dlcon]')){e.preventDefault();const c=SB.cfg||getCfg();if(c)saveFile('projeto-matrix-energisa-v5-2.html',new Blob([htmlConectado(c)],{type:'text/html'}))}});
  $('#content').addEventListener('click',async e=>{
    const el=e.target.closest('[data-edit],[data-del],[data-new],[data-mv],[data-act],[data-goto],[data-status],[data-exp]');if(!el||el.disabled)return;
    if(el.tagName==='A')e.preventDefault();
    const d=el.dataset;
    if(d.edit)return openForm(d.edit,d.id);
    if(d.del){if(await removeRecord(d.del,d.id))commit();return}
    if(d.new)return openForm(d.new,null,d.def?JSON.parse(d.def):(VIEW==='atividades'&&FILT.frente&&d.new==='macros'?{frenteId:FILT.frente}:null));
    if(d.mv)return moveOrder(d.mv,d.id,+d.dir,d.grp);
    if(d.act)return openForm('atividades',d.act);
    if(d.goto)return go(d.goto);
    if(d.status!=null&&el.hasAttribute('data-status'))return openStatusModal();
    if(d.exp){const [w,k]=d.exp.split('-');if(w==='gantt')exportGantt(k);else exportArch(k)}
  });
}

  if(best<2)return {err:'Não reconheci o cabeçalho. Copie a planilha incluindo a linha de títulos das colunas (ex.: UFV, Sigla, Palo Alto…).'};
  const {m}=mapRow(rows[bi]);if(!m.some(x=>x&&(x.name||x.sigla||x.k==='sigla')))return {err:'O cabeçalho precisa ter a coluna da usina (UFV/UFVs) ou a Sigla.'};

  return {recs,cols:m.filter(Boolean).length};
}

function parseCSV(t,sep){const out=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===sep){row.push(f);f=''}else if(ch==='\n'){row.push(f);out.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
  if(f||row.length){row.push(f);out.push(row)}return out}
async function importDDcsv(){
  if(readOnly)return toast('Modo somente leitura.','err');const f=await pickFile('.csv,.txt');if(!f)return;
  const buf=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}
  const sep=(t.split('\n').find(l=>/^"?ID"?[;,\t]/.test(l))||';').match(/[;,\t]/)[0];const rows=parseCSV(t,sep);
  const hi=rows.findIndex(r=>nk(r[0])==='id');if(hi<0)return toast('Não encontrei a linha de cabeçalho começando por "ID".','err');
  const H=rows[hi].map(nk);const col=(...ks)=>H.findIndex(h=>ks.some(k=>h.startsWith(k)));
  const ix={id:0,dominio:col('dominio'),pergunta:col('pergunta'),evidEsperada:col('evidenciareferenciaesperada'),situacao:col('situacao'),resposta:col('resposta'),evidencia:H.findIndex((h,i)=>h.startsWith('evidencia')&&i!==col('evidenciareferenciaesperada')),responsavel:col('responsavel'),obs:col('observ'),criticidade:col('critic')};
  const clean=s=>String(s||'').replace(/\\n/g,' / ').replace(/\s+/g,' ').trim();
  const recs=rows.slice(hi+1).filter(r=>/^[A-Z]+-[A-Z]+-\d+/.test((r[0]||'').trim())).map(r=>{const o={};Object.entries(ix).forEach(([k,i])=>o[k]=i>=0?clean(r[i]):'');return o});
  if(!recs.length)return toast('Nenhum item com ID (ex.: M-GOV-01) foi encontrado.','err');
  const novos=recs.filter(r=>!S.dd.some(x=>x.id===r.id)).length;
  if(!await askConfirm(`${recs.length} item(ns) no arquivo: ${novos} novo(s) e ${recs.length-novos} atualização(ões). Frente relacionada e "ação para a migração" que você já preencheu são mantidas.`,'Importar'))return;
  recs.forEach(r=>{const x=S.dd.find(y=>y.id===r.id);if(x){Object.keys(r).forEach(k=>{if(r[k]!==''||k==='resposta'||k==='situacao')x[k]=r[k]})}else S.dd.push({...r,criticidade:r.criticidade||'Média',situacao:r.situacao||'Pendente',frenteId:'',acao:''})});
  logChange('Importação','Due diligence TI/OT','Itens importados','',String(recs.length));commit();toast('Questionário importado.');
}

create table if not exists public.super_usuario (
  user_id uuid primary key references auth.users(id) on delete cascade,
  criado_em timestamptz not null default now());

-- 3) Funções de acesso (o super usuário conta como administrador ativo)
create or replace function public.eh_super() returns boolean language sql stable security definer set search_path = public as $$
  select exists(select 1 from super_usuario where user_id = auth.uid()) $$;
create or replace function public.eh_super_id(uid uuid) returns boolean language sql stable security definer set search_path = public as $$
  select exists(select 1 from super_usuario where user_id = uid) $$;
create or replace function public.eh_ativo() returns boolean language sql stable security definer set search_path = public as $$
  select eh_super() or exists(select 1 from perfis where user_id = auth.uid() and ativo) $$;
create or replace function public.eh_admin() returns boolean language sql stable security definer set search_path = public as $$
  select eh_super() or exists(select 1 from perfis where user_id = auth.uid() and ativo and papel = 'admin') $$;
create or replace function public.pode_editar() returns boolean language sql stable security definer set search_path = public as $$
  select eh_admin() or (eh_ativo() and exists(
    select 1 from config_app c, jsonb_each_text(c.valor) e
    where c.id = 'permissoes' and e.value = 'true')) $$;
create or replace function public.novo_perfil() returns trigger language plpgsql security definer set search_path = public as $$
declare tem_admin boolean;
begin
  select exists(select 1 from perfis where papel = 'admin') into tem_admin;
  insert into perfis(user_id, email, nome, papel, ativo)
  values (new.id, new.email, coalesce(new.raw_user_meta_data->>'nome', new.email),
          case when tem_admin then 'usuario' else 'admin' end, not tem_admin)
  on conflict (user_id) do nothing;
  return new;
end $$;
create or replace function public.guardar_versao() returns trigger language plpgsql security definer set search_path = public as $$
begin
  insert into projeto_versoes(projeto_id, rev, state, updated_by) values (old.id, old.rev, old.state, old.updated_by);
  delete from projeto_versoes where projeto_id = old.id and seq < (
    select min(seq) from (select seq from projeto_versoes where projeto_id = old.id order by seq desc limit 150) t);
  return new;
end $$;

-- 4) Gatilhos (só cria se não existirem)
do $$ begin
  if not exists (select 1 from pg_trigger where tgname = 'trg_novo_perfil') then
    create trigger trg_novo_perfil after insert on auth.users for each row execute function public.novo_perfil();
  end if;
  if not exists (select 1 from pg_trigger where tgname = 'trg_guardar_versao') then
    create trigger trg_guardar_versao before update on public.projeto_estado for each row execute function public.guardar_versao();
  end if;
end $$;

-- 5) Defina aqui o super usuário (troque o e-mail entre aspas)
insert into public.super_usuario(user_id)
  select id from auth.users where lower(email) = lower('SEU_EMAIL_DE_LOGIN_AQUI')
  on conflict (user_id) do nothing;
-- garante que a conta do super usuário esteja liberada como administrador
update public.perfis set papel = 'admin', ativo = true
  where user_id in (select user_id from public.super_usuario) and (papel <> 'admin' or not ativo);

-- 6) Regras de acesso (RLS)
alter table public.projeto_estado enable row level security;
alter table public.projeto_versoes enable row level security;
alter table public.perfis enable row level security;
alter table public.config_app enable row level security;
alter table public.super_usuario enable row level security;
do $$ begin
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='projeto_estado' and policyname='projeto_ler') then
    create policy projeto_ler on public.projeto_estado for select to authenticated using (eh_ativo()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='projeto_estado' and policyname='projeto_criar') then
    create policy projeto_criar on public.projeto_estado for insert to authenticated with check (eh_admin()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='projeto_estado' and policyname='projeto_alterar') then
    create policy projeto_alterar on public.projeto_estado for update to authenticated using (pode_editar()) with check (pode_editar()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='projeto_versoes' and policyname='versoes_ler') then
    create policy versoes_ler on public.projeto_versoes for select to authenticated using (eh_ativo()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='perfis' and policyname='perfis_ler') then
    create policy perfis_ler on public.perfis for select to authenticated using (user_id = auth.uid() or eh_admin()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='config_app' and policyname='config_ler') then
    create policy config_ler on public.config_app for select to authenticated using (eh_ativo()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='config_app' and policyname='config_admin_ins') then
    create policy config_admin_ins on public.config_app for insert to authenticated with check (eh_admin()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='config_app' and policyname='config_admin_upd') then
    create policy config_admin_upd on public.config_app for update to authenticated using (eh_admin()) with check (eh_admin()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='config_app' and policyname='config_publico') then
    create policy config_publico on public.config_app for select to anon, authenticated using (id = 'aparencia'); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='super_usuario' and policyname='super_ler') then
    create policy super_ler on public.super_usuario for select to authenticated using (eh_ativo()); end if;
  -- só é possível "se declarar" super usuário quando ainda não existe nenhum (depois, apenas por este SQL)
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='super_usuario' and policyname='super_primeiro') then
    create policy super_primeiro on public.super_usuario for insert to authenticated
      with check (user_id = auth.uid() and eh_admin() and not exists (select 1 from public.super_usuario)); end if;
end $$;
-- administradores continuam gerenciando usuários, mas não alteram a conta do super usuário
drop policy if exists perfis_admin on public.perfis;
create policy perfis_admin on public.perfis for update to authenticated
  using (eh_admin() and (eh_super() or not eh_super_id(user_id)))
  with check (eh_admin() and (eh_super() or not eh_super_id(user_id)));

-- 7) Registro de permissões (não altera o que já foi salvo)
insert into public.config_app(id, valor) values ('permissoes', '{}'::jsonb) on conflict (id) do nothing;

-- 8) Conferência (somente leitura)
select
  (select count(*) from auth.users)                        as contas_de_login,
  (select count(*) from public.perfis where papel='admin')  as administradores,
  (select count(*) from public.perfis where ativo)          as usuarios_liberados,
  (select count(*) from public.super_usuario)               as super_usuario,
  (select string_agg(u.email, ', ') from public.super_usuario s join auth.users u on u.id = s.user_id) as email_do_super,
  (select count(*) from public.projeto_estado)              as projetos_salvos,
  (select count(*) from public.projeto_versoes)             as versoes_guardadas;`;

async function sbFetch(table,query,opt={},retry=true){
  const c=SB.cfg;const url=c.url.replace(/\/+$/,'')+'/rest/v1/'+table+(query||'');
  const tok=(typeof AUTH!=='undefined'&&AUTH.sess&&!opt.anon)?AUTH.sess.access_token:c.key;
  const h={apikey:c.key,'Content-Type':'application/json'};if(!(tok===c.key&&/^sb_/.test(c.key)))h.Authorization='Bearer '+tok;if(opt.prefer)h.Prefer=opt.prefer;
  const r=await fetch(url,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});
  if(r.status===401&&retry&&typeof AUTH!=='undefined'&&AUTH.sess&&!opt.anon){if(await authRefresh())return sbFetch(table,query,opt,false);authExpired();}
  if(!r.ok){let t='';try{t=await r.text()}catch(e){}const err=new Error('HTTP '+r.status+' '+t.slice(0,200));err.status=r.status;throw err}
  if(r.status===204)return null;const tx=await r.text();return tx?JSON.parse(tx):null;
}
async function sbGetFull(){const r=await sbFetch('projeto_estado',`?id=eq.${encodeURIComponent(sbPid())}&select=state,rev,updated_by,updated_at`);return r&&r[0]?r[0]:null}
const clone=o=>JSON.parse(JSON.stringify(o));const J=x=>JSON.stringify(x);
function keyOf(x){return x&&typeof x==='object'&&!Array.isArray(x)?(x.id!=null?'id:'+x.id:x.k!=null?'k:'+x.k:null):null}
/* fusão em 3 vias: base (última versão sincronizada) × local × remoto — combina edições de pessoas diferentes por registro e por campo */
function merge3(b,l,r){
  if(J(l)===J(r))return l;if(J(l)===J(b))return r;if(J(r)===J(b))return l;
  if(Array.isArray(l)&&Array.isArray(r)&&l.every(x=>keyOf(x))&&r.every(x=>keyOf(x))&&(l.length||r.length)){
    const bm=new Map((Array.isArray(b)?b:[]).filter(keyOf).map(x=>[keyOf(x),x])),lm=new Map(l.map(x=>[keyOf(x),x])),rm=new Map(r.map(x=>[keyOf(x),x]));
    const pick=k=>{const bv=bm.get(k),lv=lm.get(k),rv=rm.get(k);
      if(lv===undefined)return bv!==undefined&&J(rv)===J(bv)?undefined:rv;
      if(rv===undefined)return bv!==undefined&&J(lv)===J(bv)?undefined:lv;
      return merge3(bv,lv,rv)};
    const out=[],seen=new Set();
    r.forEach(x=>{const k=keyOf(x);seen.add(k);const v=pick(k);if(v!==undefined)out.push(v)});
    l.forEach(x=>{const k=keyOf(x);if(seen.has(k))return;seen.add(k);const v=pick(k);if(v!==undefined)out.push(v)});
    return out}
  if(l&&r&&typeof l==='object'&&typeof r==='object'&&!Array.isArray(l)&&!Array.isArray(r)){
    const bo=b&&typeof b==='object'&&!Array.isArray(b)?b:{};const out={};
    new Set([...Object.keys(r),...Object.keys(l)]).forEach(k=>{const bv=bo[k],lv=l[k],rv=r[k];
      if(!(k in l)){if(k in bo&&J(rv)===J(bv))return;out[k]=rv;return}
      if(!(k in r)){if(k in bo&&J(lv)===J(bv))return;out[k]=lv;return}
      out[k]=merge3(bv,lv,rv)});
    return out}
  return l;
}
function sbRemember(){lsSet(LS_BASE,JSON.stringify(SB.base));lsSet(LS_REV,SB.rev||'');lsSet(LS_DIRTY,SB.dirty?'1':'0')}
function hhmm(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function syncBar(kind,html){const b=$('#syncBar');if(!b)return;if(!kind){b.hidden=true;return}b.hidden=false;b.className='sync-bar '+kind;b.innerHTML=html}
async function sbSave(){
  if(!SB.on||SB.saving||!SB.dirty)return;
  if(!SB.ok){clearTimeout(SB.timer);SB.timer=setTimeout(sbConnect,4000);return}
  SB.saving=true;SB.dirty=false;sbRemember();
  try{
    const newRev=uid('rev');S.meta.rev=newRev;const body={state:S,rev:newRev,updated_by:currentUser(),updated_at:new Date().toISOString()};
    const res=await sbFetch('projeto_estado',`?id=eq.${encodeURIComponent(sbPid())}&rev=eq.${encodeURIComponent(SB.rev||'')}`,{method:'PATCH',body,prefer:'return=representation'});
    if(res&&res.length){SB.rev=newRev;SB.base=clone(S);saveLocal();setInd('','Salvo no banco às '+hhmm());syncBar(null)}
    else{const remote=await sbGetFull();
      if(!remote){await sbFetch('projeto_estado','',{method:'POST',body:{id:sbPid(),...body},prefer:'return=minimal'});SB.rev=newRev;SB.base=clone(S);setInd('','Salvo no banco às '+hhmm())}
      else if(remote.rev===SB.rev){S=normalize(clone(remote.state));SB.base=clone(remote.state);SB.dirty=false;saveLocal();render();toast('Você não tem permissão para gravar essa alteração. O projeto foi recarregado.','err')}
      else{S=normalize(merge3(SB.base,S,clone(remote.state)));SB.base=clone(remote.state);SB.rev=remote.rev;SB.dirty=true;saveLocal();if(!modalDepth)render();
        toast(`${remote.updated_by||'Outra pessoa'} salvou ao mesmo tempo. As alterações foram combinadas e serão gravadas.`)}}
  }catch(e){SB.dirty=true;setInd('err','Sem conexão com o banco — tentando de novo');syncBar('err','Sem conexão com o banco. Suas alterações estão guardadas neste computador e serão enviadas assim que a conexão voltar.');clearTimeout(SB.timer);SB.timer=setTimeout(sbSave,8000)}
  finally{SB.saving=false;sbRemember();if(SB.dirty&&SB.ok){clearTimeout(SB.timer);SB.timer=setTimeout(sbSave,400)}}
}
async function sbPoll(){
  if(!SB.on||SB.saving)return;
  if(!SB.ok)return sbConnect();
  try{const r=await sbFetch('projeto_estado',`?id=eq.${encodeURIComponent(sbPid())}&select=rev,updated_by,updated_at`);SB.last=new Date();
    if(r&&r[0]&&r[0].rev!==SB.rev){if(modalDepth)return;const remote=await sbGetFull();if(!remote)return;
      S=normalize(SB.dirty?merge3(SB.base,S,clone(remote.state)):clone(remote.state));SB.base=clone(remote.state);SB.rev=remote.rev;saveLocal();sbRemember();render();
      toast(`Projeto atualizado por ${remote.updated_by||'outra pessoa'}.`);if(SB.dirty)sbSave()}
    if(!SB.dirty)setInd('','Sincronizado · '+hhmm());syncBar(null);if(typeof avisoArquivo==='function')avisoArquivo()}
  catch(e){setInd('err','Sem conexão com o banco');syncBar('err','Sem conexão com o banco. Você pode continuar editando: as alterações ficam guardadas neste computador e são enviadas quando a conexão voltar.')}
}
async function sbAcharProjeto(){
  try{const l=await sbFetch('projeto_estado','?select=id,updated_at&order=updated_at.desc');if(l&&l.length&&!l.some(x=>x.id===sbPid())){const id=l[0].id;

async function sbConnect(){
  try{
    try{const pid=lsGet('pme_sync_pid');if(pid&&SB.cfg&&!SB.cfg.projetoFixo)SB.cfg={...SB.cfg,projeto:pid}}catch(e){}
    let remote=await sbGetFull();
    if(!remote)remote=await sbAcharProjeto();
    if(remote){
      if(SB.dirty&&SB.base){S=normalize(merge3(SB.base,S,clone(remote.state)))}else S=normalize(clone(remote.state));
      SB.base=clone(remote.state);SB.rev=remote.rev;
    }else{
      if(!isAdmin()){SB.ok=false;syncBar('err','O projeto ainda não foi inicializado no banco. Peça ao administrador para entrar primeiro.');return false}
      const rev=uid('rev');S.meta.rev=rev;await sbFetch('projeto_estado','',{method:'POST',body:{id:sbPid(),state:S,rev,updated_by:currentUser(),updated_at:new Date().toISOString()},prefer:'return=minimal'});
      SB.base=clone(S);SB.rev=rev;SB.dirty=false;toast('Banco inicializado com os dados atuais do projeto.');
    }
    SB.ok=true;saveLocal();sbRemember();render();setInd('','Conectado ao banco');syncBar(null);
    if(SB.dirty)sbSave();return true;
  }catch(e){
    SB.ok=false;setInd('err','Sem conexão com o banco');
    syncBar('err',`Não foi possível conectar ao banco (${esc(String(e.message||e).slice(0,140))}). Você pode continuar editando; as alterações serão enviadas quando a conexão voltar.`);

  }
}

    <details class="mt"><summary style="cursor:pointer;font-weight:600">Como configurar (uma vez, cerca de 10 minutos)</summary><ol class="small" style="line-height:1.7">

    if(k==='pessoas'){const strip=x=>J((x||[]).map(q=>({...q,frenteIds:[]})));if(strip(a)===strip(o))return}

  if(!can('atividades_editar')&&J(S.atividades)!==J(b.atividades)){S.atividades=clone(b.atividades);rev.push('ações')}

async function authCall(path,body,method='POST',token){
  const c=SB.cfg;const h={apikey:c.key,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  const r=await fetch(c.url.replace(/\/+$/,'')+'/auth/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const m=(d&&(d.error_description||d.msg||d.message||d.error))||('HTTP '+r.status);const e=new Error(traduzErro(m));e.status=r.status;throw e}
  return d;
}
function traduzErro(m){m=String(m);if(/invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';if(/email not confirmed/i.test(m))return 'E-mail ainda não confirmado. Abra o link enviado por e-mail ou peça ao administrador.';

  if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos.';return m}

      if(t>.25){for(let k=1;k<4;k++){const xx=x+w*k/4;s+=`<line x1="${xx.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(xx-sk).toFixed(1)}" y2="${(y+h).toFixed(1)}" stroke="#cfe3f5" stroke-opacity=".35" stroke-width="${(.3+t*.7).toFixed(2)}"/>`}

      if(Math.abs(x-1000)<420)s+=`<polygon points="${p}" fill="url(#pvh)"/>`;
      x+=w+gap}

async function xlsxRead(buf){

  for(let i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}

  for(let i=0;i<n;i++){if(dv.getUint32(p,true)!==0x02014b50)break;const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));files[name]={method,csize,off};p+=46+nl+el+cl}
  const get=async name=>{const f=files[name]||files[name.replace(/^\//,'')];if(!f)return null;const lh=f.off,nl=dv.getUint16(lh+26,true),el=dv.getUint16(lh+28,true);const data=u8.slice(lh+30+nl+el,lh+30+nl+el+f.csize);
    if(f.method===0)return td.decode(data);if(f.method!==8)throw new Error('Compressão não suportada no .xlsx.');
    const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return td.decode(await new Response(ds).arrayBuffer())};
  const X=s=>new DOMParser().parseFromString(s,'application/xml');const T=(el,tag)=>[...el.getElementsByTagName(tag)];
  const wb=X(await get('xl/workbook.xml'));const rels=X(await get('xl/_rels/workbook.xml.rels')||'<r/>');const relMap={};T(rels,'Relationship').forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const ssx=await get('xl/sharedStrings.xml');const ss=ssx?T(X(ssx),'si').map(si=>T(si,'t').map(t=>t.textContent).join('')):[];
  const col=ref=>{const m=/^([A-Z]+)/.exec(ref||'');if(!m)return -1;let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return c-1};
  const out={SheetNames:[],Sheets:{},Hidden:{}};
  for(const sh of T(wb,'sheet')){const name=sh.getAttribute('name');const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let tgt=relMap[rid]||'';tgt=tgt.startsWith('/')?tgt.slice(1):('xl/'+tgt.replace(/^\.\//,''));const xml=await get(tgt);out.SheetNames.push(name);out.Hidden[name]=sh.getAttribute('state')==='hidden';
    const rows=[];if(xml){const d=X(xml);T(d,'row').forEach(r=>{const ri=(+r.getAttribute('r')||rows.length+1)-1;const row=rows[ri]=rows[ri]||[];
      T(r,'c').forEach((c,ci)=>{let k=col(c.getAttribute('r'));if(k<0)k=ci;const t=c.getAttribute('t');const v=c.getElementsByTagName('v')[0];let val='';
        if(t==='s')val=v?(ss[+v.textContent]??''):'';else if(t==='inlineStr')val=T(c,'t').map(x=>x.textContent).join('');else if(t==='str'||t==='e')val=v?v.textContent:'';else if(t==='b')val=v?v.textContent==='1':'';else val=v&&v.textContent!==''?+v.textContent:'';
        row[k]=val})})}
    for(let i=0;i<rows.length;i++){rows[i]=rows[i]||[];for(let j=0;j<rows[i].length;j++)if(rows[i][j]===undefined)rows[i][j]=''}
    out.Sheets[name]=rows}
  return out;
}

function expandRefs(s){const out=[];String(s||'').split(/[;,\n]/).map(x=>x.trim()).filter(Boolean).forEach(part=>{

function migrate52(s){
  ['vpt','raid','licoes','fluxos'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
  (s.dd||[]).forEach(x=>{if(!x.origem)x.origem=/^N-/.test(x.id||'')?'Negócio':'Matrix'});
  if(Array.isArray(s.riscos)&&s.riscos.length){
    const pm=n=>n<=2?'Baixa':n===3?'Média':'Alta',im=n=>n<=2?'Baixo':n===3?'Médio':n===4?'Alto':'Crítico';
    s.riscos.forEach((r,i)=>{const id='R-APP-'+String(i+1).padStart(3,'0');if(s.raid.some(x=>x.id===id))return;const p=+r.probabilidade||3,m=+r.impacto||3,sc=p*m;
      const pes=(s.pessoas||[]).find(q=>q.id===r.responsavelId),fr=(s.frentes||[]).find(f=>f.id===r.frenteId);
      s.raid.push({id,tipo:'Risco',titulo:r.risco||'',descricao:r.descricao||'',dominio:fr?fr.nome:'',vpt:'',acoes:'',criticidade:sc>=16?'Crítica':sc>=10?'Alta':sc>=5?'Média':'Baixa',probabilidade:pm(p),impacto:im(m),
        status:{'Aberto':'Aberto','Em tratamento':'Em tratamento','Mitigado':'Monitorando','Encerrado':'Encerrado'}[r.status]||'Aberto',owner:pes?pes.nome:'',externo:'',registro:'',prazo:r.prazo||'',tratamento:r.plano||'',contingencia:'',criterio:'',evidencia:'',semaforo:'',obs:'Migrado da antiga aba Riscos'})});
    s.riscos=[]}
  if(Array.isArray(s.caracDef)&&s.caracDef.length)CARAC_52.forEach(([k,g,l,t,al])=>{if(!s.caracDef.some(d=>d.k===k))s.caracDef.push({k,g,l,t,al})});
  s.meta=s.meta||{};if(!s.meta.fluxoSeed){if(!s.fluxos.some(f=>f.id==='flx_janela'))s.fluxos.push(seedFluxo());s.meta.fluxoSeed=1}
  return s;
}

      as.forEach(a=>{const d=a.inicio||'';if(prevD!==null&&d!==prevD)col++;prevD=d;const ln=lid(key(a));const c=Math.max(col,nxt[ln]||0);nxt[ln]=c+1;maxC=Math.max(maxC,c);

      const fim={id:uid('fn'),tipo:'fim',label:'Fim',lane:lid(key(as[as.length-1])),x:FX_LABEL_W+110+(maxC+1)*220,acao:'',resp:'',obs:''};nodes.push(fim);

async function lerPlanilhas(files){

  for(const f of files){const wb=await xlsxRead(await f.arrayBuffer());P.fontes.push(f.name);
    for(const name of wb.SheetNames){const rows=wb.Sheets[name];const key=Object.keys(SHEET_RX).find(k=>SHEET_RX[k].test(name.trim()));if(!key)continue;
      if(key==='qaMatrix'||key==='qaNegocio')P[key]=tblBy(rows,COLS_QA,['id']).filter(r=>/^[A-Z]+-[A-Z]+-\d+/.test(txt(r.id))).map(cleanRec);
      else if(key==='vpt')P.vpt=tblBy(rows,COLS_VPT,['id']).filter(r=>/^V-/.test(txt(r.id))).map(cleanRec);
      else if(key==='raid')P.raid=tblBy(rows,COLS_RAID,['id']).filter(r=>/^[RAID]-\d+/.test(txt(r.id))).map(cleanRec);
      else if(key==='marcos')P.marcos=tblBy(rows,COLS_MARCO,['marcogate']).map(r=>({...cleanRec(r),data:anyToISO(r.data)||txt(r.data)}));

        P.plano=rows.slice(hi+1).filter(r=>txt(r[idx[0]])&&txt(r[idx[3]])).map(r=>idx.map(i=>{if(i<0)return '';const v=r[i];return typeof v==='number'?v:txt(v)}))}
      else if(key==='dadosUsinas'){const h1=findHeader(rows,H=>H.includes('ufv')&&H.includes('rede'));const h2=findHeader(rows,H=>H.includes('usina')&&H.includes('razaosocial'),40);const by={};
        if(h1>=0){const ix=mapCols(rows[h1],{ufv:['ufv'],rede_lan:['rede'],tipo_gw:['tipo'],cftv_emp:['empresacftv'],cnpj:['cnpj'],operadora:['operadoradeinternet'],velocidade:['velocidade'],fidelidade:['hafidelidadeativa'],valor_link:['valormensal','valor']});
          for(let i=h1+1;i<rows.length&&txt(rows[i][ix.ufv]);i++){const o=cleanRec(pick(rows[i],ix));by[nkU(o.ufv)]={...(by[nkU(o.ufv)]||{}),...o,nome:o.ufv}}}
        if(h2>=0){const ix=mapCols(rows[h2],{usina:['usina'],razao:['razaosocial'],cnpj:['cnpj'],endereco:['enderecocadastral'],cep:['cep'],municipio:['municipio'],uf:['uf'],lat:['latitude'],lon:['longitude']});
          for(let i=h2+1;i<rows.length&&txt(rows[i][ix.usina]);i++){const o=cleanRec(pick(rows[i],ix));['lat','lon'].forEach(k=>{const n=+String(o[k]).replace(',','.');if(o[k]&&!isNaN(n))o[k]=String(Math.abs(n)>180?n/1e6:n)});
            const k=Object.keys(by).find(x=>{const y=nkU(o.usina);return x===y||x.includes(y)||y.includes(x)})||nkU(o.usina);by[k]={...(by[k]||{}),...o,nome:by[k]?by[k].nome:o.usina}}}
        P.dadosUsinas=Object.values(by).map(o=>{const r={...o};delete r.ufv;delete r.usina;return r})}
      else if(key==='devN3'){const h1=findHeader(rows,H=>H[0]==='sigla');const h2=findHeader(rows,H=>H.includes('tes')&&H.includes('strings'),40);
        if(h1>=0){const end=h2>=0?h2:rows.length;const d1=rows.slice(h1+1,end).filter(r=>txt(r[0]));P.devN3=rowsTSV([rows[h1],...d1]);
          if(h2>=0){const H2=rows[h2].map(nk),cs=H2.indexOf('sigla'),cu=H2.indexOf('usina');const inv=rows.slice(h2+1).filter(r=>r.some(c=>txt(c))&&!r.some(c=>/^total$/i.test(txt(c))));
            /* as linhas do inventário não têm nome: correspondem, na ordem, às últimas linhas da tabela de cima (a primeira é a usina de referência BV1) */
            const sig=d1.slice(-inv.length).map(r=>txt(r[0]));inv.forEach((r,i)=>{if(cs>=0&&!txt(r[cs]))r[cs]=sig[i]||'';if(cu>=0&&!txt(r[cu])){const t=d1.slice(-inv.length)[i];r[cu]=t?txt(t[2]):''}});
