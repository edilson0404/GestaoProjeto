<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projeto Matrix Energisa v5.2 — Gestão Técnica da Migração de UFVs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2E4F; --navy-2:#123D66; --blue:#1F6FB5; --blue-soft:#E3EEF9;
  --green:#22A06B; --green-soft:#E1F4EA; --amber:#D99A06; --amber-soft:#FBF1D6;
  --orange:#E2711D; --orange-soft:#FCE9DA; --red:#D64545; --red-soft:#FBE4E4;
  --grey:#9AA8B6; --grey-soft:#EEF2F6;
  --ink:#16263A; --muted:#5E7085; --line:#DDE4EC; --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#F8FAFC;
  --shadow:0 1px 2px rgba(11,46,79,.06),0 2px 8px rgba(11,46,79,.05);
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Barlow",system-ui,"Arial Narrow",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#0A2440; --navy-2:#13375C; --blue:#5AA2E8; --blue-soft:#16324F;
    --green:#3CC489; --green-soft:#123B2B; --amber:#F0B92E; --amber-soft:#3D3112;
    --orange:#F08A3E; --orange-soft:#41291A; --red:#F06B6B; --red-soft:#432020;
    --grey:#7D8EA0; --grey-soft:#1D2A38;
    --ink:#E6EDF5; --muted:#9AAABB; --line:#26374A; --bg:#0D1722; --surface:#132130; --surface-2:#172838;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --navy:#0A2440; --navy-2:#13375C; --blue:#5AA2E8; --blue-soft:#16324F;
  --green:#3CC489; --green-soft:#123B2B; --amber:#F0B92E; --amber-soft:#3D3112;
  --orange:#F08A3E; --orange-soft:#41291A; --red:#F06B6B; --red-soft:#432020;
  --grey:#7D8EA0; --grey-soft:#1D2A38;
  --ink:#E6EDF5; --muted:#9AAABB; --line:#26374A; --bg:#0D1722; --surface:#132130; --surface-2:#172838;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.shell{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:var(--navy);color:#DCE7F2;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand-mark{display:flex;align-items:center;gap:10px}
.brand-mark svg{flex:none}
.brand h1{font-family:var(--cond);font-weight:700;font-size:21px;line-height:1.05;margin:0;color:#fff;letter-spacing:.2px}
.brand p{margin:8px 0 0;font-size:12.5px;color:#9FB6CC;line-height:1.35}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:7px;font-size:14.5px;color:#C9D7E5}
.nav button svg{width:17px;height:17px;flex:none;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 #3CC489}
.nav button:focus-visible{outline:2px solid #5AA2E8}
.nav .badge{margin-left:auto;background:#D64545;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 7px}
.side-foot{margin-top:auto;padding:14px 18px 18px;font-size:11.5px;color:#7F98B0;border-top:1px solid rgba(255,255,255,.08)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h2{font-family:var(--cond);font-weight:600;font-size:24px;margin:0;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px}
.top .grow{flex:1}
.menu-btn{display:none}
.content{flex:1;overflow-y:auto;padding:22px 24px 48px}
.save-ind{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save-ind i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.save-ind.saving i{background:var(--amber)}
.save-ind.err i{background:var(--red)}
.demo-pill{font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);padding:3px 10px;border-radius:20px}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--grey-soft)}
.btn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:4px;border-radius:5px;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--grey-soft);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;font-size:14px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f > span{font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.panel > header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel > header h3{margin:0;font-size:16px;font-weight:600}
.panel > header .hint{color:var(--muted);font-size:13px}
.panel .body{padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Hero */
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:22px 24px 18px;position:relative;overflow:hidden}
.hero-top{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.hero h2{font-family:var(--cond);font-size:30px;line-height:1.05;margin:0;font-weight:700}
.hero .obj{color:#B5C9DC;margin:6px 0 0;max-width:62ch;font-size:14.5px}
.hero .meta{display:flex;gap:22px;margin-top:14px;font-size:13px;color:#9FB6CC;flex-wrap:wrap}
.hero .meta b{display:block;color:#fff;font-size:15px;font-weight:600}
.hero .big{margin-left:auto;text-align:right}
.hero .big .n{font-family:var(--cond);font-size:72px;font-weight:700;line-height:.9}
.hero .big .n small{font-size:34px;color:#9FB6CC}
.hero .big .l{font-size:13px;color:#9FB6CC}
.status-pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px}
.st-ok{background:#1E7E55;color:#fff}.st-warn{background:#B98306;color:#fff}.st-crit{background:#B83434;color:#fff}
.phase-strip{margin-top:20px;position:relative}
.phase-strip .segs{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px}
.phase-strip .seg{background:rgba(255,255,255,.08);position:relative;min-width:0;display:flex;align-items:center;padding:0 8px;font-size:12px;color:#C9D7E5;white-space:nowrap;overflow:hidden}
.phase-strip .seg .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#1F6FB5,#22A06B);opacity:.55}
.phase-strip .seg span{position:relative;overflow:hidden;text-overflow:ellipsis}
.phase-strip .today{position:absolute;top:-6px;bottom:-16px;width:2px;background:#F0B92E}
.phase-strip .today::after{content:attr(data-l);position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;color:#F0B92E;white-space:nowrap}
.phase-strip .legend{display:flex;justify-content:space-between;font-size:11.5px;color:#9FB6CC;margin-top:18px}
.plan-real{display:flex;gap:18px;font-size:13px;color:#B5C9DC;margin-top:4px}
.plan-real b{color:#fff}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);border-left:4px solid var(--c,var(--blue))}
.kpi:hover{border-color:var(--c,var(--blue))}
.kpi .n{font-family:var(--cond);font-size:32px;font-weight:700;line-height:1}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}

/* Bars */
.bar{height:8px;background:var(--grey-soft);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--c,var(--blue));border-radius:4px}
.fbars{display:flex;flex-direction:column;gap:9px}
.fbar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 46px;gap:12px;align-items:center;font-size:14px;cursor:pointer;padding:2px 4px;border-radius:5px}
.fbar:hover{background:var(--grey-soft)}
.fbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .pc{text-align:right;font-family:var(--cond);font-weight:700;font-size:17px}
.fbar .bar{height:12px;position:relative}
.fbar .bar .plan{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45}

/* Tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:hover td{background:var(--surface-2)}
.t td.num{text-align:right;font-variant-numeric:tabular-nums}
.t .acts{white-space:nowrap;text-align:right}
.t input[type=number]{width:72px;padding:4px 6px}
.t select{padding:4px 6px;width:auto}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--grey-soft);color:var(--muted);white-space:nowrap}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.orange{background:var(--orange-soft);color:var(--orange)}
.tag.red{background:var(--red-soft);color:var(--red)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.mini-pct{display:flex;align-items:center;gap:8px;min-width:110px}
.mini-pct .bar{flex:1;height:6px}
.mini-pct b{font-size:13px;width:36px;text-align:right}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.filters select,.filters input{width:auto;min-width:0;max-width:180px;padding:5px 8px;font-size:13.5px}
.filters .lbl{font-size:13px;color:var(--muted);font-weight:600}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--grey-soft);border-radius:10px;padding:10px;min-height:200px;max-height:calc(100vh - 250px);overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.kcol.over{outline:2px dashed var(--blue);outline-offset:-2px}
.kcol h4{position:sticky;top:-10px;background:var(--grey-soft);padding:6px 0;z-index:1;margin:0 0 2px;font-size:14px;display:flex;align-items:center;gap:6px}
.kcol h4 .c{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:grab;border-left:4px solid var(--c,var(--grey));font-size:13.5px}
.kcard:active{cursor:grabbing}
.kcard .nm{font-weight:600;line-height:1.3}
.kcard .fr{font-size:12px;color:var(--muted);margin-top:2px}
.kcard .ft{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.kcard .ft .bar{flex:1;height:5px}

/* Tree */
.tree .fr-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:600}
.tree .mc-row{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 30px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.tree .at-row{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 52px;border-bottom:1px solid var(--line);font-size:14px}
.tree .at-row .nm{flex:1;min-width:0}
.tree .su-row{padding:3px 12px 3px 74px;font-size:13px;color:var(--muted)}
.tree .grow{flex:1;min-width:0}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,22,38,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(4vh,env(safe-area-inset-top,0px)) 14px 20px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:min(720px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal.wide{width:min(1180px,100%)}
.modal > header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal > header h3{margin:0;font-size:18px}
.modal .mbody{padding:16px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.modal .mbody .full{grid-column:1/-1}
.modal > footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.multi{border:1px solid var(--line);border-radius:6px;max-height:150px;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:3px;font-weight:400;color:var(--ink);font-size:13.5px}
.multi label{display:flex;gap:7px;align-items:center;cursor:pointer}
.multi input[type=search]{margin-bottom:4px;padding:4px 7px}
.pct-in{display:flex;gap:10px;align-items:center}
.pct-in input[type=range]{flex:1;accent-color:var(--blue)}
.pct-in input[type=number]{width:76px}
.pct-quick{display:flex;gap:4px;margin-top:4px}
.pct-quick button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 8px;font-size:12px;cursor:pointer}
.subs{display:flex;flex-direction:column;gap:6px}
.subs .sr{display:grid;grid-template-columns:24px 1fr 170px 28px;gap:6px;align-items:center}
.req{color:var(--red)}

/* Toast */
.toasts{pointer-events:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:360px}
.toast.err{background:#9E2B2B}

/* Gantt */
.gantt-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:72vh}
.gantt-wrap svg{display:block}
.gantt-wrap .bar-hit{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* Architecture */
.arch-layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
.arch-canvas{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.arch-canvas svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.arch-canvas .node{cursor:move}
.arch-canvas.connecting .node{cursor:crosshair}
.arch-canvas .link-hit{cursor:pointer}
.arch-tabs{display:flex;gap:6px;flex-wrap:wrap}
.arch-help{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--surface);padding:2px 8px;border-radius:5px}

/* Risk matrix */
.rmatrix{display:grid;grid-template-columns:28px repeat(5,1fr);gap:3px;font-size:12px}
.rmatrix .cell{aspect-ratio:1.6;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
.rmatrix .ax{display:flex;align-items:center;justify-content:center;color:var(--muted)}

/* Analysis */
.ana{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ana .col{border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.ana .col h4{margin:0 0 8px;font-size:14.5px;display:flex;gap:7px;align-items:center}
.ana .col ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.ana .col.pos{border-top:4px solid var(--green)}
.ana .col.att{border-top:4px solid var(--amber)}
.ana .col.rsk{border-top:4px solid var(--red)}
.ana .col.act{border-top:4px solid var(--blue)}
.status-text{white-space:pre-wrap;font-size:14.5px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;max-height:60vh;overflow:auto}

/* Day1 */
.d1-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.d1-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--green)}
.d1-item .nm{flex:1;font-weight:500}
.d1-item.done .nm{color:var(--muted);text-decoration:line-through}

.chart-box{position:relative;height:260px}
.chart-box.tall{height:320px}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:14px}
.list-plain li:last-child{border-bottom:0}
.list-plain li .grow{flex:1;min-width:0}
.hist-item{font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.hist-item b{font-weight:600}
.sync-bar{padding:8px 24px;font-size:13.5px;border-bottom:1px solid var(--line)}.sync-bar.warn{background:var(--amber-soft)}.sync-bar.err{background:var(--red-soft)}
.gate{position:fixed;inset:0;z-index:40;background:radial-gradient(1200px 600px at 20% 10%,#123D66 0,#0B2E4F 55%,#081F36 100%);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.gate[hidden]{display:none!important}
.gate{background-color:#0B2E4F;background-size:cover;background-position:center;align-items:stretch}
.lg-wrap{width:min(1040px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;gap:26px;padding:28px 0 56px}
.lg-top{text-align:center;color:#fff}
.lg-logo{display:flex;justify-content:center;margin-bottom:12px;min-height:54px}
.lg-top h1{font-family:var(--cond);font-weight:700;font-size:clamp(30px,5vw,54px);letter-spacing:.5px;margin:0;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.lg-top p{margin:10px 0 0;color:#D6E4F0;font-size:16px;text-shadow:0 1px 8px rgba(0,0,0,.5)}

nfiguração ou arquivos fonte necessários à administração dos sistemas/equipamentos?","evidEsperada":"Relação dos arquivos e local de armazenamento.","situacao":"Respondido","resposta":"Documentação existente: Projetos Elipse do N2 (Aquisição em Modbus e Distribuição em IEC104) - Encaminhados ao time responsável na data de 25/09/26.","evidencia":"","responsavel":"Time Matrix","obs":"","criticidade":"Crítica"},{"id":"M-DOC-03","dominio":"Documentação","pergunta":"Existem senhas, chaves, certificados ou outros segredos necessários à administração que deverão ser transferidos de forma segura?","evidEsperada":"Inventário de itens e mecanismo proposto para transferência segura.","situacao":"Respondido","resposta":"Senhas de acesso aos equipamentos, Switch para dentro da UFV (Smartloggers e afins)","evidencia":"","responsavel":"O&M Matrix","obs":"","criticidade":"Crítica"},{"id":"M-DOC-04","dominio":"Documentação","pergunta":"Existe relação atualizada de contatos de suporte e escalonamento dos fornecedores/integradores?","evidEsperada":"Lista de contatos e horários de atendimento.","situacao":"Respondido","resposta":"Aba \"Dados usinas\" + Alpha Secure - 55 11 94033-2532\n~Valdecir Cardoso","evidencia":"","responsavel":"Contas das operadoras + Alpha Secure - 55 11 94033-2532\n~Valdecir Cardoso","obs":"","criticidade":"Média"}],"qaNegocio":[{"id":"N-GOV-01","dominio":"Governança / Societário","pergunta":"Quais CNPJs/ativos fazem parte do escopo final da aquisição e qual a estrutura societária/operacional prevista após a conclusão?","evidEsperada":"Estrutura societária aprovada / documentação do projeto.","situacao":"Respondido","resposta":"UFV Água Boa Geração de Energia Ltda. - 51.726.789/0001-01\nUFV Feliz Natal Geração de Energia Eletrica Ltda. - 51.166.456/0001-67\nUFV Vera Geração de Energia Eletrica Ltda. - 51.539.453/0001-21\nUFV Naviraí Geração de Energia Eletrica Ltda. - 53.404.202/0001-65\nUFV Nova Mutum Geração de Energia Eletrica Ltda. - 51.390.918/0001-25\n\nTodas estas empresas serão subsidiárias da Energisa Comercialiadora LTDA. - 07.685.694/0001-97","evidencia":"Instrumento de Dação em Pagamento. Disponibilizável caso necessário.","responsavel":"Eduardo Saraiva (M&A)","obs":"","criticidade":"Alta"},{"id":"N-GOV-02","dominio":"Governança / Cronograma","pergunta":"Qual é a data efetiva de transferência de controle e quais são os marcos obrigatórios do programa, incluindo o Day 1?","evidEsperada":"Cronograma oficial do programa.","situacao":"Respondido","resposta":"Data alvo: primeira semana de novembro. Sujeito ao cumprimento de condições precedentes, então é uma data sujeita a mudanças.\n\nMarcos necessários conforme slide 7 do PPT da reunião de kickoff.","evidencia":"PPT da reunião de kickoff","responsavel":"Eduardo Saraiva (M&A)","obs":"","criticidade":"Crítica"},{"id":"N-GOV-03","dominio":"Governança / Operação","pergunta":"Qual empresa será responsável pela operação dos ativos após o Day 1 e qual será o modelo operacional (ex.: arrendamento para Alsol)?","evidEsperada":"Definição formal do modelo operacional.","situacao":"Respondido","resposta":"Energisa Comercializadora será a proprietária dos ativos e os arrenderá ao Consórcio Alsolar, que, em conjunto com a Alsol, será o responsável efetivo pela operação.","evidencia":"-","responsavel":"Eduardo Saraiva (M&A)","obs":"","criticidade":"Crítica"},{"id":"N-GOV-04","dominio":"Governança / Responsabilidades","pergunta":"Quem é o Business Owner da integração e quais são os pontos focais de negócio para operação, jurídico, contratos, regulatório e financeiro?","evidEsperada":"Relação de responsáveis.","situacao":"Respondido","resposta":"PMO da integração: Cristiana Paiva\nPonto focal de M&A: Eduardo Saraiva\n\nRestante do grupo de trabalho pode ser visto no slide 6 do PPT da reunião de kickoff.","evidencia":"PPT da reunião de kickoff","responsavel":"Eduardo Saraiva (M&A)","obs":"","criticidade":"Média"},{"id":"N-GOV-05","dominio":"Governança / Transição","pergunta":"Existe período formal de transição, TSA ou compromisso de suporte da Matrix após o fechamento?","evidEsperada":"Contrato, TSA ou confirmação formal.","situacao":"Respondido","resposta":"Não haverá período de transição.","evidencia":"-","responsavel":"Eduardo Saraiva (M&A)","obs":"","criticidade":"Crítica"},{"id":"N-OPS-01","dominio":"Operação","pergunta":"Quais capacidades operacionais precisam estar disponíveis obrigatoriamente no Day 1 para garantir continuidade da operação das usinas?","evidEsperada":"Requisitos mínimos de operação aprovados pelo negócio.","situacao":"Respondido","resposta":"UFV integra. Placas, strings, inversores, tranformadores, CFTV, disponibilidade de monitoramento e atuação remota. Troca de titularidade efetivada.","evidencia":"","responsavel":"Anderson Figueiredo","obs":"","criticidade":"Crítica"},{"id":"N-OPS-02","dominio":"Operação","pergunta":"Quais processos operacionais serão executados pela Alsol/(re)energisa após o Day 1 (monitoramento, alarmes, manutenção, acionamento de terceiros etc.)?","evidEsperada":"RACI / modelo operacional futuro.","situacao":"Respondido","resposta":"Day: Monitoramento e O&M geral. CFTV será tombado o contrato vigente, assim como a internet.","evidencia":"","responsavel":"Anderson Figueiredo","obs":"","criticidade":"Crítica"},{"id":"N-OPS-03","dominio":"Operação","pergunta":"Há necessidade de operação/monitoramento remoto dos ativos a partir de algum centro de operação Energisa/Alsol?","evidEsperada":"Requisito operacional e local alvo, se definido.","situacao":"Respondido","resposta":"Sim. Monitoramento via COG-GD ALSOL","evidencia":"","responsavel":"Anderson Figueiredo","obs":"","criticidade":"Alta"},{"id":"N-DAT-01","dominio":"Dados","pergunta":"Quais dados e históricos precisam ser preservados ou disponibilizados após a aquisição por necessidade operacional, contratual, financeira ou regulatória?","evidEsperada":"Requisitos de retenção e uso do histórico.","situacao":"Respondido","resposta":"Operacional: Plano de Manutenção, histórico de geração e garantias aconadas","evidencia":"","responsavel":"Anderson Figueiredo e Bernardo Blasi","obs":"","criticidade":"Alta"},{"id":"N-DAT-02","dominio":"Dados","pergunta":"Há necessidade de migração de dados históricos para plataformas Energisa/Alsol ou o acesso ao legado é suficiente?","evidEsperada":"Decisão/requisito de negócio.","situacao":"Respondido","resposta":"Acesso ao legado é suficiente","evidencia":"","responsavel":"Anderson Figueiredo","obs":"","criticidade":"Alta"},{"id":"N-DAT-03","dominio":"Dados / Privacidade","pergunta":"Há conhecimento de tratamento de dados pessoais ou requisitos específicos de privacidade associados aos ativos?","evidEsperada":"Confirmação de negócio/privacidade, quando aplicável.","situacao":"Respondido","resposta":"Não","evidencia":"","responsavel":"","obs":"","criticidade":"Média"},{"id":"N-REG-01","dominio":"Regulatório","pergunta":"Quais obrigações regulatórias, contratuais ou de reporte relacionadas aos ativos dependem de sistemas, dados ou conectividade?","evidEsperada":"Lista de obrigações, periodicidade e destinatários.","situacao":"Não aplicável","resposta":"","evidencia":"","responsavel":"","obs":"","criticidade":"Crítica"},{"id":"N-REG-02","dominio":"Regulatório","pergunta":"Existem envios eletrônicos de informações para agentes externos que deverão continuar após o Day 1?","evidEsperada":"Fluxos/requisitos e sistemas envolvidos.","situacao":"Não aplicável","resposta":"","evidencia":"","responsavel":"","obs":"","criticidade":"Crítica"},{"id":"N-CON-01","dominio":"Contratos / Jurídico","pergunta":"Quais contratos e licenças de tecnologia serão transferidos, mantidos temporariamente, renegociados ou encerrados no processo de aquisição?","evidEsperada":"Mapa contratual / definição jurídica.","situacao":"Respondido","resposta":"Não foi previsto na negociação se serão mantidos ou não. Time de tecnologia deverá avaliar contratos individualmente assim que a Matrix responder os questionamentos enviados pelo time de TI no dia 16/09.","evidencia":"-","responsavel":"Eduardo Saraiva (M&A)","obs":"","criticidade":"Crítica"},{"id":"N-CON-02","dominio":"Contratos / Jurídico","pergunta":"Há cláusulas de change of control, restrições de transferência ou obrigações contratuais que possam afetar sistemas, licenças, telecom ou suporte?","evidEsperada":"Análise jurídica/contratual.","situacao":"Respondido","resposta":"Time de tecnologia deverá avaliar contratos individualmente assim que a Matrix responder os questionamentos enviados pelo time de TI no dia 16/09.","evidencia":"-","responsavel":"Eduardo Saraiva (M&A)","obs":"","criticidade":"Crítica"},{"id":"N-CON-03","dominio":"Fornecedores","pergunta":"Quais fornecedores o negócio considera indispensáveis para continuidade operacional no Day 1 e no período de estabilização?","evidEsperada":"Relação priorizada de fornecedores críticos.","situacao":"Respondido","resposta":"Devem ser mantidos os forncedores de monitoramento remoto de CFTV e internet.","evidencia":"","responsavel":"Anderson Figueiredo","obs":"","criticidade":"Média"},{"id":"N-TRANS-01","dominio":"Transição","pergunta":"Existe data limite para retirada de acessos, serviços ou infraestrutura atualmente vinculados à Matrix?","evidEsperada":"Marco contratual/operacional.","situacao":"Respondido","resposta":"Não foi negociado expressamente, mas acreditamos que faria sentido que ocorresse imediatamente pós-fechamento, como usual nessas operações (dado que não houve negociação de TSA).","evidencia":"-","responsavel":"Eduardo Saraiva (M&A)","obs":"","criticidade":"Crítica"},{"id":"N-TRANS-02","dominio":"Transição","pergunta":"Existe algum serviço que o negócio espera manter temporariamente sob responsabilidade da Matrix após o Day 1?","evidEsperada":"Definição de transição/TSA.","situacao":"Respondido","resposta":"Não. Entende-se que vamos tomabr contratos e fornecedores.","evidencia":"","responsavel":"Anderson Figueiredo","obs":"","criticidade":"Crítica"},{"id":"N-TRANS-03","dominio":"Transição","pergunta":"Quais riscos ou restrições de negócio devem ser considerados pela VPT ao planejar cutover, contingência e estabilização?","evidEsperada":"Riscos/restrições conhecidos pelo negócio.","situacao":"Respondido","resposta":"Risco de segurança patrimonial e receita por falta de geração.","evidencia":"","responsavel":"Anderson Figueiredo","obs":"","criticidade":"Alta"}],"vpt":[{"id":"V-GOV-01","dominio":"Governança / Escopo","pergunta":"O escopo tecnológico da integração está integralmente conhecido e há lacunas críticas de informação que precisam ser escaladas?","fontes":"M-GOV-01:M-GOV-03; N-GOV-01:N-GOV-05","frente":"GPAN / IT Business Partner","status":"Decidido","decisao":"O escopo tecnológico está suficientemente conhecido para avançar da etapa de discovery para execução. As principais dependências estão mapeadas em SCADA/OT, conectividade, firewall, acessos, segurança, CFTV, contratos e dados. Não foram identificadas dependências críticas desconhecidas que impeçam o planejamento do Day 1.","risco":"Lacunas residuais de evidência ou configuração podem emergir durante a implementação e reduzir a margem para testes.","acao":"Encerrar pendências documentais/evidências no RAID, manter rastreabilidade das decisões e escalar somente gaps que possam afetar o Day 1.","owner":"GPAN","prazo":"2026-10-02","criticidade":"Crítica","obs":""},{"id":"V-GOV-02","dominio":"Governança / Escopo","pergunta":"Quais dependências da Matrix ou de terceiros precisam ser eliminadas, formalizadas ou mantidas temporariamente?","fontes":"M-GOV-01:M-GOV-02; M-CON-01:M-CON-03; M-SUP-01:M-SUP-02; N-GOV-05; N-TRANS-01:N-TRANS-02","frente":"GPAN / Arquitetura / Contratos TI","status":"Decidido","decisao":"Devem ser eliminadas na passagem as dependências corporativas da Matrix: SCADA N3/Azure, AD Matrix, Site24x7, OCS Inventory, FortiEDR e Halcyon. Devem ser mantidos/transferidos para gestão Energisa/Alsol os links de internet das SPEs, contratos de CFTV/Alpha Secure, servidor Dell, FortiGate local, licenças Elipse E3 e acessos necessários ao FusionSolar.","risco":"Remoção das dependências Matrix antes da ativação dos equivalentes Energisa pode gerar perda de supervisão, segurança, acesso ou monitoramento.","acao":"Executar transição item a item com novo owner, substituto Energisa quando aplicável e evidência de funcionamento antes da retirada Matrix.","owner":"GPAN / Líderes técnicos VPT / O&M ALSOL","prazo":"2026-11-06","criticidade":"Crítica","obs":""},{"id":"V-GOV-03","dominio":"Governança / Priorização","pergunta":"Quais ações são obrigatórias para o Day 1 e quais podem ser tratadas em onda posterior sem comprometer continuidade, segurança ou compliance?","fontes":"N-OPS-01:N-OPS-03; N-REG-01:N-REG-02; N-TRANS-01:N-TRANS-03; resultados técnicos das demais linhas","frente":"GPAN / Líderes técnicos VPT","status":"Decidido","decisao":"Obrigatório para o Day 1: N2/Elipse Gateway configurado para o novo fluxo, conectividade/VPN e regras de firewall Energisa, N3/SCADA Energisa configurado, acessos e credenciais testados, continuidade de internet e CFTV, controles mínimos de segurança, backups/configurações preservados e testes/comissionamento ponta a ponta concluídos. Evoluções não impeditivas podem seguir no Plano de 100 dias.","risco":"Atraso em atividades críticas de configuração, rede ou comissionamento compromete a continuidade operacional em 02/11.","acao":"Converter os itens obrigatórios em marcos do Plano Integrado de Ações e tratar otimizações/resíduos como backlog pós-Day 1.","owner":"GPAN / Líderes técnicos VPT / O&M ALSOL","prazo":"2026-10-09","criticidade":"Crítica","obs":""},{"id":"V-OT-01","dominio":"OT / SCADA","pergunta":"O SCADA atual será mantido, integrado, migrado, substituído ou descontinuado no modelo-alvo?","fontes":"M-OT-01:M-OT-11; M-OPS-01:M-OPS-04; N-OPS-01:N-OPS-03","frente":"OT / SCADA / Arquitetura","status":"Decidido","decisao":"Manter o Elipse E3 Gateway/N2 local nas usinas e integrar os ativos ao SCADA Energisa. A supervisão cloud/N3 Matrix será descontinuada. O fluxo northbound atual em IEC104 será substituído por DNP3 para o ambiente Energisa.","risco":"Falha na reconfiguração do gateway ou incompatibilidade de driver/protocolo impede supervisão e comandos remotos no Day 1.","acao":"Configurar N2 como DNP3, preparar driver/N3 Energisa, validar mapa de pontos e executar testes/comissionamento ponta a ponta.","owner":"OT SCADA /  O&M ALSOL","prazo":"2026-10-27","criticidade":"Crítica","obs":""},{"id":"V-OT-02","dominio":"OT / SCADA","pergunta":"Há necessidade de integração do SCADA/OT com ambientes Energisa/Alsol? Qual arquitetura de transição e To-Be será adotada?","fontes":"M-OT-01:M-OT-11; M-INT-01:M-INT-02; N-OPS-02:N-OPS-03","frente":"OT / SCADA / Arquitetura / Integrações","status":"Decidido","decisao":"A arquitetura To-Be adotada conecta os gateways das UFVs ao SCADA Renováveis/Energisa no Datacenter de Cataguases, passando pelo firewall local, concentrador/VPN, firewall corporativo Energisa e rede WAN. O N3 Matrix deixa de fazer parte do fluxo operacional.","risco":"Qualquer falha de roteamento, VPN, firewall ou configuração DNP3 interrompe o fluxo de telemetria/comando.","acao":"Implementar e validar a arquitetura To-Be por usina, incluindo N2, rede, N3, regras e teste de comunicação DNP3.","owner":"OT SCADA /  O&M ALSOL","prazo":"2026-10-27","criticidade":"Crítica","obs":""},{"id":"V-OT-03","dominio":"OT / SCADA","pergunta":"As licenças, customizações, arquivos de projeto e suporte do ambiente OT são suficientes e transferíveis para sustentação futura?","fontes":"M-OT-03; M-OT-07:M-OT-11; M-CON-01:M-CON-03; M-DOC-01:M-DOC-04; N-CON-01:N-CON-02","frente":"OT / SCADA / Contratos TI","status":"Decidido","decisao":"As licenças Elipse E3 pertencem às SPEs/UFVs e não foi reportada restrição de transferência. Os projetos N2 e backups do gateway foram disponibilizados ao time técnico. Não há Elipse Care contratado; a ausência desse suporte não impede a transição.","risco":"Problemas de ativação/licenciamento ou ausência de suporte especializado podem aumentar o tempo de recuperação em incidentes.","acao":"Validar arquivos/licenças por UFV, preservar cópias atualizadas dos projetos N2.","owner":"OT SCADA /  O&M ALSOL","prazo":"2026-10-09","criticidade":"Alta","obs":""},{"id":"V-OT-04","dominio":"OT / SCADA","pergunta":"Quais componentes OT exigem adequação, atualização ou substituição antes ou após o Day 1?","fontes":"M-OT-04:M-OT-11; M-SEC-03:M-SEC-06; M-INF-01:M-INF-04","frente":"OT / SCADA / Cybersecurity OT","status":"Decidido","decisao":"Não foi identificada necessidade de substituição dos principais componentes locais para o Day 1. Serão mantidos o servidor Dell/Elipse Gateway e o FortiGate local, com reconfiguração para a arquitetura Energisa. Devem ser substituídas as dependências de gestão/segurança Matrix e reconfigurados protocolo, acessos e conectividade.","risco":"Equipamentos transferidos sem reconfiguração de gestão, segurança ou backup podem ficar sem administração adequada após o fechamento.","acao":"Realizar hardening e transferência de gestão do servidor/firewall, aplicar nova configuração N2/rede e instalar/ativar controles Energisa necessários.","owner":"OT SCADA /  O&M ALSOL / SEG OPERACIONAL","prazo":"2026-11-06","criticidade":"Crítica","obs":""},{"id":"V-NET-01","dominio":"Redes / Telecom","pergunta":"A conectividade atual pode ser mantida no Day 1 ou será necessária migração/contratação de links e serviços?","fontes":"M-NET-01:M-NET-08; M-CON-01:M-CON-02; N-OPS-01; N-TRANS-01:N-TRANS-02","frente":"Redes / Telecom","status":"Decidido","decisao":"Os links de internet existentes serão mantidos no Day 1. Os contratos já estão nos CNPJs das UFVs e deverão ter contatos/cobrança atualizados. A mudança principal é a retirada das VPNs Matrix e a implantação da conectividade/VPN/regras para a Rede Energisa.","risco":"Erro na transição de VPN, roteamento ou firewall pode interromper supervisão e acesso remoto mesmo com o link ativo.","acao":"Validar cada provedor/link, atualizar contatos, configurar rede/VPN Energisa, migrar a gestão do firewall e testar conectividade ponta a ponta.","owner":"OT SCADA /  O&M ALSOL","prazo":"2026-11-06","criticidade":"Crítica","obs":""},{"id":"V-NET-02","dominio":"Redes / Telecom","pergunta":"A arquitetura de rede e segmentação atende aos padrões Energisa para operação segura de OT? Quais adequações são necessárias?","fontes":"M-NET-05:M-NET-08; M-SEC-01:M-SEC-06","frente":"Redes / Telecom / Cybersecurity OT","status":"Decidido","decisao":"O As-Is será adaptado ao padrão corporativo: firewall local da usina permanece como camada local e o tráfego seguirá por firewall corporativo Energisa (WatchGuard/Palo Alto), rede WAN e Datacenter Cataguases. Regras, rotas e acessos deverão ser recriados sob governança Energisa.","risco":"Regras excessivas ou incompletas podem gerar exposição OT ou indisponibilidade de comunicação.","acao":"Revisar configuração atual do FortiGate, aplicar baseline Energisa, liberar somente fluxos necessários e validar segmentação/rotas com Cybersecurity OT.","owner":"O&M ALSOL / SEG OPERACIONAL","prazo":"2026-11-16","criticidade":"Crítica","obs":""},{"id":"V-NET-03","dominio":"Redes / Telecom","pergunta":"Há redundância e contingência de telecom suficientes para o requisito operacional do negócio?","fontes":"M-NET-02:M-NET-04; M-BCK-04; N-OPS-01:N-OPS-03","frente":"Redes / Telecom / OT","status":"Decidido","decisao":"O desenho atual e o To-Be utilizam um único link de internet por UFV, sem failover. Para o Day 1, o plano técnico considera a manutenção dos links existentes; a suficiência dessa condição é aceita pelo time de O&M Energisa.","risco":"Falha do único link interrompe monitoramento e atuação remota até restabelecimento, ainda que não necessariamente interrompa a geração local.","acao":"Formalizar com O&M/Negócio a contingência para perda de telecom e decidir se redundância será requisito pré-Day 1 ou item do Plano de 100 dias.","owner":"GPAN / O&M ALSOL","prazo":"2026-10-09","criticidade":"Alta","obs":""},{"id":"V-IAM-01","dominio":"Identidade e Acessos","pergunta":"Qual modelo de identidade e acesso será adotado para usuários, terceiros e contas técnicas após a transição?","fontes":"M-IAM-01:M-IAM-05; M-OPS-01:M-OPS-04; N-OPS-02:N-OPS-03","frente":"IAM / Cybersecurity / OT","status":"Decidido","decisao":"O modelo Matrix não será mantido: o servidor será retirado do domínio Matrix e os acessos deverão passar à governança Energisa/Alsol. As contas técnicas, administrativas, perfis O&M e tratamento de terceiros/CFTV serão implementadas seguindo o mesmo padrão operacional existente da Energisa/Alsol. Vamos incluir no backlog criação de domínio das máquinas de acordo com o escopo previsto para as demais usinas da Alsol","risco":"Conta local ou de terceiro sem governança adequada pode manter privilégio excessivo ou dificultar rastreabilidade.","acao":"Adequar modelo de identidade/acesso para servidor, firewall, SCADA e CFTV; criar acessos Energisa e processo de gestão/recertificação.","owner":"O&M ALSOL / SEG OPERACIONAL","prazo":"2026-11-06","criticidade":"Crítica","obs":""},{"id":"V-IAM-02","dominio":"Identidade e Acessos","pergunta":"Como e quando os acessos da Matrix deverão ser revogados sem interromper a operação?","fontes":"M-GOV-02; M-IAM-01:M-IAM-05; N-TRANS-01:N-TRANS-02","frente":"IAM / OT / GPAN","status":"Decidido","decisao":"Os acessos Matrix devem ser revogados no cutover, somente após criação e teste dos acessos Energisa/Alsol. Não haverá período de coexistência/TSA.","risco":"Revogação antecipada interrompe suporte/operação; revogação tardia mantém acesso indevido após a transferência.","acao":"Inserir no runbook a sequência: provisionar → testar → transferir gestão/credenciais → validar operação → revogar acessos Matrix.","owner":"O&M ALSOL / SEG OPERACIONAL","prazo":"2026-11-06","criticidade":"Crítica","obs":""},{"id":"V-IAM-03","dominio":"Identidade e Acessos","pergunta":"Quais credenciais, chaves, certificados e segredos precisam ser transferidos ou recriados antes do cutover?","fontes":"M-IAM-01:M-IAM-05; M-SEC-06; M-DOC-03","frente":"IAM / Cybersecurity / OT","status":"Decidido","decisao":"Devem ser transferidas as credenciais administrativas dos equipamentos locais, switches/Smartloggers, firewall, servidor/gateway e demais componentes necessários à operação. Após a passagem, as credenciais devem ser rotacionadas quando tecnicamente possível.","risco":"Falta de credenciais administrativas pode impedir suporte, recuperação e mudança de configuração.","acao":"Inventariar, transferir por canal seguro, validar e rotacionar credenciais/segredos no cutover.","owner":"O&M ALSOL / SEG OPERACIONAL / SEG CORP","prazo":"2026-11-06","criticidade":"Alta","obs":""},{"id":"V-SEC-01","dominio":"Segurança Cibernética","pergunta":"Quais riscos cibernéticos herdados precisam de tratamento obrigatório antes do Day 1?","fontes":"M-SEC-01:M-SEC-06; M-NET-06:M-NET-08; M-IAM-01:M-IAM-05","frente":"Cybersecurity / Cybersecurity OT","status":"Decidido","decisao":"O principal risco herdado é a perda dos controles corporativos Matrix no fechamento: FortiEDR, Halcyon, OCS Inventory e Site24x7 serão removidos. Também permanecem acessos remotos/terceiros que precisam de revisão. Não há evidência de incidentes/vulnerabilidades críticas reportadas pela Matrix.","risco":"Janela sem proteção/monitoramento equivalente Energisa e permanência de acessos legados após a passagem.","acao":"Concluir assessment de Cybersecurity OT, definir controles mínimos de Day 1 e registrar hardening, proteção endpoint, inventário/monitoramento e acessos remotos. Formalizar ao SOC a entrada dos novos ativos ao SIEM.","owner":"GPAN / O&M ALSOL / SEG OPERACIONAL / SEG CORP / SOC","prazo":"2026-11-02","criticidade":"Crítica","obs":""},{"id":"V-SEC-02","dominio":"Segurança Cibernética","pergunta":"Quais controles Energisa deverão ser implantados ou integrados (monitoramento, logs, EDR, gestão de vulnerabilidades, acesso remoto etc.)?","fontes":"M-SEC-01:M-SEC-06; M-INF-01:M-INF-04","frente":"Cybersecurity / Infraestrutura / OT","status":"Decidido","decisao":"Estão definidos firewall local + firewall corporativo Energisa e acesso pela Rede Energisa. Os controles corporativos implementados serão Claroty SRA, Palo Alto Cortex, Qualys com SOC 24x7.","risco":"Perda de visibilidade e proteção dos servidores/ativos durante a transição.","acao":"Mapear equivalentes Energisa conforme descrito na descisão e programar implementação de cada controle na primeira semana pós-Day 1, com owner e evidência de implantação.","owner":"O&M ALSOL / SEG OPERACIONAL / SEG CORP","prazo":"2026-11-02","criticidade":"Alta","obs":""},{"id":"V-SEC-03","dominio":"Segurança Cibernética","pergunta":"Há exposições à internet ou acessos de terceiros que devam ser eliminados, restringidos ou formalmente aceitos?","fontes":"M-NET-07:M-NET-08; M-IAM-03:M-IAM-05; M-SEC-01:M-SEC-06","frente":"Cybersecurity / Redes / IAM","status":"Decidido","decisao":"Não foi reportada exposição direta pública à internet. As conexões Matrix (VPN para Azure/N3, RDP e AnyDesk) devem ser desativadas no cutover e substituídas por acesso seguro Energisa. A VPN do terceiro de CFTV poderá permanecer somente quando for validada e formalizada sob governança Energisa/Alsol.","risco":"Acesso remoto legado/terceiro não revogado pode manter porta de entrada não autorizada ao ambiente OT.","acao":"Inventariar fluxos remotos, aprovar os necessários, recriar VPN CFTV e remover Matrix VPN/RDP/AnyDesk após validação do To-Be.","owner":"O&M ALSOL / SEG OPERACIONAL / SEG CORP","prazo":"2026-11-13","criticidade":"Alta","obs":""},{"id":"V-DAT-01","dominio":"Dados","pergunta":"Quais dados/históricos precisam ser migrados, arquivados ou mantidos acessíveis e por quanto tempo?","fontes":"M-DAT-01:M-DAT-03; N-DAT-01:N-DAT-03; N-REG-01:N-REG-02","frente":"Dados / OT / Negócio","status":"Decidido","decisao":"O Negócio requer preservação de plano de manutenção, histórico de geração e informações de garantias acionadas. A Matrix mantém alarmes por 1 ano e histórico de dados desde a implantação em SQL Server/Azure. O Negócio informou que acesso ao legado é suficiente, mas ainda falta formalizar o período e o mecanismo de acesso pós-fechamento.","risco":"Perda de histórico operacional necessário a análise, manutenção ou garantia após desligamento do ambiente Matrix.","acao":"Definir retenção mínima e garantir cópia/exportação ou envio/acesso formal do legado antes do corte Matrix.","owner":"GPAN / O&M ALSOL / OT SCADA","prazo":"2026-11-13","criticidade":"Alta","obs":""},{"id":"V-DAT-02","dominio":"Dados","pergunta":"Qual será o repositório/alvo dos dados necessários no modelo futuro e como será garantida sua integridade durante a transição?","fontes":"M-DAT-01:M-DAT-02; M-INT-01:M-INT-02; N-DAT-01:N-DAT-02","frente":"Dados / Integrações / OT","status":"Decidido","decisao":"Não está prevista migração integral do histórico para o novo SCADA; o direcionamento do Negócio é manter acesso ao legado.","risco":"O histórico ficar indisponível após o fechamento apesar de o Negócio considerar o acesso legado suficiente.","acao":"Os dados serão disponibilizados pela Matrix à Energisa através do repositório oficial de dados do projeto de integração e deverão ser validados pelo time responsável Energisa.","owner":"GPAN / O&M ALSOL / OT SCADA","prazo":"2026-11-13","criticidade":"Alta","obs":""},{"id":"V-DAT-03","dominio":"Dados / Privacidade","pergunta":"Existem requisitos de privacidade ou controles adicionais para dados pessoais identificados no discovery?","fontes":"M-DAT-03; N-DAT-03","frente":"Privacidade / Cybersecurity / Dados","status":"N/A","decisao":"Não foram identificados dados pessoais associados aos sistemas/ativos avaliados e o Negócio confirmou inexistência de requisito específico de privacidade.","risco":"Sem risco adicional identificado para este escopo.","acao":"Manter registro da avaliação como não aplicável e reabrir somente se surgirem dados pessoais no decorrer da integração.","owner":"M&A / GPAN","prazo":"2026-10-09","criticidade":"Média","obs":""},{"id":"V-INT-01","dominio":"Integrações","pergunta":"Quais integrações existentes precisam ser mantidas, substituídas ou recriadas no ambiente Energisa/Alsol?","fontes":"M-INT-01:M-INT-02; M-APP-01:M-APP-03; N-OPS-01:N-OPS-03; N-REG-01:N-REG-02","frente":"Integrações / Arquitetura / OT","status":"Decidido","decisao":"A integração operacional principal será recriada no ambiente Energisa: o Gateway/Elipse E3 local continuará coletando via Modbus, mas o envio ao supervisório Matrix via IEC104 será substituído por DNP3 para o SCADA Energisa. FusionSolar e CFTV permanecem como serviços auxiliares a serem incorporados/geridos.","risco":"Falha na recriação da integração SCADA impede telemetria, alarmes e comandos no centro Energisa.","acao":"Configurar DNP3 N2/N3, rede e firewall; validar mapa de pontos, comandos, estados, medições e alarmes; regularizar acessos FusionSolar/CFTV.","owner":"O&M ALSOL / OT SCADA","prazo":"2026-11-06","criticidade":"Alta","obs":""},{"id":"V-INT-02","dominio":"Integrações","pergunta":"Existem fluxos manuais ou frágeis que representem risco para o Day 1 e exijam contingência?","fontes":"M-INT-02; M-APP-02; N-REG-01:N-REG-02","frente":"Integrações / GPAN / Negócio","status":"Decidido","decisao":"Não foram identificados fluxos manuais, macros, trocas de arquivos ou integrações regulatórias críticas para o Day 1. Os itens regulatórios foram considerados não aplicáveis pelo Negócio.","risco":"Baixo, condicionado a não surgirem novos fluxos durante comissionamento.","acao":"Manter validação durante testes e registrar qualquer exceção no RAID/Plano Integrado.","owner":"GPAN / O&M ALSOL","prazo":"2026-11-13","criticidade":"Média","obs":""},{"id":"V-INF-01","dominio":"Infraestrutura","pergunta":"Quais componentes de infraestrutura serão mantidos, transferidos, migrados ou substituídos?","fontes":"M-INF-01:M-INF-04; M-CON-01:M-CON-03","frente":"Infraestrutura / Arquitetura","status":"Decidido","decisao":"Serão mantidos e transferidos os componentes locais das usinas, especialmente servidor Dell/Elipse Gateway e FortiGate local. As dependências centrais Matrix em Azure (SCADA N3, SQL, COG/EPM) não fazem parte do To-Be operacional e serão substituídas por infraestrutura/rede/SCADA Energisa.","risco":"Dependência residual de componente Matrix após o fechamento pode causar indisponibilidade.","acao":"Confirmar inventário/patrimônio transferido, incorporar ativos locais à gestão Energisa e validar desligamento das dependências centrais Matrix.","owner":"GPAN / O&M ALSOL / SEG OPERACIONAL / SEG CORP / SOC","prazo":"2026-11-13","criticidade":"Alta","obs":""},{"id":"V-INF-02","dominio":"Infraestrutura","pergunta":"Há dependências de hospedagem Matrix/terceiros que precisam ser eliminadas antes do Day 1?","fontes":"M-INF-01:M-INF-04; M-GOV-02; N-TRANS-01:N-TRANS-02","frente":"Infraestrutura / GPAN","status":"Decidido","decisao":"As dependências de hospedagem Matrix que sustentam o SCADA N3 e serviços associados em Azure devem ser eliminadas antes/na virada. O To-Be opera sobre rede e Datacenter Energisa.","risco":"Qualquer dependência residual de Azure Matrix sem TSA pode ser interrompida imediatamente após o fechamento.","acao":"Validar no readiness que N3 Matrix, VPN Azure e serviços centrais não são necessários para operação Day 1.","owner":"GPAN / O&M ALSOL / OT SCADA","prazo":"2026-10-30","criticidade":"Alta","obs":""},{"id":"V-INF-03","dominio":"Infraestrutura","pergunta":"Os ativos remanescentes devem ser incorporados ao inventário/CMDB e ao modelo de gestão de ativos da Energisa?","fontes":"M-INF-01:M-INF-04; N-GOV-03","frente":"Infraestrutura / ITSM / Gestão de Ativos","status":"Decidido","decisao":"Os ativos tecnológicos transferidos e mantidos no To-Be devem ser incorporados ao inventário/CMDB e ao modelo de gestão da Energisa, incluindo ao menos servidor Dell, firewall local e componentes sob responsabilidade tecnológica Energisa.","risco":"Ativo sem inventário/owner prejudica sustentação, configuração e gestão de vulnerabilidades.","acao":"Cadastrar ativos, localização, owner, serviço associado, versão/configuração e relacionamento com as UFVs.","owner":"GPAN / O&M ALSOL / SEG OPERACIONAL / SEG CORP / SOC","prazo":"2026-11-13","criticidade":"Média","obs":""},{"id":"V-BCK-01","dominio":"Backup / Continuidade","pergunta":"O modelo atual de backup e recuperação é suficiente para o Day 1? Quais adequações são necessárias?","fontes":"M-BCK-01:M-BCK-04; N-OPS-01; N-TRANS-03","frente":"Infraestrutura / OT / Continuidade","status":"Decidido","decisao":"O modelo atual de backup não é suficiente como solução futura porque parte depende da nuvem Matrix. Para o Day 1 devem existir cópias atualizadas dos projetos/configurações do Elipse N2, configuração do firewall e servidor/gateway, além de política de backup sob ambiente Energisa.","risco":"Sem cópia restaurável, falha durante ou após o cutover pode exigir reconstrução manual e ampliar indisponibilidade.","acao":"Obter backup final pré-cutover, armazenar em repositório Energisa e validar procedimento de restauração/configuração dos componentes críticos.","owner":"GPAN / O&M ALSOL / SEG OPERACIONAL / SEG CORP / SOC","prazo":"2026-11-02","criticidade":"Alta","obs":""},{"id":"V-BCK-02","dominio":"Backup / Continuidade","pergunta":"Qual plano de contingência e rollback será adotado para eventos críticos durante a transição?","fontes":"M-BCK-01:M-BCK-04; M-NET-03:M-NET-04; N-OPS-01; N-TRANS-03","frente":"OT / Redes / Infraestrutura / GPAN","status":"Decidido","decisao":"O rollback detalhado ainda precisa ser formalizado. Como não haverá TSA, o plano não deve depender do retorno ao N3 Matrix como contingência garantida; deve priorizar restauração de configurações, correção de rede/N2/N3 e contingência operacional.","risco":"Falha de cutover sem rollback executável pode deixar o ativo sem supervisão remota por período prolongado.","acao":"Construir runbook de rollback com gatilhos, responsáveis, backups, sequência de reversão e contingência operacional por usina.","owner":"OT SCADA / O&M ALSOL / SEG OPERACIONAL / SEG CORP / SOC","prazo":"2026-11-30","criticidade":"Crítica","obs":""},{"id":"V-CON-01","dominio":"Contratos / Licenças","pergunta":"Quais contratos/licenças precisam ser transferidos, renovados, substituídos ou formalizados para garantir continuidade?","fontes":"M-CON-01:M-CON-03; M-OT-03; M-NET-02:M-NET-03; N-CON-01:N-CON-03","frente":"Contratos TI / Suprimentos / Jurídico / Área técnica","status":"Decidido","decisao":"Devem ser mantidos/tombados os contratos de internet e CFTV. Os contratos de internet já estão nos CNPJs das UFVs, exigindo principalmente atualização cadastral/contatos. As licenças Elipse E3 pertencem às UFVs e não há restrição de transferência reportada. Não há Elipse Care vigente.","risco":"Falha cadastral/contratual pode interromper internet, CFTV ou suporte necessário ao início da operação.","acao":"Atualizar contatos/faturamento dos provedores, formalizar continuidade do CFTV/Alpha Secure e registrar licenças Elipse por UFV.","owner":"O&M ALSOL / OT SCADA","prazo":"2026-11-30","criticidade":"Crítica","obs":""},{"id":"V-CON-02","dominio":"Fornecedores","pergunta":"Quais fornecedores precisarão permanecer no modelo de sustentação e quais novos contratos/SLA serão necessários?","fontes":"M-SUP-01:M-SUP-02; M-OT-07:M-OT-08; M-OPS-02:M-OPS-03; N-CON-03","frente":"GPAN / Sustentação / Contratos TI","status":"Decidido","decisao":"Fornecedores externos que permanecem no modelo inicial: provedores locais de internet e Alpha Secure para CFTV. A sustentação SCADA/OT passa a ser interna Energisa/Alsol; suporte Elipse Care não existe atualmente e pode ser avaliado posteriormente.","risco":"Ausência de SLA/contato atualizado pode prolongar indisponibilidades de telecom ou CFTV.","acao":"Formalizar contatos/SLA dos provedores e Alpha Secure e definir matriz de escalonamento com O&M/SCADA Energisa.","owner":"GPAN / O&M ALSOL / OT SCADA","prazo":"2026-11-30","criticidade":"Média","obs":""},{"id":"V-TRANS-01","dominio":"Transição / Cutover","pergunta":"Qual será o plano de cutover de SCADA, telecom, acessos e serviços críticos?","fontes":"V-OT-01:V-OT-04; V-NET-01:V-NET-03; V-IAM-01:V-IAM-03; N-GOV-02; N-TRANS-01:N-TRANS-03","frente":"GPAN / OT / Redes / IAM / Cybersecurity","status":"Decidido","decisao":"O plano macro de cutover está definido: preparar N2 e N3, estabelecer conectividade e regras, executar testes ponta a ponta, migrar a operação Matrix → Energisa/Alsol e então retirar dependências/acessos Matrix. Falta consolidar o runbook detalhado por usina e por torre.","risco":"Sequenciamento incorreto entre SCADA, rede, acesso e retirada Matrix pode criar indisponibilidade cruzada.","acao":"Transformar o roadmap técnico em runbook de cutover com horários, owners, pré-requisitos, evidências, critérios de sucesso e rollback.","owner":"OT SCADA / O&M ALSOL / SEG OPERACIONAL / SEG CORP","prazo":"2026-10-30","criticidade":"Crítica","obs":""},{"id":"V-TRANS-02","dominio":"Transição / Cutover","pergunta":"Quais critérios de readiness e Go/No-Go deverão ser atendidos antes do Day 1?","fontes":"Decisões VPT anteriores; N-OPS-01; N-REG-01:N-REG-02; N-TRANS-03","frente":"GPAN / Líderes técnicos VPT / Negócio","status":"Decidido","decisao":"Critérios de readiness/Go-No-Go: N2 configurado, DNP3 validado, N3 Energisa disponível, conectividade/VPN e firewalls testados, pontos/comandos/estados/medições/alarmes validados, acesso/credenciais Energisa funcionais, internet/CFTV contínuos, backups disponíveis e riscos críticos sem impedimento aberto.","risco":"Go-live sem evidência objetiva de readiness pode levar pendência impeditiva para produção.","acao":"Criar checklist de readiness por UFV e somente autorizar cutover após aceite técnico/operacional dos critérios críticos.","owner":"GPAN / Líderes técnicos VPT / O&M ALSOL","prazo":"2026-11-13","criticidade":"Crítica","obs":""},{"id":"V-TRANS-03","dominio":"Transição / Hypercare","pergunta":"Qual será o modelo de hypercare, escalonamento e suporte intensivo após o Day 1?","fontes":"M-OPS-01:M-OPS-04; M-SUP-01:M-SUP-02; N-OPS-02; N-CON-03","frente":"GPAN / ITSM / OT / Sustentação","status":"Decidido","decisao":"Está definido que haverá monitoramento e estabilização/hypercare após o Day 1, seguido de handover. Ainda precisam ser formalizados duração, canais, escala de suporte, matriz de escalonamento e critérios de saída.","risco":"Incidente pós-cutover sem canal/owner claramente definido pode elevar tempo de resposta.","acao":"Definir plano de hypercare antes do Day 1 com war room/canal, contatos, cobertura, SLAs temporários e critérios de encerramento.","owner":"GPAN / O&M ALSOL / SEG OPERACIONAL / SEG CORP","prazo":"2026-11-30","criticidade":"Média","obs":""},{"id":"V-SUST-01","dominio":"Sustentação","pergunta":"Qual área será owner de cada serviço/componente após a estabilização (SCADA, redes, telecom, acessos, segurança, infraestrutura etc.)?","fontes":"Decisões VPT anteriores; N-GOV-03; N-OPS-02","frente":"GPAN / Gestores das torres VPT","status":"Decidido","decisao":"O owner operacional dos ativos será Alsol/Consórcio Alsolar. Para SCADA, a atuação técnica já está estruturada com o time SCADA Energisa e O&M/(re)energisa participa da integração. Os owners definitivos de redes, segurança, infraestrutura, IAM e contratos serão consolidados no modelo de sustentação padrão da Energisa.","risco":"Componente sem owner técnico definido pode ficar sem processo de incidente, mudança ou manutenção após o hypercare.","acao":"Construir matriz Serviço/Componente × Owner VPT × Owner Operacional × Fornecedor e aprovar antes do handover.","owner":"GPAN / Líderes técnicos VPT / O&M ALSOL","prazo":"2026-11-13","criticidade":"Crítica","obs":""},{"id":"V-SUST-02","dominio":"Sustentação", function agg(items,val,w){

    let sw=0,s=0;items.forEach(i=>{const v=val(i);if(v==null)return;const k=Math.max(0,+w(i)||0);sw+=k;s+=k*v});
    if(sw>0)return s/sw;
    const vs=items.map(val).filter(v=>v!=null);return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;
  }

function situacao(a,today){
  today=today||todayISO();const p=+a.pct||0;

  if(a.fim&&today>a.fim)return 'atrasada';

    if(f.status&&a.status!==f.status)return false;
    if(f.prio&&a.prioridade!==f.prio)return false;
    if(f.prazo){const d=a.fim?dayDiff(t,a.fim):999;if(f.prazo==='7'&&!(d>=0&&d<=7&&(+a.pct)<100))return false;if(f.prazo==='15'&&!(d>=0&&d<=15&&(+a.pct)<100))return false;if(f.prazo==='semana'&&!(d>=-1&&d<=6))return false}
    if(f.sit){const s=situacao(a,t);if(f.sit==='pendentes'){if(s==='concluida')return false}else if(f.sit==='andamento'){if(s!=='andamento'&&s!=='atencao')return false}else if(s!==f.sit)return false}
    if(f.q){const q=f.q.toLowerCase();if(!(a.nome.toLowerCase().includes(q)||String(a.codigo||'').toLowerCase().includes(q)||String(a.equipe||'').toLowerCase().includes(q)||respNomes(a).toLowerCase().includes(q)||(a.obs||'').toLowerCase().includes(q)))return false}
    return true;
  });
}

function optsOf(f){return typeof f.opts==='function'?f.opts():(f.opts||[])}

  if(f.t==='date')return v?fmtD(v):'';
  if(f.t==='check')return v?'Sim':'Não';
  return v==null?'':String(v);
}

function readForm(bg,campos){
  const out={};

    else{const el=bg.querySelector(`[name="${f.k}"]`);let v=el?el.value:'';if(f.t==='number'||f.t==='pct')v=v===''?0:Number(v);if(f.t==='pct')v=clamp(v);
      if(f.t==='select'&&(f.k==='probabilidade'||f.k==='impacto'))v=Number(v)||3;out[f.k]=typeof v==='string'?v.trim():v}

function openForm(table,id,defaults,after){
  if(readOnly){toast('Modo somente leitura: alterações não são permitidas.','err');return}
  const sc=SCHEMAS[table];const list=S[table];const old=id?list.find(x=>x.id===id):null;
  const rec=old?JSON.parse(JSON.stringify(old)):{};
  if(!old){sc.campos.forEach(f=>{if(f.def!==undefined)rec[f.k]=typeof f.def==='function'?f.def():f.def;if(f.t==='multi'||f.t==='subs')rec[f.k]=rec[f.k]||[]});Object.assign(rec,defaults||{})}
  const body=`<form class="mbody" novalidate>${sc.campos.map(f=>fieldHTML(f,rec,id)).join('')}</form>`;
  const footer=`${old?`<button class="btn danger" data-del style="margin-right:auto">${ICON.del}Excluir</button>`:''}<button class="btn" data-cancel>Cancelar</button><button class="btn primary" data-save>${old?'Salvar alterações':'Cadastrar'}</button>`;
  openModal({title:(old?'Editar ':'Nova ')+sc.titulo.toLowerCase().replace(/^./,c=>c.toUpperCase()),body,footer,wide:table==='atividades',onMount:(bg,close)=>{
    const pr=$('[data-pr]',bg),pn=bg.querySelector('[name="pct"]');
    if(pr&&pn){pr.oninput=()=>pn.value=pr.value;pn.oninput=()=>pr.value=pn.value;$$('[data-pq]',bg).forEach(b=>b.onclick=()=>{pr.value=pn.value=b.dataset.pq})}
    $$('[data-ms]',bg).forEach(s=>s.oninput=()=>{const q=s.value.toLowerCase();$$('label',s.parentElement).forEach(l=>l.style.display=l.textContent.toLowerCase().includes(q)?'':'none')});
    const subs=$('[data-subs]',bg);
    if(subs){$('[data-addsub]',bg).onclick=()=>{subs.insertAdjacentHTML('beforeend',subRow());const r=subs.lastElementChild;$('[data-sn]',r).focus()};
      subs.addEventListener('click',e=>{const b=e.target.closest('[data-delsub]');if(b)b.closest('.sr').remove()})}
    $('[data-cancel]',bg).onclick=close;
    $('form',bg).onsubmit=e=>{e.preventDefault();$('[data-save]',bg).click()};
    $('[data-save]',bg).onclick=()=>{
      const val=readForm(bg,sc.campos);

      if(val.inicio&&val.fim&&val.fim<val.inicio){toast('A data final não pode ser anterior à data inicial.','err');return}
      saveRecord(table,old,val);close();if(after)after();commit();
    };
    if(old)$('[data-del]',bg).onclick=async()=>{if(await removeRecord(table,old.id)){close();commit()}};
  }});
}
function syncActivity(n,old){
  if(old&&old.status!==n.status&&(+old.pct||0)>=100&&n.status!=='Concluído'&&n.status!=='Cancelado'&&n.pct>=100){n.pct=(n.status==='Não iniciado'||n.status==='Em planejamento')?0:n.status==='Em validação'?95:90;n.concluidaEm=''}
  if(n.pct>=100&&n.status!=='Cancelado'){n.pct=100;if(n.status!=='Concluído')n.status='Concluído';if(!n.concluidaEm)n.concluidaEm=todayISO()}
  else{
    if(n.status==='Concluído'){if(old&&old.status!=='Concluído'){n.pct=100;if(!n.concluidaEm)n.concluidaEm=todayISO()}else n.status=n.pct>0?'Em execução':'Não iniciado'}
    if(n.pct>0&&(n.status==='Não iniciado'||n.status==='Em planejamento'))n.status='Em execução';
    if(n.pct<100)n.concluidaEm=n.status==='Concluído'?n.concluidaEm:'';
  }
  if(n.macroId&&!n.faseId){const m=macroById(n.macroId);if(m&&m.faseId)n.faseId=m.faseId}
}
function saveRecord(table,old,val){
  const sc=SCHEMAS[table];

async function removeRecord(table,id){
  if(readOnly){toast('Modo somente leitura.','err');return false}
  const sc=SCHEMAS[table];const rec=S[table].find(x=>x.id===id);if(!rec)return false;
  let msg=`Excluir "${rec[sc.nomeK]}"?`;
  if(table==='frentes'){const ms=S.macros.filter(m=>m.frenteId===id);const n=S.atividades.filter(a=>ms.some(m=>m.id===a.macroId)).length;msg+=` Serão excluídas também ${ms.length} macroatividade(s) e ${n} atividade(s).`}
  if(table==='macros'){const n=S.atividades.filter(a=>a.macroId===id).length;if(n)msg+=` Serão excluídas também ${n} atividade(s).`}
  if(!await askConfirm(msg))return false;
  const delActs=ids=>{const set=new Set(ids);S.atividades=S.atividades.filter(a=>!set.has(a.id));S.atividades.forEach(a=>a.dependeDe=a.dependeDe.filter(d=>!set.has(d)))};
  if(table==='frentes'){const ms=S.macros.filter(m=>m.frenteId===id).map(m=>m.id);delActs(S.atividades.filter(a=>ms.includes(a.macroId)).map(a=>a.id));S.macros=S.macros.filter(m=>m.frenteId!==id);S.pessoas.forEach(p=>p.frenteIds=p.frenteIds.filter(f=>f!==id))}
  if(table==='macros')delActs(S.atividades.filter(a=>a.macroId===id).map(a=>a.id));
  if(table==='atividades')delActs([id]);
  if(table==='pessoas')S.atividades.forEach(a=>a.responsavelIds=a.responsavelIds.filter(p=>p!==id));
  if(table==='usinas')S.atividades.forEach(a=>a.usinaIds=a.usinaIds.filter(u=>u!==id));
  if(table==='fases')S.atividades.forEach(a=>{if(a.faseId===id)a.faseId=''});
  if(table!=='atividades')S[table]=S[table].filter(x=>x.id!==id);
  logChange(sc.ent,rec[sc.nomeK],'Exclusão','existente','excluído');
  toast('Excluído: '+rec[sc.nomeK]);
  return true;
}
function moveOrder(table,id,dir,groupKey){
  const rec=S[table].find(x=>x.id===id);if(!rec)return;
  const grp=S[table].filter(x=>!groupKey||x[groupKey]===rec[groupKey]).sort(byOrder);
  grp.forEach((x,i)=>x.ordem=i);const i=grp.indexOf(rec),j=i+dir;if(j<0||j>=grp.length)return;
  [grp[i].ordem,grp[j].ordem]=[grp[j].ordem,grp[i].ordem];commit();
}

function evoSeries(){

  const reals=Object.keys(S.realizado).sort();
  for(let i=0;i<=n;i+=step){const d=addDays(st,i);labels.push(fmtDs(d));plan.push(r1(plannedProjetoAt(d)));
    if(d<=t){let v=null;for(const rk of reals){if(rk<=d)v=S.realizado[rk];else break}if(d===t||addDays(d,step)>t)v=r1(projetoPct());real.push(v)}else real.push(null)}
  if(labels[labels.length-1]!==fmtDs(en)){labels.push(fmtDs(en));plan.push(r1(plannedProjetoAt(en)));real.push(en<=t?r1(projetoPct()):null)}
  return {labels,plan,real};
}

/* ---------------- Timeline / Gantt ---------------- */
let GZOOM='semana',GLEVEL='atividades';
const ZOOMS={dia:34,semana:13,'mês':4.6,trimestre:1.9};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function ganttSVG({acts,level,zoom,screen}){
  const P=pal(screen);const ppd=ZOOMS[zoom]||13;const LW=330,RH=26,HH=58;const t=todayISO();
  const ids=new Set(acts.map(a=>a.id));
  const rows=[];
  frentesSorted().forEach(f=>{const fa=actsOfFrente(f.id).filter(a=>ids.has(a.id));if(!fa.length)return;
    rows.push({k:'f',f,acts:fa,p:frentePct(f,realAcc,a=>ids.has(a.id))});
    macrosOf(f.id).forEach(m=>{const ma=actsOfMacro(m.id).filter(a=>ids.has(a.id));if(!ma.length)return;rows.push({k:'m',m,acts:ma,p:macroPct(m,realAcc,a=>ids.has(a.id))});
      if(level==='atividades')ma.slice().sort((a,b)=>(a.inicio||'').localeCompare(b.inicio||'')).forEach(a=>rows.push({k:'a',a}))})});
  const dates=acts.flatMap(a=>[a.inicio,a.fim]).filter(Boolean).concat([S.meta.inicio,S.meta.fim,S.meta.day1].filter(Boolean)).concat((S.marcos||[]).map(m=>m.data).filter(Boolean)).sort();
  if(!rows.length||!dates.length)return {svg:`<div class="empty">Nenhuma atividade com datas para exibir.</div>`,w:0,h:0};
  const start=addDays(dates[0],-3),end=addDays(dates[dates.length-1],4);const nd=dayDiff(start,end)+1;
  const W=LW+nd*ppd+20,H=HH+rows.length*RH+10;const X=iso=>LW+dayDiff(start,iso)*ppd;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Barlow, Arial, sans-serif"><rect width="${W}" height="${H}" fill="${P.surface}"/>`;
  // fins de semana e grade
  for(let i=0;i<nd;i++){const d=addDays(start,i);const wd=parseD(d).getDay();
    if((wd===0||wd===6)&&ppd>=8)s+=`<rect x="${LW+i*ppd}" y="${HH}" width="${ppd}" height="${H-HH}" fill="${P.soft}" opacity=".6"/>`;
    const dd=parseD(d).getDate();
    if(dd===1)s+=`<line x1="${LW+i*ppd}" y1="18" x2="${LW+i*ppd}" y2="${H}" stroke="${P.line}"/>`;
    else if(wd===1&&ppd>=4)s+=`<line x1="${LW+i*ppd}" y1="${HH}" x2="${LW+i*ppd}" y2="${H}" stroke="${P.line}" stroke-dasharray="2 3" opacity=".7"/>`;
  }
  // fases
  S.fases.slice().sort(byOrder).forEach((f,i)=>{if(!f.inicio||!f.fim)return;const x1=X(f.inicio),x2=X(f.fim)+ppd;const col=i%2?'#123D66':'#1F6FB5';
    s+=`<rect x="${x1}" y="1" width="${Math.max(2,x2-x1)}" height="16" rx="3" fill="${col}" opacity=".9"/><text x="${x1+5}" y="13" font-size="10.5" fill="#fff">${esc(trunc(f.nome.replace(/^Fase (\d+) — /,'F$1 · '),Math.floor((x2-x1)/5.6)))}</text>`});
  // meses
  let cur=start;while(cur<=end){const d=parseD(cur);const mEnd=isoOf(new Date(d.getFullYear(),d.getMonth()+1,0));const e=mEnd<end?mEnd:end;const x1=X(cur),x2=X(e)+ppd;
    s+=`<text x="${x1+4}" y="33" font-size="12" font-weight="600" fill="${P.ink}">${MESES[d.getMonth()]}/${d.getFullYear()}</text>`;cur=addDays(mEnd,1)}
  // dias / semanas
  for(let i=0;i<nd;i++){const d=addDays(start,i);const dt=parseD(d);
    if(zoom==='dia')s+=`<text x="${LW+i*ppd+ppd/2}" y="50" font-size="10.5" text-anchor="middle" fill="${P.muted}">${dt.getDate()}</text>`;
    else if(zoom==='semana'&&dt.getDay()===1)s+=`<text x="${LW+i*ppd+2}" y="50" font-size="10.5" fill="${P.muted}">${fmtDs(d)}</text>`;
    else if(zoom==='mês'&&(dt.getDate()===1||dt.getDate()===15))s+=`<text x="${LW+i*ppd+2}" y="50" font-size="10" fill="${P.muted}">${dt.getDate()}</text>`;
  }
  s+=`<line x1="0" y1="${HH-1}" x2="${W}" y2="${HH-1}" stroke="${P.line}"/>`;
  let lab=`<rect x="0" y="0" width="${LW}" height="${H}" fill="${P.surface}"/><text x="10" y="33" font-size="12" font-weight="600" fill="${P.muted}">Frente / macroatividade / atividade</text><text x="${LW-10}" y="33" font-size="12" font-weight="600" fill="${P.muted}" text-anchor="end">%</text><line x1="0" y1="${HH-1}" x2="${LW}" y2="${HH-1}" stroke="${P.line}"/>`;
  rows.forEach((r,i)=>{const y=HH+i*RH;
    if(r.k==='f'){s+=`<rect x="0" y="${y}" width="${W}" height="${RH}" fill="${P.surface2}"/>`;lab+=`<rect x="0" y="${y}" width="${LW}" height="${RH}" fill="${P.surface2}"/>`}
    lab+=`<line x1="0" y1="${y+RH}" x2="${LW}" y2="${y+RH}" stroke="${P.line}" opacity=".6"/>`;
    s+=`<line x1="0" y1="${y+RH}" x2="${W}" y2="${y+RH}" stroke="${P.line}" opacity=".6"/>`;
    let label,pct,ini,fim,color,ind,bold;
    if(r.k==='f'){label=r.f.nome;pct=r.p;ind=8;bold=700;color=P.navy}
    else if(r.k==='m'){label=r.m.nome;pct=r.p;ind=22;bold=600;color='#4A7FB5'}
    else{const a=r.a;label=(a.codigo?a.codigo+' ':'')+a.nome;pct=a.pct;ind=38;bold=400;color=SIT[situacao(a,t)].hex}
    if(r.k!=='a'){const ds=r.acts.flatMap(a=>[a.inicio,a.fim]).filter(Boolean).sort();ini=ds[0];fim=ds[ds.length-1]}else{ini=r.a.inicio;fim=r.a.fim}
    const resp=r.k==='a'?(respNomes(r.a).split(',')[0]||''):'';
    const maxCh=Math.floor((LW-ind-60)/(bold>=600?6.6:6.1));
    lab+=`<text x="${ind}" y="${y+17}" font-size="${r.k==='f'?13:12.5}" font-weight="${bold}" fill="${P.ink}">${esc(trunc(label,maxCh))}</text><text x="${LW-10}" y="${y+17}" font-size="12" text-anchor="end" fill="${P.muted}" font-weight="600">${pct==null?'—':r0(pct)+'%'}</text>`;
    if(ini&&fim){const x1=X(ini),x2=X(fim)+ppd,bw=Math.max(3,x2-x1),bh=r.k==='a'?14:r.k==='m'?12:10,by=y+(RH-bh)/2;
      const hit=r.k==='a'?` class="bar-hit" data-act="${r.a.id}"`:'';
      s+=`<g${hit}><title>${esc(label)} — ${fmtD(ini)} a ${fmtD(fim)} — ${pct==null?0:r0(pct)}%${resp?' — '+esc(resp):''}</title><rect x="${x1}" y="${by}" width="${bw}" height="${bh}" rx="3" fill="${color}" opacity=".22"/><rect x="${x1}" y="${by}" width="${bw*clamp(pct||0)/100}" height="${bh}" rx="3" fill="${color}"/>`;
      if(r.k==='a'){const lbl=resp?`${pct}% · ${resp}`:`${pct}%`;s+=`<text x="${x2+5}" y="${y+17}" font-size="11" fill="${P.muted}">${esc(lbl)}</text>`}
      s+=`</g>`}
  });
  (S.marcos||[]).forEach(m=>{if(!m.data||m.data<start||m.data>end)return;const x=X(m.data)+ppd/2;const d1=S.meta.day1&&m.data===S.meta.day1;const col=d1?'#22A06B':'#7A5AF8';
    s+=`<g><title>${esc(m.nome)} — ${fmtD(m.data)}${m.status?' — '+esc(m.status):''}</title><line x1="${x}" y1="${HH}" x2="${x}" y2="${H}" stroke="${col}" stroke-width="${d1?2:1}" stroke-dasharray="${d1?'':'2 4'}" opacity=".8"/><path d="M${x} ${HH-12}l6 6-6 6-6-6z" fill="${col}"/></g>`});
  if(t>=start&&t<=end){const x=X(t)+ppd/2;s+=`<line x1="${x}" y1="18" x2="${x}" y2="${H}" stroke="#D64545" stroke-width="1.6" stroke-dasharray="4 3"/><text x="${x+4}" y="${HH-4}" font-size="10.5" fill="#D64545" font-weight="600">hoje</text>`}
  s+=`<g class="glab">${lab}<line x1="${LW}" y1="0" x2="${LW}" y2="${H}" stroke="${P.line}"/></g></svg>`;return {svg:s,w:W,h:H};
}
function trunc(s,n){s=String(s||'');n=Math.max(4,n|0);return s.length>n?s.slice(0,n-1)+'…':s}

/* ---------------- Arquitetura ---------------- */
const NW=176,NH=58;
const ARCH={id:null,sel:null,connecting:false,from:null};
function curArch(){let a=S.arquiteturas.find(x=>x.id===ARCH.id);if(!a){a=S.arquiteturas[0];ARCH.id=a?a.id:null}return a}
function edgePoint(n,tx,ty){const cx=n.x+NW/2,cy=n.y+NH/2;const dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return [cx,cy];const sx=Math.abs(dx)/(NW/2+6),sy=Math.abs(dy)/(NH/2+6);const k=1/Math.max(sx,sy);return [cx+dx*k,cy+dy*k]}

function archSVG(a,{screen,editor}={}){

  <defs>${Object.entries(LINK_STATUS).map(([k,c])=>`<marker id="ar_${k.replace(/\s/g,'')}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')}
  <pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="${P.line}"/></pattern></defs>
  <rect width="${b.w}" height="${b.h}" fill="${P.surface}"/>${editor?`<rect width="${b.w}" height="${b.h}" fill="url(#gridp)"/>`:''}`;
  if(!editor&&!screen)s+=`<text x="24" y="34" font-size="20" font-weight="700" fill="${P.ink}">${esc(a.nome)}</text><text x="24" y="54" font-size="13" fill="${P.muted}">${esc(a.descricao||'')}</text>`;
  a.links.forEach(l=>{const A=nodes.get(l.from),B=nodes.get(l.to);if(!A||!B)return;
    const [x1,y1]=edgePoint(A,B.x+NW/2,B.y+NH/2),[x2,y2]=edgePoint(B,A.x+NW/2,A.y+NH/2);const col=LINK_STATUS[l.status]||P.grey;const sel=editor&&ARCH.sel&&ARCH.sel.kind==='link'&&ARCH.sel.id===l.id;
    const mx=(x1+x2)/2,my=(y1+y2)/2;const txt=l.protocolo+(l.porta?':'+l.porta:'');const tw=txt.length*6.6+14;

      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sel?4:2.2}" ${l.status==='Planejado'?'stroke-dasharray="7 5"':''} marker-end="url(#ar_${(l.status||'Planejado').replace(/\s/g,'')})"/>
      <rect x="${mx-tw/2}" y="${my-11}" width="${tw}" height="20" rx="10" fill="${P.surface}" stroke="${col}" stroke-width="${sel?2:1}"/><text x="${mx}" y="${my+4}" font-size="11.5" font-weight="600" text-anchor="middle" fill="${P.ink}">${esc(txt)}</text>
      ${l.vlan&&!editor?'':''}</g>`});
  a.nodes.forEach(n=>{const T=NODE_TYPES[n.tipo]||NODE_TYPES.Outro;const sel=editor&&ARCH.sel&&ARCH.sel.kind==='node'&&ARCH.sel.id===n.id;const from=editor&&ARCH.from===n.id;
    s+=`<g class="node" data-node="${n.id}" transform="translate(${n.x},${n.y})"><rect width="${NW}" height="${NH}" rx="8" fill="${P.surface}" stroke="${sel||from?P.blue:T.c}" stroke-width="${sel||from?3:1.5}"/>
      <rect width="7" height="${NH}" rx="3" fill="${T.c}"/>${nodeGlyph(n.tipo,T.c)}
      <text x="40" y="22" font-size="11" font-weight="600" fill="${T.c}">${esc(T.l)}${n.ip?' · '+esc(n.ip):''}</text>

  s+='</svg>';return s;
}
function nodeGlyph(t,c){const g={UFV:'<rect x="15" y="20" width="18" height="12" fill="none" stroke="C" stroke-width="1.6"/><path d="M15 26h18M21 20v12M27 20v12" stroke="C" stroke-width="1.2"/>',

  Datacenter:'<rect x="16" y="18" width="16" height="18" rx="1.5" fill="none" stroke="C" stroke-width="1.6"/><path d="M16 24h16M16 30h16" stroke="C" stroke-width="1.2"/>',

VIEWS.arquitetura=()=>{

function archDeleteSel(){if(readOnly)return;const a=curArch();const s=ARCH.sel;if(!s)return;
  if(s.kind==='node'){const n=a.nodes.find(x=>x.id===s.id);a.nodes=a.nodes.filter(x=>x.id!==s.id);a.links=a.links.filter(l=>l.from!==s.id&&l.to!==s.id);logChange('Arquitetura',a.nome,'Elemento removido',n?n.label:'','')}

  const a=curArch();if(!a)return;

  const cb=$('[data-connect]',c);if(cb)cb.onclick=()=>{ARCH.connecting=!ARCH.connecting;ARCH.from=null;render()};
  const svg=$('#archSvg',c);let drag=null;
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
  svg.addEventListener('pointerdown',e=>{
    const ng=e.target.closest('[data-node]'),lg=e.target.closest('[data-link]');
    if(ng){const id=ng.dataset.node;
      if(ARCH.connecting){if(!ARCH.from){ARCH.from=id;redrawArch();$('[data-connect]').innerHTML=ICON.link+'Clique no destino…'}
        else if(ARCH.from!==id){if(!readOnly){const l={id:uid('l'),from:ARCH.from,to:id,protocolo:'TCP/IP',ip:'',porta:'',vlan:'',meio:'',status:'Planejado',obs:''};a.links.push(l);ARCH.sel={kind:'link',id:l.id};persist()}ARCH.from=null;ARCH.connecting=false;render()}
        return}
      const n=a.nodes.find(x=>x.id===id);const p=pt(e);drag={n,dx:p.x-n.x,dy:p.y-n.y,moved:false};svg.setPointerCapture(e.pointerId);
      if(!(ARCH.sel&&ARCH.sel.id===id)){ARCH.sel={kind:'node',id};redrawArch();redrawPanel()}return}
    if(lg){ARCH.sel={kind:'link',id:lg.dataset.link};redrawArch();redrawPanel();return}
    if(ARCH.sel){ARCH.sel=null;redrawArch();redrawPanel()}
  });
  svg.addEventListener('pointermove',e=>{if(!drag||readOnly)return;const p=pt(e);drag.n.x=Math.max(0,Math.round((p.x-drag.dx)/10)*10);drag.n.y=Math.max(0,Math.round((p.y-drag.dy)/10)*10);drag.moved=true;redrawArch()});
  const end=()=>{if(drag&&drag.moved)archTouch();drag=null};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
};
