async function sbFetch(table,query,opt={},retry=true){
  const c=SB.cfg;const url=c.url.replace(/\/+$/,'')+'/rest/v1/'+table+(query||'');
  const tok=(typeof AUTH!=='undefined'&&AUTH.sess&&!opt.anon)?AUTH.sess.access_token:c.key;
  const h={apikey:c.key,'Content-Type':'application/json'};if(!(tok===c.key&&/^sb_/.test(c.key)))h.Authorization='Bearer '+tok;if(opt.prefer)h.Prefer=opt.prefer;
  const r=await fetch(url,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});
  if(r.status===401&&retry&&typeof AUTH!=='undefined'&&AUTH.sess&&!opt.anon){if(await authRefresh())return sbFetch(table,query,opt,false);authExpired();}
  if(!r.ok){let t='';try{t=await r.text()}catch(e){}const err=new Error('HTTP '+r.status+' '+t.slice(0,200));err.status=r.status;throw err}
  if(r.status===204)return null;const tx=await r.text();return tx?JSON.parse(tx):null;
}

const clone=o=>JSON.parse(JSON.stringify(o));const J=x=>JSON.stringify(x);
function keyOf(x){return x&&typeof x==='object'&&!Array.isArray(x)?(x.id!=null?'id:'+x.id:x.k!=null?'k:'+x.k:null):null}
/* fusão em 3 vias: base (última versão sincronizada) × local × remoto — combina edições de pessoas diferentes por registro e por campo */
function merge3(b,l,r){
  if(J(l)===J(r))return l;if(J(l)===J(b))return r;if(J(r)===J(b))return l;
  if(Array.isArray(l)&&Array.isArray(r)&&l.every(x=>keyOf(x))&&r.every(x=>keyOf(x))&&(l.length||r.length)){
    const bm=new Map((Array.isArray(b)?b:[]).filter(keyOf).map(x=>[keyOf(x),x])),lm=new Map(l.map(x=>[keyOf(x),x])),rm=new Map(r.map(x=>[keyOf(x),x]));
    const pick=k=>{const bv=bm.get(k),lv=lm.get(k),rv=rm.get(k);
      if(lv===undefined)return bv!==undefined&&J(rv)===J(bv)?undefined:rv;
      if(rv===undefined)return bv!==undefined&&J(lv)===J(bv)?undefined:lv;
      return merge3(bv,lv,rv)};
    const out=[],seen=new Set();
    r.forEach(x=>{const k=keyOf(x);seen.add(k);const v=pick(k);if(v!==undefined)out.push(v)});
    l.forEach(x=>{const k=keyOf(x);if(seen.has(k))return;seen.add(k);const v=pick(k);if(v!==undefined)out.push(v)});
    return out}
  if(l&&r&&typeof l==='object'&&typeof r==='object'&&!Array.isArray(l)&&!Array.isArray(r)){
    const bo=b&&typeof b==='object'&&!Array.isArray(b)?b:{};const out={};
    new Set([...Object.keys(r),...Object.keys(l)]).forEach(k=>{const bv=bo[k],lv=l[k],rv=r[k];
      if(!(k in l)){if(k in bo&&J(rv)===J(bv))return;out[k]=rv;return}
      if(!(k in r)){if(k in bo&&J(lv)===J(bv))return;out[k]=lv;return}
      out[k]=merge3(bv,lv,rv)});
    return out}
  return l;
}

async function sbSave(){
  if(!SB.on||SB.saving||!SB.dirty)return;

  SB.saving=true;SB.dirty=false;sbRemember();
  try{
    const newRev=uid('rev');S.meta.rev=newRev;const body={state:S,rev:newRev,updated_by:currentUser(),updated_at:new Date().toISOString()};
    const res=await sbFetch('projeto_estado',`?id=eq.${encodeURIComponent(sbPid())}&rev=eq.${encodeURIComponent(SB.rev||'')}`,{method:'PATCH',body,prefer:'return=representation'});
    if(res&&res.length){SB.rev=newRev;SB.base=clone(S);saveLocal();setInd('','Salvo no banco às '+hhmm());syncBar(null)}
    else{const remote=await sbGetFull();
      if(!remote){await sbFetch('projeto_estado','',{method:'POST',body:{id:sbPid(),...body},prefer:'return=minimal'});SB.rev=newRev;SB.base=clone(S);setInd('','Salvo no banco às '+hhmm())}

      else{S=normalize(merge3(SB.base,S,clone(remote.state)));SB.base=clone(remote.state);SB.rev=remote.rev;SB.dirty=true;saveLocal();if(!modalDepth)render();
        toast(`${remote.updated_by||'Outra pessoa'} salvou ao mesmo tempo. As alterações foram combinadas e serão gravadas.`)}}
  }catch(e){SB.dirty=true;setInd('err','Sem conexão com o banco — tentando de novo');syncBar('err','Sem conexão com o banco. Suas alterações estão guardadas neste computador e serão enviadas assim que a conexão voltar.');clearTimeout(SB.timer);SB.timer=setTimeout(sbSave,8000)}
  finally{SB.saving=false;sbRemember();if(SB.dirty&&SB.ok){clearTimeout(SB.timer);SB.timer=setTimeout(sbSave,400)}}
}
async function sbPoll(){
  if(!SB.on||SB.saving)return;
  if(!SB.ok)return sbConnect();
  try{const r=await sbFetch('projeto_estado',`?id=eq.${encodeURIComponent(sbPid())}&select=rev,updated_by,updated_at`);SB.last=new Date();

  catch(e){setInd('err','Sem conexão com o banco');syncBar('err','Sem conexão com o banco. Você pode continuar editando: as alterações ficam guardadas neste computador e são enviadas quando a conexão voltar.')}

async function sbConnect(){
  try{
    try{const pid=lsGet('pme_sync_pid');if(pid&&SB.cfg&&!SB.cfg.projetoFixo)SB.cfg={...SB.cfg,projeto:pid}}catch(e){}
    let remote=await sbGetFull();

      if(SB.dirty&&SB.base){S=normalize(merge3(SB.base,S,clone(remote.state)))}else S=normalize(clone(remote.state));
      SB.base=clone(remote.state);SB.rev=remote.rev;
    }else{
      if(!isAdmin()){SB.ok=false;syncBar('err','O projeto ainda não foi inicializado no banco. Peça ao administrador para entrar primeiro.');return false}
      const rev=uid('rev');S.meta.rev=rev;await sbFetch('projeto_estado','',{method:'POST',body:{id:sbPid(),state:S,rev,updated_by:currentUser(),updated_at:new Date().toISOString()},prefer:'return=minimal'});

    :tema==='claro'?`linear-gradient(180deg,rgba(255,255,255,${k*.9}) 0%,rgba(240,245,250,${k*.6}) 45%,rgba(255,255,255,${k}) 100%)`

async function sha256(t){try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return 'x'+h}

function visTitulo(){return (VISUAL&&VISUAL.titulo)||DEF_TITULO}

    :`<div class="lg-card"><div class="lg-h">${ICON.user}<div><h3>Acessar o sistema</h3><p>Entre com seu e-mail e senha</p></div></div>${msgs}
      <div data-ubox><form id="fLogin"><label class="f"><span>E-mail</span><input type="email" name="email" autocomplete="username" required value="${esc(lsGet('pme_last_email')||'')}"></label>
        <label class="f"><span>Senha</span><input type="password" name="senha" autocomplete="current-password" required></label><button class="btn primary lg-btn" type="submit">Entrar</button></form>

    <div class="lg-single">${card}${inst?'':`<div class="lg-db">Banco: ${esc((cfg.url||'').replace(/^https?:\/\//,''))}${embeddedCfg()?'':' · conexão salva só neste navegador'}</div>`}</div><footer class="lg-foot">Criado por EDILSON SOARES DE ARAUJO FILHO</footer></div>`);

    const err=await sbTest(cfg);if(err)return showLogin({err:'O código foi lido, mas a conexão falhou: '+err,code:raw});lsSet(LS_SYNC,J(cfg));SB.cfg=cfg;loadVisual();showLogin({ok:'Conectado ao banco. Entre com seu e-mail e senha.'})};

    else if(await sha256('pme|'+s1)!==lsGet(LS_INST))return showLogin({inst:1,err:'Senha de instalação incorreta.'});

  setTimeout(()=>{const i=g.querySelector(lsGet('pme_last_email')?'#fLogin [name=senha]':'#fLogin [name=email]')||g.querySelector('#fInst input');if(i)i.focus()},60);

function encodeCode(c){return 'PME1.'+btoa(unescape(encodeURIComponent(J({u:c.url,k:c.key,p:c.projeto||'matrix-energisa'}))))}
function decodeCode(t){try{t=String(t||'').replace(/\s+/g,'');if(!t.startsWith('PME1.'))return null;const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(5)))));return o.u&&o.k?{url:o.u,key:o.k,projeto:o.p||'matrix-energisa'}:null}catch(e){return null}}

async function saveCfgRow(id,valor){const body={valor,updated_by:currentUser(),updated_at:new Date().toISOString()};const r=await sbFetch('config_app',`?id=eq.${id}`,{method:'PATCH',body,prefer:'return=representation'});if(!r||!r.length)await sbFetch('config_app','',{method:'POST',body:{id,...body},prefer:'return=minimal'})}

function imgToDataURL(file,max,type,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#0B2E4F';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

  pre{white-space:pre-wrap;font-family:inherit;background:#F8FAFC;border:1px solid #DDE4EC;border-radius:8px;padding:10px 12px}.m{color:#5E7085}.img{border:1px solid #DDE4EC;border-radius:8px;padding:6px;overflow:hidden}
  .obs{background:#FFF8E6;border-left:4px solid #D99A06;padding:8px 12px;margin:10px 0}footer{margin-top:30px;border-top:1px solid #DDE4EC;padding-top:8px;color:#8796A5;font-size:11px;display:flex;justify-content:space-between}
  @media print{body{padding:0}@page{size:A4;margin:14mm}h2{break-after:avoid}.img{break-inside:avoid}}</style></head><body>
  <header>${logo}<div><h1>${esc(cfg.titulo)}</h1>${cfg.subtitulo?`<p>${esc(cfg.subtitulo)}</p>`:''}<p>${esc(S.meta.nome)}</p></div></header>
  <div class="meta">Gerado em ${fmtD(t)} ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} por ${esc((AUTH.perfil&&AUTH.perfil.nome)||currentUser())}</div>
  ${filtros.length?`<div class="flt"><b>Filtros:</b> ${esc(filtros.join(' · '))}</div>`:''}${cfg.obs?`<div class="obs">${esc(cfg.obs).replace(/\n/g,'<br>')}</div>`:''}
  ${b||'<p class="m">Nenhuma seção selecionada.</p>'}<footer><span>${esc(visTitulo())}</span><span>Criado por Edilson Soares de Araujo Filho</span></footer></body></html>`;
}
function rpRead(bg){const g=n=>bg.querySelector(`[name="${n}"]`);const chk=n=>$$(`[name="${n}"]:checked`,bg).map(i=>i.value);
  return {nome:'',titulo:g('rp_titulo').value.trim()||'Relatório do projeto',subtitulo:g('rp_sub').value.trim(),secoes:RP_SECOES.map(s=>s[0]).filter(k=>chk('rp_sec').includes(k)),cols:RP_COLS.map(c=>c[0]).filter(k=>chk('rp_col').includes(k)),
    f:{frentes:chk('rp_fr'),fase:g('rp_fase').value,status:chk('rp_st'),prio:chk('rp_pr'),d1:g('rp_d1').checked,sit:g('rp_sit').value,usina:g('rp_us').value,de:g('rp_de').value,ate:g('rp_ate').value},arq:g('rp_arq').value,obs:g('rp_obs').value.trim()}}
function rpSlug(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'relatorio'}
function rpPrint(html){const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  f.onload=()=>{setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('Não foi possível abrir a impressão. Use “Baixar HTML” e imprima pelo navegador.','err')}setTimeout(()=>f.remove(),60000)},300)};f.srcdoc=html}
function openRelatorio(modelo){
  const cfg=JSON.parse(JSON.stringify(modelo||RP||rpDefault()));const ms=S.relModelos||[];
  const chk=(name,val,on,label)=>`<label class="rp-ck"><input type="checkbox" name="${name}" value="${esc(val)}"${on?' checked':''}> ${esc(label)}</label>`;
  const body=`<div class="rp-wrap"><div class="rp-form">
    <div class="row" style="gap:8px;margin-bottom:10px"><select id="rpModelo" style="flex:1"><option value="">Modelos salvos…</option>${ms.map(m=>`<option value="${esc(m.id)}">${esc(m.nome)}</option>`).join('')}</select><button class="btn sm" data-rpload>Carregar</button><button class="btn sm ghost" data-rpdelm>Excluir</button></div>
    <label class="f"><span>Título</span><input type="text" name="rp_titulo" value="${esc(cfg.titulo)}"></label>
    <label class="f mt"><span>Subtítulo (opcional)</span><input type="text" name="rp_sub" value="${esc(cfg.subtitulo)}"></label>
    <div class="rp-h">Seções</div><div class="rp-grid">${RP_SECOES.map(([k,l])=>chk('rp_sec',k,cfg.secoes.includes(k),l)).join('')}</div>
    <div class="rp-h">Filtros das ações</div>
    <div class="grid g2" style="gap:8px"><label class="f"><span>Fase</span><select name="rp_fase"><option value="">Todas</option>${optFases().map(o=>`<option value="${o.v}"${cfg.f.fase===o.v?' selected':''}>${esc(o.l)}</option>`).join('')}</select></label>
      <label class="f"><span>Situação</span><select name="rp_sit">${[['','Todas'],['pendentes','Pendentes'],['atrasada','Atrasadas'],['andamento','Em andamento'],['concluida','Concluídas'],['nao','Não iniciadas']].map(([v,l])=>`<option value="${v}"${cfg.f.sit===v?' selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f"><span>Usina</span><select name="rp_us"><option value="">Todas</option>${optUsinas().map(o=>`<option value="${o.v}"${cfg.f.usina===o.v?' selected':''}>${esc(o.l)}</option>`).join('')}</select></label>
      <label class="f" style="justify-content:flex-end"><span>&nbsp;</span><label class="rp-ck"><input type="checkbox" name="rp_d1"${cfg.f.d1?' checked':''}> Só obrigatórias para o Day 1</label></label>
      <label class="f"><span>Período — de</span><input type="date" name="rp_de" value="${esc(cfg.f.de)}"></label><label class="f"><span>até</span><input type="date" name="rp_ate" value="${esc(cfg.f.ate)}"></label></div>
    <details class="mt"><summary class="small" style="cursor:pointer;font-weight:600">Frentes, status e criticidade</summary>
      <div class="rp-sub">Frentes (nenhuma marcada = todas)</div><div class="rp-grid">${frentesSorted().map(f=>chk('rp_fr',f.id,cfg.f.frentes.includes(f.id),f.nome)).join('')}</div>
      <div class="rp-sub">Status</div><div class="rp-grid">${STATUS.map(s=>chk('rp_st',s,cfg.f.status.includes(s),s)).join('')}</div>
      <div class="rp-sub">Criticidade</div><div class="rp-grid">${PRIORIDADES.map(s=>chk('rp_pr',s,cfg.f.prio.includes(s),s)).join('')}</div></details>
    <details class="mt"><summary class="small" style="cursor:pointer;font-weight:600">Colunas da lista de ações</summary><div class="rp-grid mt">${RP_COLS.map(([k,l])=>chk('rp_col',k,cfg.cols.includes(k),l)).join('')}</div></details>
    <label class="f mt"><span>Arquitetura a incluir</span><select name="rp_arq">${S.arquiteturas.map(a=>`<option value="${a.id}"${cfg.arq===a.id?' selected':''}>${esc(a.nome)}</option>`).join('')}</select></label>
    <label class="f mt"><span>Observações no início do relatório</span><textarea name="rp_obs">${esc(cfg.obs)}</textarea></label>
    <div class="row mt"><button class="btn primary" data-rpprev>Atualizar pré-visualização</button><button class="btn" data-rpsave>Salvar como modelo</button></div></div>
    <div class="rp-prev"><iframe id="rpFrame" title="Pré-visualização do relatório"></iframe></div></div>`;
  openModal({title:'Relatório personalizado',wide:true,body,footer:`<span class="small muted" style="margin-right:auto">Para PDF: “Imprimir / salvar PDF” e escolha “Salvar como PDF” na impressora.</span><button class="btn" data-rpxls>${ICON.dl}Excel</button><button class="btn" data-rphtml>${ICON.dl}Baixar HTML</button><button class="btn primary" data-rpprint>${ICON.report}Imprimir / salvar PDF</button>`,
    onMount:(bg,close)=>{bg.querySelector('.modal').classList.add('rp-modal');
      const prev=()=>{RP=rpRead(bg);$('#rpFrame',bg).srcdoc=rpHTML(RP)};prev();
      bg.querySelector('.rp-form').addEventListener('change',()=>{clearTimeout(bg._t);bg._t=setTimeout(prev,350)});
      $('[data-rpprev]',bg).onclick=prev;
      $('[data-rpprint]',bg).onclick=()=>{if(!can('exportar'))return toast('Seu perfil não tem permissão para exportar.','err');prev();rpPrint(rpHTML(RP))};
      $('[data-rphtml]',bg).onclick=()=>{if(!can('exportar'))return toast('Seu perfil não tem permissão para exportar.','err');prev();saveFile(fileBase()+'-'+rpSlug(RP.titulo)+'.html',new Blob([rpHTML(RP)],{type:'text/html'}))};
      $('[data-rpxls]',bg).onclick=()=>{if(!can('exportar'))return toast('Seu perfil não tem permissão para exportar.','err');if(!needLib('Excel',window.XLSX))return;prev();const T=rpTabelas(RP);const wb=XLSX.utils.book_new();
        const info=[['Relatório',RP.titulo],['Projeto',S.meta.nome],['Gerado em',fmtD(todayISO())]];if(RP.secoes.includes('resumo'))statusText().split('\n').forEach(l=>info.push([l]));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(info),'Resumo');
        Object.values(T).forEach(x=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([x.cols,...x.rows]),x.titulo.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31)));
        saveFile(fileBase()+'-'+rpSlug(RP.titulo)+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]))};
      $('[data-rpsave]',bg).onclick=async()=>{prev();const nome=await askText('Salvar modelo de relatório','Nome do modelo',RP.titulo);if(!nome)return;const ex=(S.relModelos||[]).find(m=>m.nome===nome);
        if(ex)Object.assign(ex,{...RP,nome,id:ex.id});else S.relModelos.push({...RP,nome,id:uid('rel')});persist();toast('Modelo salvo: '+nome);close();openRelatorio(RP)};
      $('[data-rpload]',bg).onclick=()=>{const m=(S.relModelos||[]).find(x=>x.id===$('#rpModelo',bg).value);if(!m)return toast('Escolha um modelo.','err');close();openRelatorio(m)};
      $('[data-rpdelm]',bg).onclick=async()=>{const id=$('#rpModelo',bg).value;const m=(S.relModelos||[]).find(x=>x.id===id);if(!m)return toast('Escolha um modelo.','err');if(!await askConfirm(`Excluir o modelo “${m.nome}”?`))return;S.relModelos=S.relModelos.filter(x=>x.id!==id);persist();close();openRelatorio(RP)};
    }});
}
function askText(title,label,def){return new Promise(res=>{let done=false;openModal({title,body:`<form class="mbody"><label class="f full"><span>${esc(label)}</span><input type="text" name="v" value="${esc(def||'')}"></label></form>`,
  footer:`<button class="btn" data-n>Cancelar</button><button class="btn primary" data-y>Salvar</button>`,onMount:(bg,cl)=>{const i=bg.querySelector('[name=v]');setTimeout(()=>{i.focus();i.select()},40);
    const ok=()=>{done=true;res(i.value.trim());cl()};$('[data-y]',bg).onclick=ok;$('form',bg).onsubmit=e=>{e.preventDefault();ok()};$('[data-n]',bg).onclick=()=>{done=true;res('');cl()}},onClose:()=>{if(!done)res('')}})})}
(function(){const bV=VIEWS.relatorios;VIEWS.relatorios=()=>`<section class="panel" style="border-left:4px solid var(--green);margin-bottom:16px"><div class="body row"><div style="flex:1;min-width:240px"><b style="font-size:16px">Relatório personalizado</b><div class="small muted">Escolha seções, filtros (frente, fase, status, criticidade, usina, período) e colunas. Gere em PDF, HTML ou Excel e salve modelos para reutilizar.</div></div>
  <button class="btn primary" data-rpopen>${ICON.report}Montar relatório</button></div></section>`+bV();
  const bA=AFTER.relatorios;AFTER.relatorios=c=>{bA(c);const b=$('[data-rpopen]',c);if(b)b.onclick=()=>openRelatorio()}})();
/* aplicar tema ao iniciar e após cada render */
(function(){const r=render;render=function(x){r(x);applyTheme()}})();
applyTheme();
init();
</script>
</body>
