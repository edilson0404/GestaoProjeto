<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projeto Matrix Energisa v5.0 — Gestão Técnica da Migração de UFVs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2E4F; --navy-2:#123D66; --blue:#1F6FB5; --blue-soft:#E3EEF9;
  --green:#22A06B; --green-soft:#E1F4EA; --amber:#D99A06; --amber-soft:#FBF1D6;
  --orange:#E2711D; --orange-soft:#FCE9DA; --red:#D64545; --red-soft:#FBE4E4;
  --grey:#9AA8B6; --grey-soft:#EEF2F6;
  --ink:#16263A; --muted:#5E7085; --line:#DDE4EC; --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#F8FAFC;
  --shadow:0 1px 2px rgba(11,46,79,.06),0 2px 8px rgba(11,46,79,.05);
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Barlow",system-ui,"Arial Narrow",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#0A2440; --navy-2:#13375C; --blue:#5AA2E8; --blue-soft:#16324F;
    --green:#3CC489; --green-soft:#123B2B; --amber:#F0B92E; --amber-soft:#3D3112;
    --orange:#F08A3E; --orange-soft:#41291A; --red:#F06B6B; --red-soft:#432020;
    --grey:#7D8EA0; --grey-soft:#1D2A38;
    --ink:#E6EDF5; --muted:#9AAABB; --line:#26374A; --bg:#0D1722; --surface:#132130; --surface-2:#172838;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --navy:#0A2440; --navy-2:#13375C; --blue:#5AA2E8; --blue-soft:#16324F;
  --green:#3CC489; --green-soft:#123B2B; --amber:#F0B92E; --amber-soft:#3D3112;
  --orange:#F08A3E; --orange-soft:#41291A; --red:#F06B6B; --red-soft:#432020;
  --grey:#7D8EA0; --grey-soft:#1D2A38;
  --ink:#E6EDF5; --muted:#9AAABB; --line:#26374A; --bg:#0D1722; --surface:#132130; --surface-2:#172838;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.shell{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:var(--navy);color:#DCE7F2;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand-mark{display:flex;align-items:center;gap:10px}
.brand-mark svg{flex:none}
.brand h1{font-family:var(--cond);font-weight:700;font-size:21px;line-height:1.05;margin:0;color:#fff;letter-spacing:.2px}
.brand p{margin:8px 0 0;font-size:12.5px;color:#9FB6CC;line-height:1.35}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:7px;font-size:14.5px;color:#C9D7E5}
.nav button svg{width:17px;height:17px;flex:none;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 #3CC489}
.nav button:focus-visible{outline:2px solid #5AA2E8}
.nav .badge{margin-left:auto;background:#D64545;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 7px}
.side-foot{margin-top:auto;padding:14px 18px 18px;font-size:11.5px;color:#7F98B0;border-top:1px solid rgba(255,255,255,.08)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h2{font-family:var(--cond);font-weight:600;font-size:24px;margin:0;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px}
.top .grow{flex:1}
.menu-btn{display:none}
.content{flex:1;overflow-y:auto;padding:22px 24px 48px}
.save-ind{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save-ind i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.save-ind.saving i{background:var(--amber)}
.save-ind.err i{background:var(--red)}
.demo-pill{font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);padding:3px 10px;border-radius:20px}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--grey-soft)}
.btn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:4px;border-radius:5px;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--grey-soft);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;font-size:14px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f > span{font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.panel > header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel > header h3{margin:0;font-size:16px;font-weight:600}
.panel > header .hint{color:var(--muted);font-size:13px}
.panel .body{padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Hero */
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:22px 24px 18px;position:relative;overflow:hidden}
.hero-top{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.hero h2{font-family:var(--cond);font-size:30px;line-height:1.05;margin:0;font-weight:700}
.hero .obj{color:#B5C9DC;margin:6px 0 0;max-width:62ch;font-size:14.5px}
.hero .meta{display:flex;gap:22px;margin-top:14px;font-size:13px;color:#9FB6CC;flex-wrap:wrap}
.hero .meta b{display:block;color:#fff;font-size:15px;font-weight:600}
.hero .big{margin-left:auto;text-align:right}
.hero .big .n{font-family:var(--cond);font-size:72px;font-weight:700;line-height:.9}
.hero .big .n small{font-size:34px;color:#9FB6CC}
.hero .big .l{font-size:13px;color:#9FB6CC}
.status-pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px}
.st-ok{background:#1E7E55;color:#fff}.st-warn{background:#B98306;color:#fff}.st-crit{background:#B83434;color:#fff}
.phase-strip{margin-top:20px;position:relative}
.phase-strip .segs{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px}
.phase-strip .seg{background:rgba(255,255,255,.08);position:relative;min-width:0;display:flex;align-items:center;padding:0 8px;font-size:12px;color:#C9D7E5;white-space:nowrap;overflow:hidden}
.phase-strip .seg .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#1F6FB5,#22A06B);opacity:.55}
.phase-strip .seg span{position:relative;overflow:hidden;text-overflow:ellipsis}
.phase-strip .today{position:absolute;top:-6px;bottom:-16px;width:2px;background:#F0B92E}
.phase-strip .today::after{content:attr(data-l);position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;color:#F0B92E;white-space:nowrap}
.phase-strip .legend{display:flex;justify-content:space-between;font-size:11.5px;color:#9FB6CC;margin-top:18px}
.plan-real{display:flex;gap:18px;font-size:13px;color:#B5C9DC;margin-top:4px}
.plan-real b{color:#fff}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);border-left:4px solid var(--c,var(--blue))}
.kpi:hover{border-color:var(--c,var(--blue))}
.kpi .n{font-family:var(--cond);font-size:32px;font-weight:700;line-height:1}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}

/* Bars */
.bar{height:8px;background:var(--grey-soft);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--c,var(--blue));border-radius:4px}
.fbars{display:flex;flex-direction:column;gap:9px}
.fbar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 46px;gap:12px;align-items:center;font-size:14px;cursor:pointer;padding:2px 4px;border-radius:5px}
.fbar:hover{background:var(--grey-soft)}
.fbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .pc{text-align:right;font-family:var(--cond);font-weight:700;font-size:17px}
.fbar .bar{height:12px;position:relative}
.fbar .bar .plan{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45}

/* Tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:hover td{background:var(--surface-2)}
.t td.num{text-align:right;font-variant-numeric:tabular-nums}
.t .acts{white-space:nowrap;text-align:right}
.t input[type=number]{width:72px;padding:4px 6px}
.t select{padding:4px 6px;width:auto}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--grey-soft);color:var(--muted);white-space:nowrap}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.orange{background:var(--orange-soft);color:var(--orange)}
.tag.red{background:var(--red-soft);color:var(--red)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.mini-pct{display:flex;align-items:center;gap:8px;min-width:110px}
.mini-pct .bar{flex:1;height:6px}
.mini-pct b{font-size:13px;width:36px;text-align:right}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.filters select,.filters input{width:auto;min-width:0;max-width:180px;padding:5px 8px;font-size:13.5px}
.filters .lbl{font-size:13px;color:var(--muted);font-weight:600}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--grey-soft);border-radius:10px;padding:10px;min-height:200px;max-height:calc(100vh - 250px);overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.kcol.over{outline:2px dashed var(--blue);outline-offset:-2px}
.kcol h4{position:sticky;top:-10px;background:var(--grey-soft);padding:6px 0;z-index:1;margin:0 0 2px;font-size:14px;display:flex;align-items:center;gap:6px}
.kcol h4 .c{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:grab;border-left:4px solid var(--c,var(--grey));font-size:13.5px}
.kcard:active{cursor:grabbing}
.kcard .nm{font-weight:600;line-height:1.3}
.kcard .fr{font-size:12px;color:var(--muted);margin-top:2px}
.kcard .ft{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.kcard .ft .bar{flex:1;height:5px}

/* Tree */
.tree .fr-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:600}
.tree .mc-row{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 30px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.tree .at-row{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 52px;border-bottom:1px solid var(--line);font-size:14px}
.tree .at-row .nm{flex:1;min-width:0}
.tree .su-row{padding:3px 12px 3px 74px;font-size:13px;color:var(--muted)}
.tree .grow{flex:1;min-width:0}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,22,38,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(4vh,env(safe-area-inset-top,0px)) 14px 20px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:min(720px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal.wide{width:min(1180px,100%)}
.modal > header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal > header h3{margin:0;font-size:18px}
.modal .mbody{padding:16px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.modal .mbody .full{grid-column:1/-1}
.modal > footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.multi{border:1px solid var(--line);border-radius:6px;max-height:150px;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:3px;font-weight:400;color:var(--ink);font-size:13.5px}
.multi label{display:flex;gap:7px;align-items:center;cursor:pointer}
.multi input[type=search]{margin-bottom:4px;padding:4px 7px}
.pct-in{display:flex;gap:10px;align-items:center}
.pct-in input[type=range]{flex:1;accent-color:var(--blue)}
.pct-in input[type=number]{width:76px}
.pct-quick{display:flex;gap:4px;margin-top:4px}
.pct-quick button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 8px;font-size:12px;cursor:pointer}
.subs{display:flex;flex-direction:column;gap:6px}
.subs .sr{display:grid;grid-template-columns:24px 1fr 170px 28px;gap:6px;align-items:center}
.req{color:var(--red)}

/* Toast */
.toasts{pointer-events:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:360px}
.toast.err{background:#9E2B2B}

/* Gantt */
.gantt-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:72vh}
.gantt-wrap svg{display:block}
.gantt-wrap .bar-hit{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* Architecture */
.arch-layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
.arch-canvas{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.arch-canvas svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.arch-canvas .node{cursor:move}
.arch-canvas.connecting .node{cursor:crosshair}
.arch-canvas .link-hit{cursor:pointer}
.arch-tabs{display:flex;gap:6px;flex-wrap:wrap}
.arch-help{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--surface);padding:2px 8px;border-radius:5px}

/* Risk matrix */
.rmatrix{display:grid;grid-template-columns:28px repeat(5,1fr);gap:3px;font-size:12px}
.rmatrix .cell{aspect-ratio:1.6;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
.rmatrix .ax{display:flex;align-items:center;justify-content:center;color:var(--muted)}

/* Analysis */
.ana{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ana .col{border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.ana .col h4{margin:0 0 8px;font-size:14.5px;display:flex;gap:7px;align-items:center}
.ana .col ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.ana .col.pos{border-top:4px solid var(--green)}
.ana .col.att{border-top:4px solid var(--amber)}
.ana .col.rsk{border-top:4px solid var(--red)}
.ana .col.act{border-top:4px solid var(--blue)}
.status-text{white-space:pre-wrap;font-size:14.5px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;max-height:60vh;overflow:auto}

/* Day1 */
.d1-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.d1-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--green)}
.d1-item .nm{flex:1;font-weight:500}
.d1-item.done .nm{color:var(--muted);text-decoration:line-through}

.chart-box{position:relative;height:260px}
.chart-box.tall{height:320px}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:14px}
.list-plain li:last-child{border-bottom:0}
.list-plain li .grow{flex:1;min-width:0}
.hist-item{font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.hist-item b{font-weight:600}
.sync-bar{padding:8px 24px;font-size:13.5px;border-bottom:1px solid var(--line)}.sync-bar.warn{background:var(--amber-soft)}.sync-bar.err{background:var(--red-soft)}
.gate{position:fixed;inset:0;z-index:40;background:radial-gradient(1200px 600px at 20% 10%,#123D66 0,#0B2E4F 55%,#081F36 100%);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.gate[hidden]{display:none!important}
.gate{background-color:#0B2E4F;background-size:cover;background-position:center;align-items:stretch}
.lg-wrap{width:min(1040px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;gap:26px;padding:28px 0 56px}
.lg-top{text-align:center;color:#fff}
.lg-logo{display:flex;justify-content:center;margin-bottom:12px;min-height:54px}
.lg-top h1{font-family:var(--cond);font-weight:700;font-size:clamp(30px,5vw,54px);letter-spacing:.5px;margin:0;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.lg-top p{margin:10px 0 0;color:#D6E4F0;font-size:16px;text-shadow:0 1px 8px rgba(0,0,0,.5)}

function normalize(s){
  const keys=['usinas','fases','frentes','macros','atividades','pessoas','documentos','licencas','riscos','pendencias','day1','arquiteturas','historico','contratos','relModelos'];
  s=s||{};keys.forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
  s.meta=s.meta||{};if(!s.meta.metodo)s.meta.metodo='simples';
  if(!s.realizado||typeof s.realizado!=='object')s.realizado={};
  const stMap={'Planejado':'Em planejamento','Em andamento':'Em execução'};
  s.atividades.forEach(a=>{if(stMap[a.status])a.status=stMap[a.status];a.responsavelIds=a.responsavelIds||[];a.usinaIds=a.usinaIds||[];a.dependeDe=a.dependeDe||[];a.subs=a.subs||[];if(a.peso==null)a.peso=1;a.pct=clamp(+a.pct||0)});
  s.pessoas.forEach(p=>{p.frenteIds=p.frenteIds||[]});
  s.arquiteturas.forEach(a=>{a.nodes=a.nodes||[];a.links=a.links||[]});
  return migrateV2(s);
}

const LS_KEY='pme_state_v1', LS_USER='pme_user', LS_THEME='pme_theme';

async function pushRemote(){
  if(!dbRef||readOnly)return;
  const json=JSON.stringify(S);
  if(json.length>250000){setInd('err','Projeto grande demais para sincronizar');toast('O projeto passou do limite de sincronização. Exporte um backup e limpe o histórico em Configurações.','err');return}
  lastRev=S.meta.rev;
  try{await dbRef.set({state:json,rev:S.meta.rev,at:Date.now()});setInd('','Salvo e sincronizado')}
  catch(e){
    if(e&&e.code==='invalid_argument'){readOnly=true;$('#roBar').hidden=false;setInd('','Somente leitura')}
    else{setInd('err','Falha ao sincronizar');toast('Não foi possível sincronizar agora. As alterações ficaram salvas neste navegador.','err')}
  }
}
async function initRemote(){
  if(typeof SB!=='undefined'&&SB.on)return;
  if(!(window.claude&&typeof window.claude.use==='function'))return;
  let db=null;try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db)return;
  dbRef=db.doc('projeto/estado');
  try{
    const snap=await dbRef.get();
    if(snap.exists){const d=snap.data();if(d&&d.state){S=normalize(JSON.parse(d.state));lastRev=d.rev;saveLocal();render()}}
    setInd('','Sincronizado com a equipe');
  }catch(e){}
  try{
    dbRef.onSnapshot(snap=>{
      if(!snap.exists)return;const d=snap.data();if(!d||!d.state||d.rev===lastRev||d.rev===S.meta.rev)return;
      lastRev=d.rev;let ns;try{ns=normalize(JSON.parse(d.state))}catch(e){return}
      if(modalDepth>0){pendingRemote=ns;return}
      S=ns;saveLocal();render();toast('Projeto atualizado por outra pessoa da equipe.');
    },()=>{});
  }catch(e){}
  try{
    const u=await window.claude.use('user');
    if(u&&typeof u.can==='function'){const c=await Promise.resolve(u.can('data.write'));if(c===false){readOnly=true;$('#roBar').hidden=false;setInd('','Somente leitura')}}
  }catch(e){}
}

function blankFilt(){return {usina:'',frente:'',fase:'',resp:'',equipe:'',d1:'',status:'',prio:'',prazo:'',sit:'',q:''}}
const FILT=blankFilt();
function filterActs(list){
  const f=FILT,t=todayISO();
  return list.filter(a=>{
    if(f.usina&&!(a.usinaIds.length===0||a.usinaIds.includes(f.usina)))return false;
    if(f.frente){const fr=frenteOfAct(a);if(!fr||fr.id!==f.frente)return false}
    if(f.fase&&a.faseId!==f.fase)return false;
    if(f.resp&&!a.responsavelIds.includes(f.resp))return false;
    if(f.equipe&&!String(a.equipe||'').split('/').map(x=>x.trim()).includes(f.equipe))return false;
    if(f.d1&&a.relevancia!==f.d1)return false;
    if(f.status&&a.status!==f.status)return false;
    if(f.prio&&a.prioridade!==f.prio)return false;
    if(f.prazo){const d=a.fim?dayDiff(t,a.fim):999;if(f.prazo==='7'&&!(d>=0&&d<=7&&(+a.pct)<100))return false;if(f.prazo==='15'&&!(d>=0&&d<=15&&(+a.pct)<100))return false;if(f.prazo==='semana'&&!(d>=-1&&d<=6))return false}
    if(f.sit){const s=situacao(a,t);if(f.sit==='pendentes'){if(s==='concluida')return false}else if(f.sit==='andamento'){if(s!=='andamento'&&s!=='atencao')return false}else if(s!==f.sit)return false}
    if(f.q){const q=f.q.toLowerCase();if(!(a.nome.toLowerCase().includes(q)||String(a.codigo||'').toLowerCase().includes(q)||String(a.equipe||'').toLowerCase().includes(q)||respNomes(a).toLowerCase().includes(q)||(a.obs||'').toLowerCase().includes(q)))return false}
    return true;
  });
}

function optsOf(f){return typeof f.opts==='function'?f.opts():(f.opts||[])}
function dispVal(f,rec){
  const v=rec[f.k];
  if(f.t==='multi'){const m=new Map(optsOf(f).map(o=>[String(o.v),o.l]));return (v||[]).map(x=>m.get(String(x))).filter(Boolean).join(', ')}
  if(f.t==='select'&&typeof f.opts==='function'){const o=optsOf(f).find(o=>String(o.v)===String(v));return o?o.l:(v||'')}
  if(f.t==='date')return v?fmtD(v):'';
  if(f.t==='check')return v?'Sim':'Não';
  return v==null?'':String(v);
}
function fieldHTML(f,rec,selfId){
  const v=rec[f.k];const id='f_'+f.k;const req=f.req?' <span class="req">*</span>':'';const cls=f.full?' full':'';
  if(f.t==='select'){return `<label class="f${cls}"><span>${esc(f.l)}${req}</span><select id="${id}" name="${f.k}"><option value="">—</option>${optsOf(f).map(o=>`<option value="${esc(o.v)}"${String(o.v)===String(v??'')?' selected':''}>${esc(o.l)}</option>`).join('')}</select></label>`}
  if(f.t==='multi'){const opts=optsOf(f).filter(o=>!(f.self&&o.v===selfId));const sel=new Set((v||[]).map(String));
    return `<div class="f${cls}" style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)"><span>${esc(f.l)}</span><div class="multi" data-multi="${f.k}">${opts.length>8?'<input type="search" placeholder="Filtrar…" data-ms>':''}${opts.map(o=>`<label><input type="checkbox" value="${esc(o.v)}"${sel.has(String(o.v))?' checked':''}> ${esc(o.l)}</label>`).join('')||'<span class="muted">Nenhuma opção cadastrada</span>'}</div></div>`}
  if(f.t==='textarea')return `<label class="f${cls}"><span>${esc(f.l)}</span><textarea id="${id}" name="${f.k}">${esc(v||'')}</textarea></label>`;
  if(f.t==='pct'){const p=clamp(+v||0);return `<div class="f${cls}" style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)"><span>${esc(f.l)}</span><div class="pct-in"><input type="range" min="0" max="100" step="5" value="${p}" data-pr aria-label="Percentual"><input type="number" min="0" max="100" name="${f.k}" value="${p}" aria-label="Percentual em número"><span>%</span></div><div class="pct-quick">${[0,25,50,75,100].map(n=>`<button type="button" data-pq="${n}">${n}%</button>`).join('')}<span class="muted" style="font-weight:400;margin-left:6px">0 não iniciado · 25 iniciado · 50 parcial · 75 quase concluído · 100 concluído</span></div></div>`}
  if(f.t==='check')return `<label class="f${cls}" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" name="${f.k}"${v?' checked':''}> ${esc(f.l)}</label>`;
  if(f.t==='subs'){const subs=v||[];return `<div class="f${cls}" style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)"><span>${esc(f.l)}</span><div class="subs" data-subs>${subs.map(subRow).join('')}</div><div><button type="button" class="btn sm" data-addsub>${ICON.plus}Adicionar subatividade</button></div></div>`}
  const type={number:'number',date:'date',email:'email',tel:'tel',url:'text'}[f.t]||'text';
  return `<label class="f${cls}"><span>${esc(f.l)}${req}</span><input type="${type}" id="${id}" name="${f.k}" value="${esc(v??'')}"${f.t==='number'?' step="any"':''}${f.t==='url'?' placeholder="https://… ou caminho do arquivo"':''}></label>`;
}
function subRow(s){s=s||{id:uid('s'),nome:'',resp:'',feito:false};return `<div class="sr" data-sid="${esc(s.id)}"><input type="checkbox" ${s.feito?'checked':''} aria-label="Concluída"><input type="text" value="${esc(s.nome)}" placeholder="Subatividade" data-sn><input type="text" class="sresp" value="${esc(s.resp||'')}" placeholder="Responsável" data-sr><button type="button" class="icon-btn" data-delsub aria-label="Remover">${ICON.x}</button></div>`}
function readForm(bg,campos){
  const out={};
  campos.forEach(f=>{
    if(f.t==='multi'){out[f.k]=$$(`[data-multi="${f.k}"] input[type=checkbox]:checked`,bg).map(i=>i.value)}
    else if(f.t==='check'){const el=bg.querySelector(`[name="${f.k}"]`);out[f.k]=!!(el&&el.checked)}
    else if(f.t==='subs'){out[f.k]=$$('[data-subs] .sr',bg).map(r=>({id:r.dataset.sid,nome:$('[data-sn]',r).value.trim(),resp:$('[data-sr]',r).value.trim(),feito:$('input[type=checkbox]',r).checked})).filter(s=>s.nome)}
    else{const el=bg.querySelector(`[name="${f.k}"]`);let v=el?el.value:'';if(f.t==='number'||f.t==='pct')v=v===''?0:Number(v);if(f.t==='pct')v=clamp(v);
      if(f.t==='select'&&(f.k==='probabilidade'||f.k==='impacto'))v=Number(v)||3;out[f.k]=typeof v==='string'?v.trim():v}
  });
  return out;
}
function openForm(table,id,defaults,after){
  if(readOnly){toast('Modo somente leitura: alterações não são permitidas.','err');return}
  const sc=SCHEMAS[table];const list=S[table];const old=id?list.find(x=>x.id===id):null;
  const rec=old?JSON.parse(JSON.stringify(old)):{};
  if(!old){sc.campos.forEach(f=>{if(f.def!==undefined)rec[f.k]=typeof f.def==='function'?f.def():f.def;if(f.t==='multi'||f.t==='subs')rec[f.k]=rec[f.k]||[]});Object.assign(rec,defaults||{})}
  const body=`<form class="mbody" novalidate>${sc.campos.map(f=>fieldHTML(f,rec,id)).join('')}</form>`;
  const footer=`${old?`<button class="btn danger" data-del style="margin-right:auto">${ICON.del}Excluir</button>`:''}<button class="btn" data-cancel>Cancelar</button><button class="btn primary" data-save>${old?'Salvar alterações':'Cadastrar'}</button>`;
  openModal({title:(old?'Editar ':'Nova ')+sc.titulo.toLowerCase().replace(/^./,c=>c.toUpperCase()),body,footer,wide:table==='atividades',onMount:(bg,close)=>{
    const pr=$('[data-pr]',bg),pn=bg.querySelector('[name="pct"]');
    if(pr&&pn){pr.oninput=()=>pn.value=pr.value;pn.oninput=()=>pr.value=pn.value;$$('[data-pq]',bg).forEach(b=>b.onclick=()=>{pr.value=pn.value=b.dataset.pq})}
    $$('[data-ms]',bg).forEach(s=>s.oninput=()=>{const q=s.value.toLowerCase();$$('label',s.parentElement).forEach(l=>l.style.display=l.textContent.toLowerCase().includes(q)?'':'none')});
    const subs=$('[data-subs]',bg);
    if(subs){$('[data-addsub]',bg).onclick=()=>{subs.insertAdjacentHTML('beforeend',subRow());const r=subs.lastElementChild;$('[data-sn]',r).focus()};
      subs.addEventListener('click',e=>{const b=e.target.closest('[data-delsub]');if(b)b.closest('.sr').remove()})}
    $('[data-cancel]',bg).onclick=close;
    $('form',bg).onsubmit=e=>{e.preventDefault();$('[data-save]',bg).click()};
    $('[data-save]',bg).onclick=()=>{
      const val=readForm(bg,sc.campos);
      const miss=sc.campos.filter(f=>f.req&&!val[f.k]);
      if(miss.length){toast('Preencha: '+miss.map(f=>f.l).join(', '),'err');const el=bg.querySelector(`[name="${miss[0].k}"]`);if(el)el.focus();return}
      if(val.inicio&&val.fim&&val.fim<val.inicio){toast('A data final não pode ser anterior à data inicial.','err');return}
      saveRecord(table,old,val);close();if(after)after();commit();
    };
    if(old)$('[data-del]',bg).onclick=async()=>{if(await removeRecord(table,old.id)){close();commit()}};
  }});
}
function syncActivity(n,old){
  if(old&&old.status!==n.status&&(+old.pct||0)>=100&&n.status!=='Concluído'&&n.status!=='Cancelado'&&n.pct>=100){n.pct=(n.status==='Não iniciado'||n.status==='Em planejamento')?0:n.status==='Em validação'?95:90;n.concluidaEm=''}
  if(n.pct>=100&&n.status!=='Cancelado'){n.pct=100;if(n.status!=='Concluído')n.status='Concluído';if(!n.concluidaEm)n.concluidaEm=todayISO()}
  else{
    if(n.status==='Concluído'){if(old&&old.status!=='Concluído'){n.pct=100;if(!n.concluidaEm)n.concluidaEm=todayISO()}else n.status=n.pct>0?'Em execução':'Não iniciado'}
    if(n.pct>0&&(n.status==='Não iniciado'||n.status==='Em planejamento'))n.status='Em execução';
    if(n.pct<100)n.concluidaEm=n.status==='Concluído'?n.concluidaEm:'';
  }
  if(n.macroId&&!n.faseId){const m=macroById(n.macroId);if(m&&m.faseId)n.faseId=m.faseId}
}
function saveRecord(table,old,val){
  const sc=SCHEMAS[table];
  if(old){
    const before=JSON.parse(JSON.stringify(old));Object.assign(old,val);
    if(table==='atividades')syncActivity(old,before);
    const watch=table==='atividades'?['nome','pct','status','inicio','fim','responsavelIds','prioridade','macroId','peso','equipe','relevancia','semaforo','faseId']:sc.campos.map(f=>f.k).filter(k=>!['obs','descricao','subs'].includes(k));
    watch.forEach(k=>{const f=sc.campos.find(c=>c.k===k);if(!f)return;const a=JSON.stringify(before[k]),b=JSON.stringify(old[k]);if(a!==b){
      const fmt=r=>k==='pct'?r[k]+'%':dispVal(f,r)||'—';logChange(sc.ent,old[sc.nomeK],f.l.replace(/ \(.+\)$/,''),fmt(before),fmt(old))}});
    if(table==='atividades')bumpPessoasFrentes(old);
  }else{
    const rec={id:uid(table.slice(0,3)),...val};
    if(table==='atividades'){syncActivity(rec,null);rec.ordem=S.atividades.filter(a=>a.macroId===rec.macroId).length;bumpPessoasFrentes(rec)}
    if(['frentes','macros','fases','usinas','day1'].includes(table))rec.ordem=S[table].length;
    if(table==='day1')rec.feito=false;
    S[table].push(rec);logChange(sc.ent,rec[sc.nomeK],'Cadastro','','criado');
  }
}
function bumpPessoasFrentes(a){const fr=frenteOfAct(a);if(!fr)return;a.responsavelIds.forEach(pid=>{const p=pessoaById(pid);if(p&&!p.frenteIds.includes(fr.id))p.frenteIds.push(fr.id)})}
async function removeRecord(table,id){
  if(readOnly){toast('Modo somente leitura.','err');return false}
  const sc=SCHEMAS[table];const rec=S[table].find(x=>x.id===id);if(!rec)return false;
  let msg=`Excluir "${rec[sc.nomeK]}"?`;
  if(table==='frentes'){const ms=S.macros.filter(m=>m.frenteId===id);const n=S.atividades.filter(a=>ms.some(m=>m.id===a.macroId)).length;msg+=` Serão excluídas também ${ms.length} macroatividade(s) e ${n} atividade(s).`}
  if(table==='macros'){const n=S.atividades.filter(a=>a.macroId===id).length;if(n)msg+=` Serão excluídas também ${n} atividade(s).`}
  if(!await askConfirm(msg))return false;
  const delActs=ids=>{const set=new Set(ids);S.atividades=S.atividades.filter(a=>!set.has(a.id));S.atividades.forEach(a=>a.dependeDe=a.dependeDe.filter(d=>!set.has(d)))};
  if(table==='frentes'){const ms=S.macros.filter(m=>m.frenteId===id).map(m=>m.id);delActs(S.atividades.filter(a=>ms.includes(a.macroId)).map(a=>a.id));S.macros=S.macros.filter(m=>m.frenteId!==id);S.pessoas.forEach(p=>p.frenteIds=p.frenteIds.filter(f=>f!==id))}
  if(table==='macros')delActs(S.atividades.filter(a=>a.macroId===id).map(a=>a.id));
  if(table==='atividades')delActs([id]);
  if(table==='pessoas')S.atividades.forEach(a=>a.responsavelIds=a.responsavelIds.filter(p=>p!==id));
  if(table==='usinas')S.atividades.forEach(a=>a.usinaIds=a.usinaIds.filter(u=>u!==id));
  if(table==='fases')S.atividades.forEach(a=>{if(a.faseId===id)a.faseId=''});
  if(table!=='atividades')S[table]=S[table].filter(x=>x.id!==id);
  logChange(sc.ent,rec[sc.nomeK],'Exclusão','existente','excluído');
  toast('Excluído: '+rec[sc.nomeK]);
  return true;
}
function moveOrder(table,id,dir,groupKey){
  const rec=S[table].find(x=>x.id===id);if(!rec)return;
  const grp=S[table].filter(x=>!groupKey||x[groupKey]===rec[groupKey]).sort(byOrder);
  grp.forEach((x,i)=>x.ordem=i);const i=grp.indexOf(rec),j=i+dir;if(j<0||j>=grp.length)return;
  [grp[i].ordem,grp[j].ordem]=[grp[j].ordem,grp[i].ordem];commit();
}
/* Atualização rápida de atividade (tabela, kanban) */
function quickUpdate(id,patch){
  if(readOnly){toast('Modo somente leitura.','err');render();return}
  const a=actById(id);if(!a)return;const before=JSON.parse(JSON.stringify(a));Object.assign(a,patch);
  if((patch.status==='Não iniciado'||patch.status==='Em planejamento')&&before.status!==patch.status)a.pct=0;
  syncActivity(a,before);
  if(before.pct!==a.pct)logChange('Atividade',a.nome,'%',before.pct+'%',a.pct+'%');
  if(before.status!==a.status)logChange('Atividade',a.nome,'Status',before.status,a.status);
  commit();
}

function evoSeries(){
  const st=S.meta.inicio,en=S.meta.fim;if(!st||!en)return null;
  const t=todayISO();const n=dayDiff(st,en);const step=Math.max(1,Math.round(n/30));
  const labels=[],plan=[],real=[];
  const reals=Object.keys(S.realizado).sort();
  for(let i=0;i<=n;i+=step){const d=addDays(st,i);labels.push(fmtDs(d));plan.push(r1(plannedProjetoAt(d)));
    if(d<=t){let v=null;for(const rk of reals){if(rk<=d)v=S.realizado[rk];else break}if(d===t||addDays(d,step)>t)v=r1(projetoPct());real.push(v)}else real.push(null)}
  if(labels[labels.length-1]!==fmtDs(en)){labels.push(fmtDs(en));plan.push(r1(plannedProjetoAt(en)));real.push(en<=t?r1(projetoPct()):null)}
  return {labels,plan,real};
}

}

        <div class="ft" style="margin-top:6px"><select data-qs="${a.id}" aria-label="Mover para" style="padding:2px 4px;font-size:12px;width:auto">${STATUS.map(x=>`<option${x===a.status?' selected':''}>${x}</option>`).join('')}</select>${s==='atrasada'?'<span class="tag red">Atrasada</span>':''}</div></div>`}).join('')}</div>`}).join('')}</div>`;

      <td class="acts">${btnEdit('atividades',a.id)}${btnDel('atividades',a.id)}</td></tr>`}).join('')}</tbody></table>${acts.length?'':emptyBox('Nenhuma ação encontrada com esses filtros.')}</div></div>`;
  }else{
    const ids=new Set(acts.map(a=>a.id));const anyF=Object.values(FILT).some(Boolean);
    body=`<div class="panel tree">${frentesSorted().map(f=>{const ms=macrosOf(f.id);const fa=actsOfFrente(f.id).filter(a=>ids.has(a.id));if(anyF&&!fa.length)return '';
      const fp=frentePct(f);return `<div class="fr-row"><span class="grow">${esc(f.nome)} <span class="small muted" style="font-weight:400">· ${esc(pessoaNome(f.responsavelId)||'sem responsável')}</span></span>${pctBar(fp,pctColor(fp||0))}<button class="icon-btn" data-new="macros" data-def='${JSON.stringify({frenteId:f.id})}' title="Nova macroatividade" aria-label="Nova macroatividade">${ICON.plus}</button>${btnEdit('frentes',f.id)}</div>
      ${ms.map(m=>{const as=actsOfMacro(m.id).filter(a=>ids.has(a.id));if(anyF&&!as.length)return '';const mp=macroPct(m);return `<div class="mc-row"><span class="grow">${esc(m.nome)}${m.faseId&&faseById(m.faseId)?` <span class="tag" style="font-weight:500">${esc(faseById(m.faseId).nome.split(' — ')[0])}</span>`:''}</span>${pctBar(mp,pctColor(mp||0))}<button class="icon-btn" data-new="atividades" data-def='${JSON.stringify({macroId:m.id,faseId:m.faseId||''})}' title="Nova atividade" aria-label="Nova atividade">${ICON.plus}</button>${btnEdit('macros',m.id)}${btnDel('macros',m.id)}</div>

AFTER.atividades=c=>{

  $$('[data-card]',c).forEach(card=>{
    card.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',card.dataset.card);e.dataTransfer.effectAllowed='move'});
    card.addEventListener('dblclick',()=>openForm('atividades',card.dataset.card));
    card.addEventListener('keydown',e=>{if(e.key==='Enter')openForm('atividades',card.dataset.card)});

  });

  });
};

/* ---------------- Timeline / Gantt ---------------- */
let GZOOM='semana',GLEVEL='atividades';
const ZOOMS={dia:34,semana:13,'mês':4.6,trimestre:1.9};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function ganttSVG({acts,level,zoom,screen}){
  const P=pal(screen);const ppd=ZOOMS[zoom]||13;const LW=330,RH=26,HH=58;const t=todayISO();
  const ids=new Set(acts.map(a=>a.id));
  const rows=[];
  frentesSorted().forEach(f=>{const fa=actsOfFrente(f.id).filter(a=>ids.has(a.id));if(!fa.length)return;
    rows.push({k:'f',f,acts:fa,p:frentePct(f,realAcc,a=>ids.has(a.id))});
    macrosOf(f.id).forEach(m=>{const ma=actsOfMacro(m.id).filter(a=>ids.has(a.id));if(!ma.length)return;rows.push({k:'m',m,acts:ma,p:macroPct(m,realAcc,a=>ids.has(a.id))});
      if(level==='atividades')ma.slice().sort((a,b)=>(a.inicio||'').localeCompare(b.inicio||'')).forEach(a=>rows.push({k:'a',a}))})});
  const dates=acts.flatMap(a=>[a.inicio,a.fim]).filter(Boolean).concat([S.meta.inicio,S.meta.fim,S.meta.day1].filter(Boolean)).concat((S.marcos||[]).map(m=>m.data).filter(Boolean)).sort();
  if(!rows.length||!dates.length)return {svg:`<div class="empty">Nenhuma atividade com datas para exibir.</div>`,w:0,h:0};
  const start=addDays(dates[0],-3),end=addDays(dates[dates.length-1],4);const nd=dayDiff(start,end)+1;
  const W=LW+nd*ppd+20,H=HH+rows.length*RH+10;const X=iso=>LW+dayDiff(start,iso)*ppd;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Barlow, Arial, sans-serif"><rect width="${W}" height="${H}" fill="${P.surface}"/>`;
  // fins de semana e grade
  for(let i=0;i<nd;i++){const d=addDays(start,i);const wd=parseD(d).getDay();
    if((wd===0||wd===6)&&ppd>=8)s+=`<rect x="${LW+i*ppd}" y="${HH}" width="${ppd}" height="${H-HH}" fill="${P.soft}" opacity=".6"/>`;
    const dd=parseD(d).getDate();
    if(dd===1)s+=`<line x1="${LW+i*ppd}" y1="18" x2="${LW+i*ppd}" y2="${H}" stroke="${P.line}"/>`;
    else if(wd===1&&ppd>=4)s+=`<line x1="${LW+i*ppd}" y1="${HH}" x2="${LW+i*ppd}" y2="${H}" stroke="${P.line}" stroke-dasharray="2 3" opacity=".7"/>`;
  }
  // fases
  S.fases.slice().sort(byOrder).forEach((f,i)=>{if(!f.inicio||!f.fim)return;const x1=X(f.inicio),x2=X(f.fim)+ppd;const col=i%2?'#123D66':'#1F6FB5';
    s+=`<rect x="${x1}" y="1" width="${Math.max(2,x2-x1)}" height="16" rx="3" fill="${col}" opacity=".9"/><text x="${x1+5}" y="13" font-size="10.5" fill="#fff">${esc(trunc(f.nome.replace(/^Fase (\d+) — /,'F$1 · '),Math.floor((x2-x1)/5.6)))}</text>`});
  // meses
  let cur=start;while(cur<=end){const d=parseD(cur);const mEnd=isoOf(new Date(d.getFullYear(),d.getMonth()+1,0));const e=mEnd<end?mEnd:end;const x1=X(cur),x2=X(e)+ppd;
    s+=`<text x="${x1+4}" y="33" font-size="12" font-weight="600" fill="${P.ink}">${MESES[d.getMonth()]}/${d.getFullYear()}</text>`;cur=addDays(mEnd,1)}
  // dias / semanas
  for(let i=0;i<nd;i++){const d=addDays(start,i);const dt=parseD(d);
    if(zoom==='dia')s+=`<text x="${LW+i*ppd+ppd/2}" y="50" font-size="10.5" text-anchor="middle" fill="${P.muted}">${dt.getDate()}</text>`;
    else if(zoom==='semana'&&dt.getDay()===1)s+=`<text x="${LW+i*ppd+2}" y="50" font-size="10.5" fill="${P.muted}">${fmtDs(d)}</text>`;
    else if(zoom==='mês'&&(dt.getDate()===1||dt.getDate()===15))s+=`<text x="${LW+i*ppd+2}" y="50" font-size="10" fill="${P.muted}">${dt.getDate()}</text>`;
  }
  s+=`<line x1="0" y1="${HH-1}" x2="${W}" y2="${HH-1}" stroke="${P.line}"/>`;
  let lab=`<rect x="0" y="0" width="${LW}" height="${H}" fill="${P.surface}"/><text x="10" y="33" font-size="12" font-weight="600" fill="${P.muted}">Frente / macroatividade / atividade</text><text x="${LW-10}" y="33" font-size="12" font-weight="600" fill="${P.muted}" text-anchor="end">%</text><line x1="0" y1="${HH-1}" x2="${LW}" y2="${HH-1}" stroke="${P.line}"/>`;
  rows.forEach((r,i)=>{const y=HH+i*RH;
    if(r.k==='f'){s+=`<rect x="0" y="${y}" width="${W}" height="${RH}" fill="${P.surface2}"/>`;lab+=`<rect x="0" y="${y}" width="${LW}" height="${RH}" fill="${P.surface2}"/>`}
    lab+=`<line x1="0" y1="${y+RH}" x2="${LW}" y2="${y+RH}" stroke="${P.line}" opacity=".6"/>`;
    s+=`<line x1="0" y1="${y+RH}" x2="${W}" y2="${y+RH}" stroke="${P.line}" opacity=".6"/>`;
    let label,pct,ini,fim,color,ind,bold;
    if(r.k==='f'){label=r.f.nome;pct=r.p;ind=8;bold=700;color=P.navy}
    else if(r.k==='m'){label=r.m.nome;pct=r.p;ind=22;bold=600;color='#4A7FB5'}
    else{const a=r.a;label=(a.codigo?a.codigo+' ':'')+a.nome;pct=a.pct;ind=38;bold=400;color=SIT[situacao(a,t)].hex}
    if(r.k!=='a'){const ds=r.acts.flatMap(a=>[a.inicio,a.fim]).filter(Boolean).sort();ini=ds[0];fim=ds[ds.length-1]}else{ini=r.a.inicio;fim=r.a.fim}
    const resp=r.k==='a'?(respNomes(r.a).split(',')[0]||''):'';
    const maxCh=Math.floor((LW-ind-60)/(bold>=600?6.6:6.1));
    lab+=`<text x="${ind}" y="${y+17}" font-size="${r.k==='f'?13:12.5}" font-weight="${bold}" fill="${P.ink}">${esc(trunc(label,maxCh))}</text><text x="${LW-10}" y="${y+17}" font-size="12" text-anchor="end" fill="${P.muted}" font-weight="600">${pct==null?'—':r0(pct)+'%'}</text>`;
    if(ini&&fim){const x1=X(ini),x2=X(fim)+ppd,bw=Math.max(3,x2-x1),bh=r.k==='a'?14:r.k==='m'?12:10,by=y+(RH-bh)/2;
      const hit=r.k==='a'?` class="bar-hit" data-act="${r.a.id}"`:'';
      s+=`<g${hit}><title>${esc(label)} — ${fmtD(ini)} a ${fmtD(fim)} — ${pct==null?0:r0(pct)}%${resp?' — '+esc(resp):''}</title><rect x="${x1}" y="${by}" width="${bw}" height="${bh}" rx="3" fill="${color}" opacity=".22"/><rect x="${x1}" y="${by}" width="${bw*clamp(pct||0)/100}" height="${bh}" rx="3" fill="${color}"/>`;
      if(r.k==='a'){const lbl=resp?`${pct}% · ${resp}`:`${pct}%`;s+=`<text x="${x2+5}" y="${y+17}" font-size="11" fill="${P.muted}">${esc(lbl)}</text>`}
      s+=`</g>`}
  });
  (S.marcos||[]).forEach(m=>{if(!m.data||m.data<start||m.data>end)return;const x=X(m.data)+ppd/2;const d1=S.meta.day1&&m.data===S.meta.day1;const col=d1?'#22A06B':'#7A5AF8';
    s+=`<g><title>${esc(m.nome)} — ${fmtD(m.data)}${m.status?' — '+esc(m.status):''}</title><line x1="${x}" y1="${HH}" x2="${x}" y2="${H}" stroke="${col}" stroke-width="${d1?2:1}" stroke-dasharray="${d1?'':'2 4'}" opacity=".8"/><path d="M${x} ${HH-12}l6 6-6 6-6-6z" fill="${col}"/></g>`});
  if(t>=start&&t<=end){const x=X(t)+ppd/2;s+=`<line x1="${x}" y1="18" x2="${x}" y2="${H}" stroke="#D64545" stroke-width="1.6" stroke-dasharray="4 3"/><text x="${x+4}" y="${HH-4}" font-size="10.5" fill="#D64545" font-weight="600">hoje</text>`}
  s+=`<g class="glab">${lab}<line x1="${LW}" y1="0" x2="${LW}" y2="${H}" stroke="${P.line}"/></g></svg>`;return {svg:s,w:W,h:H};
}
function trunc(s,n){s=String(s||'');n=Math.max(4,n|0);return s.length>n?s.slice(0,n-1)+'…':s}
function bindGanttClicks(root){
  const gl=$('.glab',root);if(gl)root.addEventListener('scroll',()=>gl.setAttribute('transform',`translate(${root.scrollLeft},0)`))}
VIEWS.timeline=()=>{
  const z=Object.keys(ZOOMS).map(k=>`<button class="btn sm" data-zoom="${k}" aria-pressed="${GZOOM===k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
  return `${filtersBar()}<div class="row" style="margin-bottom:12px"><span class="lbl muted small" style="font-weight:600">Zoom</span>${z}<span style="width:12px"></span>
    <button class="btn sm" data-lvl="atividades" aria-pressed="${GLEVEL==='atividades'}">Atividades</button><button class="btn sm" data-lvl="macros" aria-pressed="${GLEVEL==='macros'}">Só macroatividades</button>
    <div class="spacer"></div><div class="legend">${['concluida','andamento','atencao','atrasada','nao'].map(k=>`<span><span class="dot" style="background:${SIT[k].c}"></span>${SIT[k].l}</span>`).join('')}<span><span class="dot" style="background:#7A5AF8;border-radius:2px;transform:rotate(45deg)"></span>Marco / gate</span><span><span class="dot" style="background:#22A06B;border-radius:2px;transform:rotate(45deg)"></span>Day 1</span></div></div>
    <div class="gantt-wrap" id="gantt"></div>
    <div class="row mt"><span class="muted small">Clique em uma barra para editar a atividade. Alterações de data, inclusões e exclusões atualizam a timeline na hora.</span><div class="spacer"></div>
    <button class="btn sm" data-exp="gantt-png">${ICON.img}PNG</button><button class="btn sm" data-exp="gantt-svg">${ICON.dl}SVG</button><button class="btn sm" data-exp="gantt-pdf">${ICON.dl}PDF</button><button class="btn sm primary" data-new="atividades">${ICON.plus}Nova atividade</button></div>`;
};
AFTER.timeline=c=>{
  $$('[data-zoom]',c).forEach(b=>b.onclick=()=>{GZOOM=b.dataset.zoom;render()});
  $$('[data-lvl]',c).forEach(b=>b.onclick=()=>{GLEVEL=b.dataset.lvl;render()});
  const g=$('#gantt',c);const r=ganttSVG({acts:filterActs(S.atividades),level:GLEVEL,zoom:GZOOM,screen:true});g.innerHTML=r.svg;bindGanttClicks(g);
  const tx=$('svg line[stroke="#D64545"]',g);if(tx){const x=+tx.getAttribute('x1');g.scrollLeft=Math.max(0,x-g.clientWidth/2)}
};

  ${fs.map((f,i)=>{const p=frentePct(f);const n=actsOfFrente(f.id).length;const lim=actsOfFrente(f.id).map(a=>a.fim).filter(Boolean).sort().pop();
    return `<tr style="background:var(--surface-2)"><td style="white-space:nowrap"><button class="icon-btn" data-mv="frentes" data-id="${f.id}" data-dir="-1" aria-label="Subir"${i===0?' disabled':''}>${ICON.up}</button><button class="icon-btn" data-mv="frentes" data-id="${f.id}" data-dir="1" aria-label="Descer"${i===fs.length-1?' disabled':''}>${ICON.down}</button></td>
    <td><b>${esc(f.nome)}</b></td><td class="small">${esc(pessoaNome(f.responsavelId)||'—')}</td><td>${prioTag(f.prioridade)}</td><td class="small">${f.prazo?fmtD(f.prazo):lim?'<span class="muted">'+fmtD(lim)+'</span>':'—'}</td><td class="num">${f.peso}</td><td class="num"><a href="#" data-gofr="${f.id}">${n}</a></td><td>${pctBar(p,pctColor(p||0))}</td>
    <td class="acts"><button class="btn sm ghost" data-new="macros" data-def='${JSON.stringify({frenteId:f.id})}'>${ICON.plus}Macro</button>${btnEdit('frentes',f.id)}${btnDel('frentes',f.id)}</td></tr>
    ${macrosOf(f.id).map((m,j,arr)=>{const mp=macroPct(m);return `<tr><td style="white-space:nowrap;padding-left:22px"><button class="icon-btn" data-mv="macros" data-id="${m.id}" data-dir="-1" data-grp="frenteId" aria-label="Subir"${j===0?' disabled':''}>${ICON.up}</button><button class="icon-btn" data-mv="macros" data-id="${m.id}" data-dir="1" data-grp="frenteId" aria-label="Descer"${j===arr.length-1?' disabled':''}>${ICON.down}</button></td>
      <td style="padding-left:26px">${esc(m.nome)} ${m.faseId&&faseById(m.faseId)?`<span class="tag">${esc(faseById(m.faseId).nome.split(' — ')[0])}</span>`:''}</td><td></td><td></td><td></td><td class="num">${m.peso}</td><td class="num">${actsOfMacro(m.id).length}</td><td>${pctBar(mp,pctColor(mp||0))}</td>
      <td class="acts"><button class="btn sm ghost" data-new="atividades" data-def='${JSON.stringify({macroId:m.id,faseId:m.faseId||''})}'>${ICON.plus}Atividade</button>${btnEdit('macros',m.id)}${btnDel('macros',m.id)}</td></tr>`}).join('')}`}).join('')}
  </tbody></table>${fs.length?'':emptyBox('Nenhuma frente cadastrada.')}</div></div>`;

AFTER.frentes=c=>{$$('[data-gofr]',c).forEach(a=>a.onclick=e=>{e.preventDefault();go('atividades',{filtro:{frente:a.dataset.gofr}})})};

/* ---------------- Pessoas ---------------- */
VIEWS.pessoas=()=>{

  ${ps.map(p=>{const as=S.atividades.filter(a=>a.responsavelIds.includes(p.id));const m=as.length?as.reduce((s,a)=>s+(+a.pct),0)/as.length:null;const at=as.filter(a=>situacao(a)==='atrasada').length;

AFTER.pessoas=c=>{$$('[data-gop]',c).forEach(a=>a.onclick=e=>{e.preventDefault();ACTMODE='tabela';go('atividades',{filtro:{resp:a.dataset.gop}})})};

/* ---------------- Arquitetura ---------------- */
const NW=176,NH=58;
const ARCH={id:null,sel:null,connecting:false,from:null};
function curArch(){let a=S.arquiteturas.find(x=>x.id===ARCH.id);if(!a){a=S.arquiteturas[0];ARCH.id=a?a.id:null}return a}
function edgePoint(n,tx,ty){const cx=n.x+NW/2,cy=n.y+NH/2;const dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return [cx,cy];const sx=Math.abs(dx)/(NW/2+6),sy=Math.abs(dy)/(NH/2+6);const k=1/Math.max(sx,sy);return [cx+dx*k,cy+dy*k]}
function archBounds(a){if(!a.nodes.length)return {w:1200,h:600};const mx=Math.max(...a.nodes.map(n=>n.x+NW))+60,my=Math.max(...a.nodes.map(n=>n.y+NH))+60;return {w:Math.max(1200,mx),h:Math.max(520,my)}}
function archSVG(a,{screen,editor}={}){
  const P=pal(screen);const b=archBounds(a);const nodes=new Map(a.nodes.map(n=>[n.id,n]));
  let s=`<svg xmlns="http://www.w3.org/2000/svg" ${editor?'id="archSvg" ':''}viewBox="0 0 ${b.w} ${b.h}" width="${editor||screen?'100%':b.w}" ${editor||screen?'':`height="${b.h}"`} font-family="Barlow, Arial, sans-serif" role="img" aria-label="Arquitetura ${esc(a.nome)}">
  <defs>${Object.entries(LINK_STATUS).map(([k,c])=>`<marker id="ar_${k.replace(/\s/g,'')}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')}
  <pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="${P.line}"/></pattern></defs>
  <rect width="${b.w}" height="${b.h}" fill="${P.surface}"/>${editor?`<rect width="${b.w}" height="${b.h}" fill="url(#gridp)"/>`:''}`;
  if(!editor&&!screen)s+=`<text x="24" y="34" font-size="20" font-weight="700" fill="${P.ink}">${esc(a.nome)}</text><text x="24" y="54" font-size="13" fill="${P.muted}">${esc(a.descricao||'')}</text>`;
  a.links.forEach(l=>{const A=nodes.get(l.from),B=nodes.get(l.to);if(!A||!B)return;
    const [x1,y1]=edgePoint(A,B.x+NW/2,B.y+NH/2),[x2,y2]=edgePoint(B,A.x+NW/2,A.y+NH/2);const col=LINK_STATUS[l.status]||P.grey;const sel=editor&&ARCH.sel&&ARCH.sel.kind==='link'&&ARCH.sel.id===l.id;
    const mx=(x1+x2)/2,my=(y1+y2)/2;const txt=l.protocolo+(l.porta?':'+l.porta:'');const tw=txt.length*6.6+14;
    s+=`<g${editor?` class="link-hit" data-link="${l.id}"`:''}>${editor?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="16"/>`:''}
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sel?4:2.2}" ${l.status==='Planejado'?'stroke-dasharray="7 5"':''} marker-end="url(#ar_${(l.status||'Planejado').replace(/\s/g,'')})"/>
      <rect x="${mx-tw/2}" y="${my-11}" width="${tw}" height="20" rx="10" fill="${P.surface}" stroke="${col}" stroke-width="${sel?2:1}"/><text x="${mx}" y="${my+4}" font-size="11.5" font-weight="600" text-anchor="middle" fill="${P.ink}">${esc(txt)}</text>
      ${l.vlan&&!editor?'':''}</g>`});
  a.nodes.forEach(n=>{const T=NODE_TYPES[n.tipo]||NODE_TYPES.Outro;const sel=editor&&ARCH.sel&&ARCH.sel.kind==='node'&&ARCH.sel.id===n.id;const from=editor&&ARCH.from===n.id;
    s+=`<g class="node" data-node="${n.id}" transform="translate(${n.x},${n.y})"><rect width="${NW}" height="${NH}" rx="8" fill="${P.surface}" stroke="${sel||from?P.blue:T.c}" stroke-width="${sel||from?3:1.5}"/>
      <rect width="7" height="${NH}" rx="3" fill="${T.c}"/>${nodeGlyph(n.tipo,T.c)}
      <text x="40" y="22" font-size="11" font-weight="600" fill="${T.c}">${esc(T.l)}${n.ip?' · '+esc(n.ip):''}</text>
      <text x="40" y="41" font-size="13.5" font-weight="700" fill="${P.ink}">${esc(trunc(n.label,18))}</text><title>${esc(n.label)}${n.obs?' — '+esc(n.obs):''}</title></g>`});
  s+='</svg>';return s;
}
function nodeGlyph(t,c){const g={UFV:'<rect x="15" y="20" width="18" height="12" fill="none" stroke="C" stroke-width="1.6"/><path d="M15 26h18M21 20v12M27 20v12" stroke="C" stroke-width="1.2"/>',
  Firewall:'<rect x="15" y="19" width="18" height="15" fill="none" stroke="C" stroke-width="1.6"/><path d="M15 24h18M15 29h18M21 19v5M27 24v5M21 29v5" stroke="C" stroke-width="1.2"/>',
  Nuvem:'<path d="M18 33h13a4 4 0 0 0 0-8 6 6 0 0 0-11-1 4 4 0 0 0-2 9z" fill="none" stroke="C" stroke-width="1.6"/>',
  SCADA:'<rect x="14" y="19" width="20" height="13" rx="1.5" fill="none" stroke="C" stroke-width="1.6"/><path d="M17 29l4-4 3 2 6-5M21 36h6" stroke="C" stroke-width="1.4" fill="none"/>',
  Datacenter:'<rect x="16" y="18" width="16" height="18" rx="1.5" fill="none" stroke="C" stroke-width="1.6"/><path d="M16 24h16M16 30h16" stroke="C" stroke-width="1.2"/>',
  Rede:'<circle cx="24" cy="27" r="8" fill="none" stroke="C" stroke-width="1.6"/><path d="M16 27h16M24 19c-4 5-4 11 0 16M24 19c4 5 4 11 0 16" stroke="C" stroke-width="1.1" fill="none"/>'}[t]||'<rect x="16" y="20" width="16" height="14" rx="2" fill="none" stroke="C" stroke-width="1.6"/><circle cx="20" cy="27" r="1.5" fill="C"/><circle cx="28" cy="27" r="1.5" fill="C"/>';
  return g.replace(/C/g,c)}
VIEWS.arquitetura=()=>{
  const a=curArch();
  const tabs=S.arquiteturas.map(x=>`<button class="btn sm" data-arch="${x.id}" aria-pressed="${a&&x.id===a.id}">${esc(x.nome)}</button>`).join('');
  if(!a)return `<div class="row" style="margin-bottom:12px"><div class="spacer"></div><button class="btn primary" data-newarch>${ICON.plus}Nova arquitetura</button></div>${emptyBox('Nenhuma arquitetura cadastrada.')}`;
  return `<div class="row" style="margin-bottom:12px"><div class="arch-tabs">${tabs}</div><button class="btn sm ghost" data-newarch>${ICON.plus}Nova arquitetura</button><div class="spacer"></div>
    <button class="btn sm" data-exp="arch-png">${ICON.img}PNG</button><button class="btn sm" data-exp="arch-svg">${ICON.dl}SVG</button><button class="btn sm" data-exp="arch-pdf">${ICON.dl}PDF</button></div>
  <div class="row" style="margin-bottom:12px"><select id="newType" style="width:auto" aria-label="Tipo de elemento">${Object.keys(NODE_TYPES).map(k=>`<option>${k}</option>`).join('')}</select><button class="btn sm primary" data-addnode>${ICON.plus}Adicionar elemento</button>
    <button class="btn sm" data-connect aria-pressed="${ARCH.connecting}">${ICON.link}${ARCH.connecting?(ARCH.from?'Clique no destino…':'Clique na origem…'):'Conectar elementos'}</button>
    <div class="legend" style="margin-left:8px">${Object.entries(LINK_STATUS).map(([k,c])=>`<span><span class="dot" style="background:${c}"></span>${k}</span>`).join('')}</div></div>
  <div class="arch-layout"><div class="arch-canvas${ARCH.connecting?' connecting':''}" id="archCanvas">${archSVG(a,{screen:true,editor:true})}<div class="arch-help">Arraste os elementos · clique para editar · Delete remove o selecionado</div></div>
    <section class="panel" id="archPanel">${archPanel(a)}</section></div>`;
};
function archPanel(a){
  const sel=ARCH.sel;
  if(sel&&sel.kind==='node'){const n=a.nodes.find(x=>x.id===sel.id);if(n)return `<header><h3>Elemento</h3><div class="spacer"></div><button class="icon-btn" data-desel aria-label="Fechar">${ICON.x}</button></header><div class="body grid" style="gap:10px">
    <label class="f"><span>Tipo</span><select data-np="tipo">${Object.keys(NODE_TYPES).map(k=>`<option${k===n.tipo?' selected':''}>${k}</option>`).join('')}</select></label>
    <label class="f"><span>Nome</span><input type="text" data-np="label" value="${esc(n.label)}"></label><label class="f"><span>IP</span><input type="text" data-np="ip" value="${esc(n.ip||'')}"></label>
    <label class="f"><span>Observações</span><textarea data-np="obs">${esc(n.obs||'')}</textarea></label>
    <div class="small muted">${a.links.filter(l=>l.from===n.id||l.to===n.id).length} conexão(ões)</div><div><button class="btn danger sm" data-delsel>${ICON.del}Excluir elemento</button></div></div>`}
  if(sel&&sel.kind==='link'){const l=a.links.find(x=>x.id===sel.id);if(l){const nm=id=>(a.nodes.find(n=>n.id===id)||{}).label||'?';return `<header><h3>Conexão</h3><div class="spacer"></div><button class="icon-btn" data-desel aria-label="Fechar">${ICON.x}</button></header><div class="body grid" style="gap:10px">
    <div class="small"><b>${esc(nm(l.from))}</b> → <b>${esc(nm(l.to))}</b> <button class="btn sm ghost" data-swap>Inverter</button></div>
    <label class="f"><span>Protocolo</span><select data-lp="protocolo">${PROTOCOLOS.map(p=>`<option${p===l.protocolo?' selected':''}>${p}</option>`).join('')}</select></label>
    <div class="grid g2" style="gap:10px"><label class="f"><span>IP</span><input type="text" data-lp="ip" value="${esc(l.ip||'')}"></label><label class="f"><span>Porta</span><input type="text" data-lp="porta" value="${esc(l.porta||'')}"></label>
    <label class="f"><span>VLAN</span><input type="text" data-lp="vlan" value="${esc(l.vlan||'')}"></label><label class="f"><span>Meio físico</span><input type="text" data-lp="meio" value="${esc(l.meio||'')}" placeholder="Fibra, rádio, VPN…"></label></div>
    <label class="f"><span>Status</span><select data-lp="status">${Object.keys(LINK_STATUS).map(p=>`<option${p===l.status?' selected':''}>${p}</option>`).join('')}</select></label>
    <label class="f"><span>Observações</span><textarea data-lp="obs">${esc(l.obs||'')}</textarea></label><div><button class="btn danger sm" data-delsel>${ICON.del}Excluir conexão</button></div></div>`}}
  return `<header><h3>Arquitetura</h3></header><div class="body grid" style="gap:10px">
    <label class="f"><span>Nome</span><input type="text" data-ap="nome" value="${esc(a.nome)}"></label><label class="f"><span>Descrição</span><textarea data-ap="descricao">${esc(a.descricao||'')}</textarea></label>
    <div class="small muted">${a.nodes.length} elementos · ${a.links.length} conexões</div>
    ${a.links.length?`<div class="tw"><table class="t" style="font-size:12.5px"><thead><tr><th>Conexão</th><th>Protocolo</th><th>Status</th></tr></thead><tbody>${a.links.map(l=>{const nm=id=>(a.nodes.find(n=>n.id===id)||{}).label||'?';return `<tr data-link-row="${l.id}" style="cursor:pointer"><td>${esc(trunc(nm(l.from),14))} → ${esc(trunc(nm(l.to),14))}</td><td>${esc(l.protocolo)}${l.porta?':'+esc(l.porta):''}</td><td><span class="dot" style="background:${LINK_STATUS[l.status]||'#999'}"></span>${esc(l.status)}</td></tr>`}).join('')}</tbody></table></div>`:''}
    <div class="row"><button class="btn sm" data-duparch>Duplicar</button><button class="btn sm danger" data-delarch>${ICON.del}Excluir arquitetura</button></div></div>`;
}
let archSaveT=null;
function archTouch(){clearTimeout(archSaveT);archSaveT=setTimeout(()=>persist(),500)}
function redrawArch(){const c=$('#archCanvas');if(!c)return;const a=curArch();const svg=$('#archSvg',c);const tmp=document.createElement('div');tmp.innerHTML=archSVG(a,{screen:true,editor:true});svg.innerHTML=tmp.firstElementChild.innerHTML;svg.setAttribute('viewBox',tmp.firstElementChild.getAttribute('viewBox'))}
function redrawPanel(){const p=$('#archPanel');if(p){p.innerHTML=archPanel(curArch());bindArchPanel(p)}}
function bindArchPanel(p){
  const a=curArch();
  const dsl=$('[data-desel]',p);if(dsl)dsl.onclick=()=>{ARCH.sel=null;redrawArch();redrawPanel()};
  $$('[data-np]',p).forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{if(readOnly)return;const n=a.nodes.find(x=>x.id===ARCH.sel.id);if(!n)return;n[el.dataset.np]=el.value;redrawArch();archTouch()}));
  $$('[data-lp]',p).forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{if(readOnly)return;const l=a.links.find(x=>x.id===ARCH.sel.id);if(!l)return;l[el.dataset.lp]=el.value;redrawArch();archTouch()}));
  $$('[data-ap]',p).forEach(el=>el.addEventListener('input',()=>{if(readOnly)return;a[el.dataset.ap]=el.value;archTouch();if(el.dataset.ap==='nome'){const t=$(`[data-arch="${a.id}"]`);if(t)t.textContent=el.value}}));
  const sw=$('[data-swap]',p);if(sw)sw.onclick=()=>{const l=a.links.find(x=>x.id===ARCH.sel.id);[l.from,l.to]=[l.to,l.from];redrawArch();redrawPanel();archTouch()};
  const ds=$('[data-delsel]',p);if(ds)ds.onclick=()=>archDeleteSel();
  $$('[data-link-row]',p).forEach(r=>r.onclick=()=>{ARCH.sel={kind:'link',id:r.dataset.linkRow};redrawArch();redrawPanel()});
  const du=$('[data-duparch]',p);if(du)du.onclick=()=>{const c=JSON.parse(JSON.stringify(a));c.id=uid('arq');c.nome=a.nome+' (cópia)';const map={};c.nodes.forEach(n=>{const o=n.id;n.id=uid('n');map[o]=n.id});c.links.forEach(l=>{l.id=uid('l');l.from=map[l.from];l.to=map[l.to]});S.arquiteturas.push(c);ARCH.id=c.id;ARCH.sel=null;logChange('Arquitetura',c.nome,'Cadastro','','criado');commit()};
  const da=$('[data-delarch]',p);if(da)da.onclick=async()=>{if(await askConfirm(`Excluir a arquitetura "${a.nome}"?`)){S.arquiteturas=S.arquiteturas.filter(x=>x.id!==a.id);ARCH.id=null;ARCH.sel=null;logChange('Arquitetura',a.nome,'Exclusão','','excluído');commit()}};
}
function archDeleteSel(){if(readOnly)return;const a=curArch();const s=ARCH.sel;if(!s)return;
  if(s.kind==='node'){const n=a.nodes.find(x=>x.id===s.id);a.nodes=a.nodes.filter(x=>x.id!==s.id);a.links=a.links.filter(l=>l.from!==s.id&&l.to!==s.id);logChange('Arquitetura',a.nome,'Elemento removido',n?n.label:'','')}
  else a.links=a.links.filter(l=>l.id!==s.id);
  ARCH.sel=null;persist();redrawArch();redrawPanel()}
AFTER.arquitetura=c=>{
  $$('[data-arch]',c).forEach(b=>b.onclick=()=>{ARCH.id=b.dataset.arch;ARCH.sel=null;ARCH.from=null;render()});
  $$('[data-newarch]',c).forEach(b=>b.onclick=()=>{if(readOnly)return;const a={id:uid('arq'),nome:'Nova arquitetura',descricao:'',nodes:[],links:[]};S.arquiteturas.push(a);ARCH.id=a.id;ARCH.sel=null;logChange('Arquitetura',a.nome,'Cadastro','','criado');commit()});
  const a=curArch();if(!a)return;
  bindArchPanel($('#archPanel',c));
  const add=$('[data-addnode]',c);if(add)add.onclick=()=>{if(readOnly)return;const t=$('#newType',c).value;const n={id:uid('n'),tipo:t,label:'Novo '+NODE_TYPES[t].l,ip:'',x:40+(a.nodes.length*30)%600,y:40+(a.nodes.length*24)%300,obs:''};a.nodes.push(n);ARCH.sel={kind:'node',id:n.id};persist();redrawArch();redrawPanel();const i=$('[data-np="label"]');if(i){i.focus();i.select()}};
  const cb=$('[data-connect]',c);if(cb)cb.onclick=()=>{ARCH.connecting=!ARCH.connecting;ARCH.from=null;render()};
  const svg=$('#archSvg',c);let drag=null;
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
  svg.addEventListener('pointerdown',e=>{
    const ng=e.target.closest('[data-node]'),lg=e.target.closest('[data-link]');
    if(ng){const id=ng.dataset.node;
      if(ARCH.connecting){if(!ARCH.from){ARCH.from=id;redrawArch();$('[data-connect]').innerHTML=ICON.link+'Clique no destino…'}
        else if(ARCH.from!==id){if(!readOnly){const l={id:uid('l'),from:ARCH.from,to:id,protocolo:'TCP/IP',ip:'',porta:'',vlan:'',meio:'',status:'Planejado',obs:''};a.links.push(l);ARCH.sel={kind:'link',id:l.id};persist()}ARCH.from=null;ARCH.connecting=false;render()}
        return}
      const n=a.nodes.find(x=>x.id===id);const p=pt(e);drag={n,dx:p.x-n.x,dy:p.y-n.y,moved:false};svg.setPointerCapture(e.pointerId);
      if(!(ARCH.sel&&ARCH.sel.id===id)){ARCH.sel={kind:'node',id};redrawArch();redrawPanel()}return}
    if(lg){ARCH.sel={kind:'link',id:lg.dataset.link};redrawArch();redrawPanel();return}
    if(ARCH.sel){ARCH.sel=null;redrawArch();redrawPanel()}
  });
  svg.addEventListener('pointermove',e=>{if(!drag||readOnly)return;const p=pt(e);drag.n.x=Math.max(0,Math.round((p.x-drag.dx)/10)*10);drag.n.y=Math.max(0,Math.round((p.y-drag.dy)/10)*10);drag.moved=true;redrawArch()});
  const end=()=>{if(drag&&drag.moved)archTouch();drag=null};

/* ---------------- Análise e status (somente dados cadastrados) ---------------- */
function analise(){
  const t=todayISO(),k=kpis();const pos=[],att=[],rsk=[],act=[];
  frentesSorted().forEach(f=>{const p=frentePct(f);if(p==null)return;const pl=frentePct(f,a=>plannedAt(a,t))||0;
    if(p>=100)pos.push(`${f.nome} concluída em 100%.`);
    else if(p-pl>=10)pos.push(`${f.nome} está ${r0(p-pl)} p.p. acima do planejado (${r0(p)}% × ${r0(pl)}%).`);
    else if(pl-p>15)att.push(`${f.nome} está ${r0(pl-p)} p.p. abaixo do avanço planejado (${r0(p)}% realizado × ${r0(pl)}% planejado).`)});
  const rec=S.atividades.filter(a=>a.concluidaEm&&dayDiff(a.concluidaEm,t)<=7&&dayDiff(a.concluidaEm,t)>=0);
  if(rec.length)pos.push(`${rec.length} atividade(s) concluída(s) nos últimos 7 dias.`);
  const dp=docPct();if(S.documentos.length&&dp>=80)pos.push(`Documentação ${r0(dp)}% completa.`);else if(S.documentos.length&&dp<50)att.push(`Documentação apenas ${r0(dp)}% completa (${S.documentos.filter(d=>d.status!=='Completo').length} documento(s) não concluídos).`);
  if(day1Info().liberado)pos.push('Checklist do Day 1 com todos os itens obrigatórios concluídos.');
  if(k.plan-k.pct>8)att.push(`Projeto ${r0(k.plan-k.pct)} p.p. abaixo do planejado para hoje (${r0(k.pct)}% × ${r0(k.plan)}%).`);
  S.atividades.filter(a=>a.status==='Bloqueado'&&+a.pct<100).forEach(a=>att.push(`"${a.nome}" está bloqueada${respNomes(a)?' ('+respNomes(a)+')':''}.`));
  S.atividades.filter(a=>+a.pct>0&&+a.pct<100&&depsPendentes(a).length).slice(0,3).forEach(a=>att.push(`"${a.nome}" avança com dependência pendente: ${depsPendentes(a).map(d=>'"'+d.nome+'"').join(', ')}.`));
  S.licencas.filter(l=>licFalta(l)>0).forEach(l=>{att.push(`Licenças insuficientes: ${l.produto} (faltam ${licFalta(l)}).`);act.push(`Providenciar ${licFalta(l)} licença(s) de ${l.produto}${pessoaNome(l.responsavelId)?' — '+pessoaNome(l.responsavelId):''}.`)});
  const pAtr=S.pendencias.filter(p=>p.status!=='Resolvida'&&p.prazo&&p.prazo<t);
  if(pAtr.length)att.push(`${pAtr.length} pendência(s) com prazo vencido.`);
  S.riscos.filter(r=>r.status!=='Encerrado'&&r.status!=='Mitigado'&&['Crítico','Alto'].includes(riscoNivel(r))).sort((a,b)=>riscoScore(b)-riscoScore(a)).forEach(r=>{
    rsk.push(`${r.risco} — criticidade ${riscoNivel(r).toLowerCase()} (${r.probabilidade}×${r.impacto})${r.prazo?', prazo '+fmtD(r.prazo):''}.`);
    if(r.plano)act.push(`${r.plano}${pessoaNome(r.responsavelId)?' — '+pessoaNome(r.responsavelId):''}`)});
  const atr=S.atividades.filter(a=>situacao(a,t)==='atrasada').sort((a,b)=>PRIORIDADES.indexOf(b.prioridade)-PRIORIDADES.indexOf(a.prioridade)||(a.fim||'').localeCompare(b.fim||''));
  atr.filter(a=>['Alta','Crítica'].includes(a.prioridade)).forEach(a=>rsk.push(`"${a.nome}" atrasada desde ${fmtD(a.fim)} com ${a.pct}% (prioridade ${a.prioridade.toLowerCase()}).`));
  atr.slice(0,4).forEach(a=>act.push(`Concluir ou replanejar "${a.nome}"${respNomes(a)?' — '+respNomes(a):''} (prazo vencido em ${fmtD(a.fim)}).`));
  S.atividades.filter(a=>situacao(a,t)!=='concluida'&&situacao(a,t)!=='atrasada'&&a.fim&&dayDiff(t,a.fim)>=0&&dayDiff(t,a.fim)<=3&&+a.pct<50&&['Alta','Crítica'].includes(a.prioridade))
    .forEach(a=>rsk.push(`"${a.nome}" vence em ${dayDiff(t,a.fim)} dia(s) com ${a.pct}%.`));
  const bloq=new Set();S.atividades.filter(a=>+a.pct<100&&a.inicio&&dayDiff(t,a.inicio)<=7).forEach(a=>depsPendentes(a).forEach(d=>{if(!bloq.has(d.id)&&situacao(d,t)!=='concluida'){bloq.add(d.id);act.push(`Destravar "${d.nome}" para liberar "${a.nome}" (início ${fmtDs(a.inicio)}).`)}}));
  S.pendencias.filter(p=>p.prioridade==='Crítica'&&p.status!=='Resolvida').forEach(p=>act.push(`Resolver pendência crítica "${p.pendencia}"${pessoaNome(p.responsavelId)?' — '+pessoaNome(p.responsavelId):''}${p.prazo?' (prazo '+fmtD(p.prazo)+')':''}.`));
  extraAnalise(pos,att,rsk,act);
  const lim=a=>a.slice(0,9);return {pos:lim(pos),att:lim(att),rsk:lim(rsk),act:lim([...new Set(act)])};
}
function analiseHTML(an){
  const col=(cls,ic,t,arr,empty)=>`<div class="col ${cls}"><h4>${ic} ${t}</h4>${arr.length?`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<div class="small muted">${empty}</div>`}</div>`;
  return `<div class="ana">${col('pos','🟢','Pontos positivos',an.pos,'Nenhum destaque positivo identificado nos dados.')}${col('att','🟡','Pontos de atenção',an.att,'Nenhum ponto de atenção identificado.')}${col('rsk','🔴','Riscos',an.rsk,'Nenhum risco alto ou crítico ativo.')}${col('act','🚨','Ações recomendadas',an.act,'Nenhuma ação pendente identificada.')}</div>`;
}
function proximasCriticas(n){const t=todayISO();return S.atividades.filter(a=>+a.pct<100).sort((a,b)=>{const sa=situacao(a,t)==='atrasada'?0:1,sb=situacao(b,t)==='atrasada'?0:1;return sa-sb||PRIORIDADES.indexOf(b.prioridade)-PRIORIDADES.indexOf(a.prioridade)||(a.fim||'9').localeCompare(b.fim||'9')}).slice(0,n)}
function statusText(){
  const k=kpis(),st=statusGeral(k),an=analise(),t=todayISO();

  let rows;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''})}catch(e){return toast('Não foi possível ler o arquivo. Use .xlsx ou .csv.','err')}
  const recs=rows.map(r=>{const o={};Object.keys(r).forEach(k=>{const m=COLMAP[nk(k)];if(m&&o[m]==null)o[m]=r[k]});return o}).filter(o=>String(o.nome||'').trim());
  if(!recs.length)return toast('Nenhuma linha com a coluna "Atividade" foi encontrada.','err');
  const novasF=new Set(recs.map(r=>String(r.frente||'Importadas').trim()).filter(n=>!S.frentes.some(f=>nk(f.nome)===nk(n))));
  openModal({title:'Importar atividades',body:`<div style="padding:16px 20px"><p><b>${recs.length}</b> atividade(s) encontradas em "${esc(f.name)}".</p>${novasF.size?`<p class="small muted">Frentes novas que serão criadas: ${esc([...novasF].join(', '))}.</p>`:''}<p class="small muted">Pessoas, macroatividades, fases e usinas são associadas pelo nome; nomes desconhecidos de pessoas e macroatividades são cadastrados automaticamente.</p></div>`,
    footer:`<button class="btn" data-n>Cancelar</button><button class="btn primary" data-y>Importar ${recs.length} atividade(s)</button>`,onMount:(bg,close)=>{$('[data-n]',bg).onclick=close;$('[data-y]',bg).onclick=()=>{doImport(recs);close()}}});
}
function doImport(recs){
  let n=0;
  recs.forEach(r=>{
    const fn=String(r.frente||'Importadas').trim();let fr=S.frentes.find(f=>nk(f.nome)===nk(fn));if(!fr){fr={id:uid('fre'),nome:fn,responsavelId:'',prioridade:'Média',peso:1,prazo:'',ordem:S.frentes.length,obs:''};S.frentes.push(fr)}
    const mn=String(r.macro||'Geral').trim();let m=S.macros.find(x=>x.frenteId===fr.id&&nk(x.nome)===nk(mn));
    const fz=String(r.fase||'').trim();const fase=fz?S.fases.find(x=>nk(x.nome).includes(nk(fz))||nk(fz).includes(nk(x.nome))):null;
    if(!m){m={id:uid('mac'),frenteId:fr.id,nome:mn,faseId:fase?fase.id:'',peso:1,ordem:S.macros.filter(x=>x.frenteId===fr.id).length};S.macros.push(m)}
    const resp=String(r.resp||'').split(/[,;\/]/).map(x=>x.trim()).filter(Boolean).map(nm=>{let p=S.pessoas.find(x=>nk(x.nome)===nk(nm));if(!p){p={id:uid('pes'),nome:nm,empresa:'',cargo:'',funcao:'',frenteIds:[fr.id],email:'',telefone:'',whatsapp:'',local:'',obs:'Cadastrada pela importação'};S.pessoas.push(p)}return p.id});
    const us=String(r.usina||'').split(/[,;\/]/).map(x=>x.trim()).filter(Boolean).map(nm=>(S.usinas.find(u=>nk(u.nome)===nk(nm))||{}).id).filter(Boolean);
    const st=STATUS.find(s=>nk(s)===nk(r.status||''))||'Não iniciado';const pr=PRIORIDADES.find(s=>nk(s)===nk(r.prioridade||''))||'Média';
    const a={id:uid('ati'),macroId:m.id,faseId:fase?fase.id:(m.faseId||''),nome:String(r.nome).trim(),responsavelIds:resp,usinaIds:us,inicio:anyToISO(r.inicio),fim:anyToISO(r.fim),status:st,pct:anyToPct(r.pct),
      prioridade:pr,peso:r.peso===''||r.peso==null?1:Number(r.peso)||1,dependeDe:[],obs:String(r.obs||''),evidencia:'',concluidaEm:'',subs:[],ordem:S.atividades.filter(x=>x.macroId===m.id).length};
    syncActivity(a,null);S.atividades.push(a);bumpPessoasFrentes(a);n++;
  });
  logChange('Importação','Excel/CSV','Atividades importadas','',String(n));commit();toast(n+' atividade(s) importada(s).');
}
async function importBackup(){
  if(readOnly)return toast('Modo somente leitura.','err');const f=await pickFile('.json,application/json');if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.atividades))throw 0;

}

  if(best<2)return {err:'Não reconheci o cabeçalho. Copie a planilha incluindo a linha de títulos das colunas (ex.: UFV, Sigla, Palo Alto…).'};
  const {m}=mapRow(rows[bi]);if(!m.some(x=>x&&(x.name||x.sigla||x.k==='sigla')))return {err:'O cabeçalho precisa ter a coluna da usina (UFV/UFVs) ou a Sigla.'};

  return {recs,cols:m.filter(Boolean).length};
}

function parseCSV(t,sep){const out=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===sep){row.push(f);f=''}else if(ch==='\n'){row.push(f);out.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
  if(f||row.length){row.push(f);out.push(row)}return out}
async function importDDcsv(){
  if(readOnly)return toast('Modo somente leitura.','err');const f=await pickFile('.csv,.txt');if(!f)return;
  const buf=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}
  const sep=(t.split('\n').find(l=>/^"?ID"?[;,\t]/.test(l))||';').match(/[;,\t]/)[0];const rows=parseCSV(t,sep);
  const hi=rows.findIndex(r=>nk(r[0])==='id');if(hi<0)return toast('Não encontrei a linha de cabeçalho começando por "ID".','err');
  const H=rows[hi].map(nk);const col=(...ks)=>H.findIndex(h=>ks.some(k=>h.startsWith(k)));
  const ix={id:0,dominio:col('dominio'),pergunta:col('pergunta'),evidEsperada:col('evidenciareferenciaesperada'),situacao:col('situacao'),resposta:col('resposta'),evidencia:H.findIndex((h,i)=>h.startsWith('evidencia')&&i!==col('evidenciareferenciaesperada')),responsavel:col('responsavel'),obs:col('observ'),criticidade:col('critic')};
  const clean=s=>String(s||'').replace(/\\n/g,' / ').replace(/\s+/g,' ').trim();
  const recs=rows.slice(hi+1).filter(r=>/^[A-Z]+-[A-Z]+-\d+/.test((r[0]||'').trim())).map(r=>{const o={};Object.entries(ix).forEach(([k,i])=>o[k]=i>=0?clean(r[i]):'');return o});
  if(!recs.length)return toast('Nenhum item com ID (ex.: M-GOV-01) foi encontrado.','err');
  const novos=recs.filter(r=>!S.dd.some(x=>x.id===r.id)).length;
  if(!await askConfirm(`${recs.length} item(ns) no arquivo: ${novos} novo(s) e ${recs.length-novos} atualização(ões). Frente relacionada e "ação para a migração" que você já preencheu são mantidas.`,'Importar'))return;
  recs.forEach(r=>{const x=S.dd.find(y=>y.id===r.id);if(x){Object.keys(r).forEach(k=>{if(r[k]!==''||k==='resposta'||k==='situacao')x[k]=r[k]})}else S.dd.push({...r,criticidade:r.criticidade||'Média',situacao:r.situacao||'Pendente',frenteId:'',acao:''})});
  logChange('Importação','Due diligence TI/OT','Itens importados','',String(recs.length));commit();toast('Questionário importado.');
}

create or replace function public.pode_editar() returns boolean language sql stable security definer set search_path = public as $$

create or replace function public.novo_perfil() returns trigger language plpgsql security definer set search_path = public as $$
declare tem_admin boolean;
begin
  select exists(select 1 from perfis where papel = 'admin') into tem_admin;
  insert into perfis(user_id, email, nome, papel, ativo)
  values (new.id, new.email, coalesce(new.raw_user_meta_data->>'nome', new.email),
          case when tem_admin then 'usuario' else 'admin' end, not tem_admin)
  on conflict (user_id) do nothing;
  return new;
end $$;
create or replace function public.guardar_versao() returns trigger language plpgsql security definer set search_path = public as $$
begin
  insert into projeto_versoes(projeto_id, rev, state, updated_by) values (old.id, old.rev, old.state, old.updated_by);
  delete from projeto_versoes where projeto_id = old.id and seq < (
    select min(seq) from (select seq from projeto_versoes where projeto_id = old.id order by seq desc limit 300) t);
  return new;
end $$;

    create policy versoes_ler on public.projeto_versoes for select to authenticated using (eh_ativo()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='perfis' and policyname='perfis_ler') then
    create policy perfis_ler on public.perfis for select to authenticated using (user_id = auth.uid() or eh_admin()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='perfis' and policyname='perfis_admin') then
    create policy perfis_admin on public.perfis for update to authenticated using (eh_admin()) with check (eh_admin()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='config_app' and policyname='config_ler') then
    create policy config_ler on public.config_app for select to authenticated using (eh_ativo()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='config_app' and policyname='config_admin_ins') then
    create policy config_admin_ins on public.config_app for insert to authenticated with check (eh_admin()); end if;
  if not exists (select 1 from pg_policies where schemaname='public' and tablename='config_app' and policyname='config_admin_upd') then

  if not exists (select 1 from pg_policies where schemaname='public' and tablename='config_app' and policyname='config_publico') then
    create policy config_publico on public.config_app for select to anon, authenticated using (id = 'aparencia'); end if;
end $$;
